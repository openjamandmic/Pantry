<style>
:root{

  --green:#008CC2; --green-ink:#FFFFFF; --green-soft:rgba(0,140,194,.13); --green-deep:#006C96; --stock:#4FA85D; --stock-soft:rgba(79,168,93,.16); --full:#008CC2; --full-soft:rgba(0,140,194,.14);
  --amber:#D99A1E; --amber-soft:#FBF1D9; --red:#C9463D; --red-soft:#FBE4E2; --blue:#3B7CA3; --blue-soft:#E1EEF5;
  --shadow:0 1px 2px rgba(31,42,34,.06),0 6px 20px rgba(31,42,34,.06); --r:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --title:#DCE6F5;
  --bg:#111613; --surface:#181F1A; --panel:#1C241E; --ink:#E9EEEA; --muted:#9BA69F; --line:#2B352E;
  --green:#5DB37F; --green-ink:#0F1A13; --green-soft:#1F3327; --green-deep:#7CC79A;
  --amber:#E3AE3A; --amber-soft:#3C3117; --red:#E0665D; --red-soft:#432422; --blue:#6AA7CF; --blue-soft:#1E3240;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{ --title:#DCE6F5;
  --bg:#111613; --surface:#181F1A; --panel:#1C241E; --ink:#E9EEEA; --muted:#9BA69F; --line:#2B352E;
  --green:#5DB37F; --green-ink:#0F1A13; --green-soft:#1F3327; --green-deep:#7CC79A;
  --amber:#E3AE3A; --amber-soft:#3C3117; --red:#E0665D; --red-soft:#432422; --blue:#6AA7CF; --blue-soft:#1E3240;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:16px/1.45 Calibri,"Carlito","Segoe UI",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-weight:700; letter-spacing:-.01em; margin:0; line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem} h4{font-size:.95rem; color:var(--muted); font-weight:600}
h1,h2,h3,.tour-card h2,#splash .wel h1,.mealcard .nm,.recipe .nm,.item .nm b,.pslot .nm{color:var(--title,inherit)}
p{margin:0 0 .6em}
a{color:var(--green)}
button{font:inherit; color:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:.5em .95em; line-height:1.2}
button:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--green-soft); outline-offset:1px; border-color:var(--green)}
button.primary{background:var(--green); color:var(--green-ink); border-color:var(--green); font-weight:700}
button.primary:hover{background:var(--green-deep); border-color:var(--green-deep)}
button.soft{background:var(--green-soft); border-color:transparent; color:var(--green-deep); font-weight:600}
button.danger{color:var(--red); border-color:var(--red)}
button.ghost{background:transparent; border-color:transparent}
button.ghost:hover{background:var(--surface); border-color:transparent}
button.small{padding:.35em .7em; font-size:.9rem} button.tiny{padding:.15em .55em; font-size:.82rem}
button.block{width:100%} button:disabled{opacity:.45; cursor:not-allowed}
input,select,textarea{font:inherit; color:inherit; background:var(--panel-solid,var(--panel)); border:1px solid var(--line); border-radius:10px; padding:.55em .7em; width:100%}
input[type=checkbox],input[type=radio]{width:auto; accent-color:var(--green)}
input[type=range]{padding:0; accent-color:var(--green)}
textarea{min-height:70px; resize:vertical}
label{display:block; font-weight:600; font-size:.92rem; margin:.75em 0 .3em}
label .hint{font-weight:400; color:var(--muted)}
.row{display:flex; gap:.6em; align-items:center; flex-wrap:wrap} .row.between{justify-content:space-between} .row.nowrap{flex-wrap:nowrap}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.7em} .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.7em}
@media (max-width:520px){ .grid3{grid-template-columns:1fr 1fr} }
.muted{color:var(--muted)} .tiny{font-size:.84rem} .small{font-size:.92rem}
.stack>*+*{margin-top:.8em}
hr{border:0; border-top:1px solid var(--line); margin:1.1em 0}
.check{display:flex; align-items:flex-start; gap:.6em; margin:.45em 0; font-weight:600; cursor:pointer} .check input{margin-top:.3em} .check .hint{font-weight:400; color:var(--muted)}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:1em 1.1em; box-shadow:var(--shadow)}
.card.flat{box-shadow:none; background:var(--surface); border-color:transparent}
.card.green{background:var(--green); color:var(--green-ink); border-color:var(--green)} .card.green .muted{color:rgba(255,255,255,.8)}
.chip{display:inline-block; padding:.12em .6em; border-radius:999px; font-size:.8rem; font-weight:600; background:var(--surface); border:1px solid var(--line); white-space:nowrap}
.chip.full{background:var(--full-soft,var(--green-soft)); border-color:transparent; color:var(--full,var(--green))} .chip.good{background:var(--stock-soft,var(--green-soft)); border-color:transparent; color:var(--stock,var(--green-deep))} .chip.ok{background:var(--amber-soft); border-color:transparent} .chip.bad{background:var(--red-soft); border-color:transparent} .chip.info{background:var(--blue-soft); border-color:transparent}
.gauge{height:8px; background:var(--line); border-radius:99px; overflow:hidden} .gauge i{display:block; height:100%; background:var(--green)} .gauge i.warn{background:var(--amber)} .gauge i.bad{background:var(--red)}
.toast{position:fixed; left:50%; bottom:calc(5.2em + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:.6em 1.1em; border-radius:999px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; font-weight:600; max-width:92vw; text-align:center}
.toast.show{opacity:1}
@media (min-width:901px){ .toast{bottom:1.5em} }

/* shell */
#app{min-height:100%; display:flex; flex-direction:column}
body.shell::before{content:''; position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top,0px); background:var(--topnav,var(--nav,var(--bg))); z-index:21}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--topnav,var(--nav,var(--bg))); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:.8em; padding:.7em 1.1em}
.topbar .brand{display:flex; align-items:center; gap:.5em; font-weight:700}
.topbar .brand i{width:28px; height:28px; border-radius:8px; background:var(--green); display:inline-grid; place-items:center; color:#fff; font-style:normal; font-size:1rem}
.topbar nav{display:flex; gap:.2em; margin-left:1em}
.topbar nav button{border:0; background:transparent; padding:.45em .8em; border-radius:999px; color:var(--muted); font-weight:600}
.topbar nav button.active{background:var(--green-soft); color:var(--green-deep)}
.topbar nav button .n{display:inline-block; min-width:1.3em; padding:0 .3em; margin-left:.3em; border-radius:999px; background:var(--red); color:#fff; font-size:.72rem; text-align:center}
.topbar .spacer{flex:1}
.topbar .acct{display:flex; align-items:center; gap:.6em}
.topbar{color:#fff} .topbar .brand{color:#fff} .topbar .brand i{background:rgba(255,255,255,.28)} .topbar nav button{color:rgba(255,255,255,.88)} .topbar nav button.active{background:rgba(255,255,255,.32); color:#fff} .topbar .morebtn{background:rgba(255,255,255,.3); border-color:transparent; color:#fff} .topbar .morebtn .n{background:var(--red)} .topbar .uname,.topbar .acct{color:#fff}
.morebtn{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:.35em .8em; font-weight:600; color:var(--muted); position:relative; display:inline-flex; align-items:center; gap:.3em}
.morebtn span[aria-hidden]{font-size:1.1rem; line-height:1}
.morebtn.active{background:var(--green-soft); color:var(--green-deep); border-color:transparent}
.histbtn .lbl{font-size:.9rem} @media (max-width:520px){ .histbtn .lbl{display:none} .histbtn{padding:.35em .55em} }
.greet{font-size:2.2rem; letter-spacing:-.01em; margin-bottom:.1em}
.mpick{position:relative} .mpick-q{margin-top:.25em} .mpick-list{position:absolute; left:0; right:0; top:calc(100% + 2px); z-index:30; background:var(--panel-solid,var(--panel)); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); max-height:300px; overflow:auto} .mpick-list[hidden]{display:none}
.mpick-g{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:.5em .7em .2em} .mpick-item{display:flex; align-items:center; gap:.5em; width:100%; text-align:left; padding:.5em .7em; background:none; border:0; border-radius:0; font-size:.93rem} .mpick-item:hover,.mpick-item:focus{background:var(--green-soft)} .mpick-item .sub{margin-left:auto; opacity:.65; font-size:.78rem; text-align:right}
#splash{position:fixed; inset:0; z-index:500; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4em; transition:opacity .5s} #splash[hidden]{display:none} #splash.out{opacity:0; pointer-events:none}
.cab{width:min(280px,72vw); aspect-ratio:1/1.1; position:relative; perspective:700px; perspective-origin:50% 45%; transform-style:preserve-3d}
.cab .box{position:absolute; inset:0; background:linear-gradient(#f7ecd8,#e5d2b1); border:10px solid #8a5a2b; border-radius:12px; box-shadow:inset 0 0 40px rgba(0,0,0,.18), 0 18px 40px rgba(0,0,0,.18); display:flex; flex-direction:column; justify-content:space-around; padding:.6em .4em; overflow:hidden}
.cab .glow{position:absolute; inset:10px; border-radius:6px; background:radial-gradient(ellipse at 50% 20%, rgba(255,236,170,.75), rgba(255,236,170,0) 70%); opacity:0; animation:shelfIn .8s ease-out .9s forwards; pointer-events:none}
.cab .shelf{display:flex; justify-content:space-around; align-items:flex-end; font-size:1.7rem; border-bottom:6px solid #a8743d; padding-bottom:.1em; opacity:0; transform:translateY(8px); animation:shelfIn .5s ease-out forwards}
.cab .shelf:nth-child(1){animation-delay:.9s} .cab .shelf:nth-child(2){animation-delay:1.05s} .cab .shelf:nth-child(3){animation-delay:1.2s}
.cab .door{position:absolute; top:0; bottom:0; width:50%; background:repeating-linear-gradient(90deg,#a96d37 0 6px,#b47a42 6px 9px,#a56a35 9px 18px); border:4px solid #7a4d22; box-sizing:border-box; box-shadow:inset 0 0 0 12px rgba(255,255,255,.1), inset 0 0 0 13px rgba(0,0,0,.15), 0 6px 14px rgba(0,0,0,.25); will-change:transform}
.cab .door::after{content:''; position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:#f5d27a; box-shadow:0 1px 2px rgba(0,0,0,.4); transform:translateY(-50%)}
.cab .door.l{left:0; border-radius:12px 0 0 12px; transform-origin:left center; animation:doorL 1.3s cubic-bezier(.5,0,.3,1) .55s forwards} .cab .door.l::after{right:10px}
.cab .door.r{right:0; border-radius:0 12px 12px 0; transform-origin:right center; animation:doorR 1.3s cubic-bezier(.5,0,.3,1) .55s forwards} .cab .door.r::after{left:10px}
@keyframes doorL{0%{transform:rotateY(0)} 100%{transform:rotateY(-112deg)}} @keyframes doorR{0%{transform:rotateY(0)} 100%{transform:rotateY(112deg)}} @keyframes shelfIn{to{opacity:1; transform:none}}
#splash .wel{text-align:center; opacity:0; transform:translateY(10px); animation:shelfIn .6s ease-out 1.3s forwards} #splash .wel h1{font-size:1.9rem; margin:0} #splash .wel p{margin:.3em 0 0; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .cab .door{animation:none; display:none} .cab .shelf,#splash .wel{animation:none; opacity:1; transform:none} }
.hday{margin-top:1.1em} .hday h3{font-size:.95rem; margin:0 0 .3em; color:var(--muted); font-weight:700} .hrow{display:flex; gap:.6em; align-items:flex-start; padding:.5em .2em; border-bottom:1px solid var(--line); font-size:.93rem} .hrow .ht{width:3.6em; flex:none; color:var(--muted); font-size:.8rem; padding-top:.15em} .hrow .he{flex:none; font-size:1.2rem} .hrow .plus{color:var(--green-deep); font-weight:700} .hrow .minus{color:var(--red); font-weight:700}
.morebtn .n{display:inline-block; min-width:1.3em; padding:0 .3em; margin-left:.2em; border-radius:999px; background:var(--red); color:#fff; font-size:.72rem; text-align:center}
.n.g{background:var(--green) !important}
@media (max-width:520px){ .topbar .uname{max-width:7em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} }
.view{flex:1; width:100%; max-width:980px; margin:0 auto; padding:1.2em 1.1em 6em}
@media (min-width:901px){ .view{padding-bottom:2em} }
.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:20; display:none; background:var(--nav,var(--bg)); border-top:1px solid var(--line); padding:.3em .3em calc(.3em + env(safe-area-inset-bottom,0px))}
.bottomnav button{flex:1; border:0; background:transparent; border-radius:10px; padding:.45em 0 .35em; display:flex; flex-direction:column; align-items:center; gap:.15em; color:var(--muted); font-size:.74rem; font-weight:600; position:relative}
.bottomnav button span.ic{font-size:1.6rem; line-height:1.05}
.bottomnav button.active{color:var(--green-deep); background:var(--green-soft)}
.bottomnav button .n{position:absolute; top:.15em; right:18%; min-width:1.3em; padding:0 .3em; border-radius:999px; background:var(--red); color:#fff; font-size:.68rem; text-align:center}
@media (max-width:900px){ .topbar nav{display:none} .bottomnav{display:flex} }
.section{margin-top:1.4em} .section h2{margin-bottom:.5em}
.hero{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:70vh; padding:2em 1em}
.hero .logo{width:72px; height:72px; border-radius:20px; background:var(--green); display:grid; place-items:center; font-size:2rem; color:#fff; margin-bottom:1em; box-shadow:var(--shadow)}
.hero h1{font-size:2rem} .hero p{color:var(--muted); max-width:440px; font-size:1.05rem}
.authcard{max-width:400px; width:100%; margin:1.2em auto 0; text-align:left}
.steps{display:flex; gap:.35em; margin:0 0 1.2em; flex-wrap:wrap} .steps span{width:28px; height:6px; border-radius:99px; background:var(--line)} .steps span.on,.steps span.done{background:var(--green)} .steps span.on{opacity:1} .steps span.done{opacity:.5}

/* lists */
.item{display:grid; grid-template-columns:2em minmax(0,1.5fr) minmax(0,1fr) 160px auto; gap:.6em; align-items:center; padding:.6em .4em; border-bottom:1px solid var(--line)}
.item.off{opacity:.5} .item .em{font-size:1.4rem; text-align:center} .item .nm{font-weight:700} .item .nm small{display:block; font-weight:400; color:var(--muted); font-size:.8rem}
.item .tgt{font-size:.9rem} .item .tgt small{display:block; color:var(--muted); font-size:.78rem}
.item .qty{display:flex; align-items:center; gap:.3em} .item .qty input{width:70px; text-align:right; padding:.35em .4em} .item .qty span{font-size:.8rem; color:var(--muted)}
.item .st{display:flex; flex-direction:column; gap:.25em; align-items:flex-end; min-width:90px}
.item .bar{width:90px; height:6px; background:var(--line); border-radius:99px; overflow:hidden} .item .bar i{display:block; height:100%; background:var(--full,var(--green))} .item .bar i.good{background:var(--stock,var(--green))} .item .bar i.warn{background:var(--amber)} .item .bar i.bad{background:var(--red)}
@media (max-width:640px){ .item{grid-template-columns:2em minmax(0,1fr) auto} .item .tgt{grid-column:2; font-size:.82rem} .item .st{grid-column:3; grid-row:1/3} .item .qty{grid-column:2/4} }
.recipe{display:flex; gap:.8em; padding:.7em .4em; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start} .recipe:hover{background:var(--surface)}
.recipe .em{font-size:1.6rem; width:1.6em; text-align:center; flex:none} .recipe .nm{font-weight:700} .recipe .meta{color:var(--muted); font-size:.85rem}
.wr{display:flex; gap:.6em; align-items:center; padding:.4em .2em; border-bottom:1px solid var(--line)}
.alerts{list-style:none; margin:0; padding:0} .alerts li{display:flex; gap:.6em; align-items:flex-start; padding:.5em .5em; border-radius:10px; cursor:pointer} .alerts li:hover{background:var(--surface)}
.dot{width:.65em; height:.65em; border-radius:50%; flex:none; margin-top:.45em} .dot.out{background:var(--red)} .dot.low{background:var(--amber)} .dot.exp{background:var(--blue)} .dot.space{background:var(--green)}
.shop li{display:flex; gap:.6em; align-items:center; padding:.5em .3em; border-bottom:1px solid var(--line); flex-wrap:wrap} .shop li b{flex:1; min-width:120px} .shop li input[type=number]{width:70px; text-align:right}
.mealcard{display:flex; gap:.8em; align-items:center; padding:.7em; border:1px solid var(--line); border-radius:12px; background:var(--panel)} .mealcard .em{font-size:1.8rem} .mealcard .lab{font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:700} .mealcard .nm{font-weight:700}
.plan-day{border:1px solid var(--line); border-radius:12px; padding:.7em .8em; background:var(--panel)} .plan-day.today{border-color:var(--green)} .plan-day h3{display:flex; justify-content:space-between; align-items:baseline} .plan-day select{margin-top:.35em}
.pslot{display:flex; align-items:center; gap:.5em; width:100%; text-align:left; margin-top:.3em; padding:.5em .65em; border:1px solid var(--line); border-radius:10px; background:var(--panel); font-size:.93rem} .pslot .em{font-size:1.15rem} .pslot .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .pslot.empty .nm{color:var(--muted)} .pslot .chev{opacity:.5} .plan-day .mpick-q{margin-top:.3em}
.plan-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.7em}
dialog{border:0; border-radius:18px; padding:0; background:var(--panel-solid,var(--panel)); color:var(--ink); box-shadow:var(--shadow); width:min(600px,94vw); max-height:88vh}
dialog::backdrop{background:rgba(20,28,22,.45)} dialog .dbody{padding:1.2em; overflow:auto; max-height:88vh}
.kv{display:grid; grid-template-columns:auto 1fr; gap:.2em .8em; font-size:.92rem} .kv b{color:var(--muted); font-weight:600}
.ing{display:grid; grid-template-columns:1fr auto auto; gap:.3em .8em; font-size:.92rem; align-items:center} .ing .no{color:var(--red)}
.spick{position:relative} .spick-list{position:absolute; left:0; right:0; top:calc(100% + 2px); z-index:20; background:var(--panel-solid,var(--panel)); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); max-height:230px; overflow:auto} .spick-list[hidden]{display:none}
.spick-item{display:flex; align-items:center; gap:.5em; width:100%; text-align:left; padding:.5em .7em; background:none; border:0; border-bottom:1px solid var(--line); border-radius:0; font-size:.92rem} .spick-item:last-child{border-bottom:0} .spick-item:hover,.spick-item:focus{background:var(--soft,rgba(0,0,0,.04))} .spick-item.new{color:var(--green-deep); font-weight:700} .spick-item .u{margin-left:auto; opacity:.6; font-size:.8rem}
.tour-spot{}
body.touring dialog[open]{position:fixed; inset:auto; top:calc(.6em + env(safe-area-inset-top,0px)); left:0; right:0; margin:0 auto; transform:none; z-index:101; max-height:50vh; width:min(600px,calc(100vw - 1.2em)); max-width:calc(100vw - 1.2em); box-sizing:border-box; overflow:hidden}
body.touring dialog[open] .dbody{max-height:50vh; padding-bottom:45vh}
#tourBlock{position:fixed; inset:0; z-index:102; background:transparent; touch-action:none}
#tourRing{position:fixed; z-index:103; border-radius:12px; pointer-events:none; box-shadow:0 0 0 3px var(--amber),0 0 0 7px rgba(255,255,255,.35),0 0 0 9999px rgba(20,28,22,.58); transition:top .25s,left .25s,width .25s,height .25s}
#tourRing.none{top:50%!important; left:50%!important; width:0!important; height:0!important; box-shadow:0 0 0 9999px rgba(20,28,22,.58)}
#tour{position:fixed; left:0; right:0; z-index:104; display:flex; justify-content:center; padding:0 .7em; pointer-events:none}
#tour.bot{bottom:calc(.7em + env(safe-area-inset-bottom,0px))} #tour.top{top:calc(.5em + env(safe-area-inset-top,0px))} #tour.mid{top:50%; transform:translateY(-50%)}
.tour-card{pointer-events:auto; background:var(--panel-solid,var(--panel)); border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.4); padding:1em 1.1em; width:100%; max-width:540px; max-height:42vh; overflow:auto; box-sizing:border-box}
@media (max-width:520px){ .tour-card{padding:.8em .9em; max-height:38vh} .tour-card p{font-size:.95rem; margin:.45em 0 .6em} .tour-card h2{font-size:1.1rem} .tour-ic{width:36px; height:36px; font-size:1.2rem; border-radius:11px} }
.tour-ic{flex:none; width:44px; height:44px; border-radius:14px; background:var(--green-soft); display:grid; place-items:center; font-size:1.5rem}
.tour-card h2{font-size:1.25rem; margin:0}
.tour-card p{font-size:1.02rem; line-height:1.45; color:var(--ink); margin:.6em 0 .8em}
.tour-prog{height:5px; border-radius:99px; background:var(--line); overflow:hidden} .tour-prog i{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .25s}
.tour-sec{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--green-deep)}
#tour.mid .tour-card{max-height:80vh}
button.big{padding:.85em 1.4em; font-size:1.1rem; border-radius:14px}
.addtiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:.7em; margin-top:.7em}
.addtile{display:flex; flex-direction:column; align-items:flex-start; gap:.3em; text-align:left; padding:1em 1.1em; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:var(--shadow)}
.addtile:hover{border-color:var(--green); background:var(--green-soft)} .addtile .ic{font-size:1.8rem; line-height:1} .addtile b{font-size:1.05rem}
.myrow{display:grid; grid-template-columns:1.8em minmax(0,1fr) auto; gap:.3em .7em; align-items:center; padding:.55em .2em; border-bottom:1px solid var(--line)}
.myrow .em{font-size:1.3rem; text-align:center} .myrow .nm b{display:block} .myrow .ctl{display:flex; align-items:center; gap:.4em; flex-wrap:wrap; justify-content:flex-end}
.myrow select{width:auto; font-size:.85rem; padding:.3em .4em}
@media (max-width:640px){ .myrow{grid-template-columns:1.8em minmax(0,1fr)} .myrow .ctl{grid-column:2; justify-content:flex-start} }
.pickrow{display:flex; gap:.7em; align-items:center; width:100%; padding:.6em .5em; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent}
.pickrow:hover{background:var(--surface)} .pickrow[aria-disabled="true"]{cursor:default; opacity:.75} .pickrow .em{font-size:1.4rem; width:1.5em; text-align:center}
.pickrow.open{display:block; background:var(--green-soft); border-radius:12px; border:0; margin:.3em 0; padding:.8em}
.stockhead{display:none}
.stockrow{display:grid; grid-template-columns:1.8em minmax(0,1fr) 150px 150px; gap:.4em .8em; align-items:center; padding:.55em .2em; border-bottom:1px solid var(--line)}
.stockrow .em{font-size:1.3rem; text-align:center} .stockrow .nm b{display:block} .stockrow .fld{margin:0; font-weight:400} .stockrow .fld>.tiny{display:none}
.stockrow input{width:84px; text-align:right} .stockrow .u{width:3.2em}
@media (min-width:641px){ .stockhead{display:grid; grid-template-columns:1.8em minmax(0,1fr) 150px 150px; gap:.8em; font-size:.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:1em} }
@media (max-width:640px){ .stockrow{grid-template-columns:1.8em minmax(0,1fr) minmax(0,1fr)} .stockrow .nm{grid-column:2/4} .stockrow .fld:nth-of-type(1){grid-column:2} .stockrow .fld>.tiny{display:block; margin-bottom:.1em} .stockrow input{width:100%} }
:root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

function logH(e){e.t=new Date().toISOString();state.history.push(e);if(state.history.length>900)state.history=state.history.slice(-750);}

function markDone(ds,slot){if(!ds||!slot)return;const p=state.plan[ds]||(state.plan[ds]={});p.done=p.done||{};p.done[slot]=true;}

function loSources(beforeDs){const out=[];const t=iso(today());Object.keys(state.plan).sort().forEach(ds=>{if(ds<t||(beforeDs&&ds>=beforeDs))return;onMeals().forEach(slot=>{const v=state.plan[ds][slot];if(!v||!recipe(v))return;const r=recipe(v);if(!r||r.yields)return;const b=planBatches(ds,slot);const sv=loFromBatches(r,b);if(sv>0.05)out.push({key:ds+'|'+slot,ds,slot,r,b,servings:sv,used:ploUsed(ds+'|'+slot)});});});return out;}
function srcLabel(x){const d=parseISO(x.ds);return `${x.ds===iso(today())?'today':DOW3[d.getDay()]+' '+d.getDate()} ${x.slot}`;}
function cleanPlan(){Object.keys(state.plan).forEach(d=>{const p=state.plan[d];SLOTS.forEach(k=>{const v=p[k];if(v&&String(v).startsWith('plo:')){const [sd,ss]=v.slice(4).split('|');const srcId=state.plan[sd]&&state.plan[sd][ss];if(!srcId||!recipe(srcId)||sd>=d)delete p[k];}});if(!SLOTS.some(k=>p[k]))delete state.plan[d];});}

function inPrefs(s){const p=state.prefs;if(p.veg&&s.tags.includes('meat'))return false;if(p.gf&&s.tags.includes('gluten'))return false;if(!p.water&&s.tags.includes('water'))return false;return true;}

function freq(id){let f=Number(state.recipes[id])||0;MEALS.forEach(m=>{const M=state.meals[m];if(!M||!M.count)return;if(M.mains.includes(id)&&M.mains.length)f+=M.count/M.mains.length;if(M.sides.includes(id)&&M.sides.length)f+=M.count/M.sides.length;});return f;}

let _demand=null;
function servesOf(r){return r&&!r.yields?(Number(r.serves)||4):1;}
function factor(r){if(r.yields)return 1;return people()/servesOf(r);}   // rotation average: one serving per person; leftovers from whole batches get eaten on other days

function isBasic(s){if(s.id==='water')return true;const o=state.items[s.id];if(o&&o.basic!=null)return !!o.basic;return false;}

function rate(s){const d=recipeDemand();return (d.meals[s.id]||0)+(d.extras[s.id]||0)+basicRate(s);}   // weekly average
function recipeIngs(r){const sc=factor(r);const m={};r.ings.forEach(([id,q,opt])=>{if(opt)return;m[id]=(m[id]||0)+q*sc;});return m;}
function planFor(dateStr){return state.plan[dateStr]||{};}

function dayDemand(s,dateStr){const d=recipeDemand();let v=((d.extras[s.id]||0)+basicRate(s))/7;const p=planFor(dateStr);
  if(dayPlanned(dateStr)){SLOTS.forEach(k=>{const r=p[k]&&recipe(p[k]);if(r)v+=batchIngs(r,planBatches(dateStr,k))[s.id]||0;});}else v+=(d.meals[s.id]||0)/7;return v;}
function cadenceWeeks(){return state.shopsPerMonth>=4?1:state.shopsPerMonth===2?2:state.shopsPerMonth===3?1:4;}
function nextShopDate(after){const t=after||today();let d=state.shopAnchor?parseISO(state.shopAnchor):null;if(!d){d=new Date(t);while(d.getDay()!==state.shopDay)d.setDate(d.getDate()+1);}

function planned(){return allStaples().filter(s=>inPrefs(s)&&!it(s.id).off&&(rate(s)>0||periodDemand(s)>0));}
function pkgs(s,qty){return Math.max(0,Math.ceil((qty-1e-9)/s.pkg));}

  let st='stocked',cls='full',label='Full stock';if(on<=0){st='out';cls='bad';label='Out';}else if(ratio<0.10){st='low';cls='bad';label='Low';}else if(ratio<0.29){st='ok';cls='ok';label='Getting low';}else if(ratio<0.50){st='stocked';cls='good';label='In stock';}

  if(!L.length)h+=`<div class="card flat" style="margin-top:1em;text-align:center;padding:2em 1.2em"><div style="font-size:2.6rem">🥡</div><b>No leftovers in the bank yet</b><p class="small muted" style="margin:.4em auto 0;max-width:420px">A recipe that serves 4 cooked for ${householdLabel()} leaves ${num(Math.max(0,4-people()),1)} servings over — when you tap "I made it", those land here automatically. Cook more batches to bank more.</p></div>`;
  else h+=`<div class="stack" style="margin-top:1em">${L.slice().sort((x,y)=>x.made.localeCompare(y.made)).map(l=>`<div>${leftoverCard(l)}<div class="row" style="margin:.4em 0 0 .2em"><select data-act="lo-plan" data-lo="${l.id}" style="width:auto;flex:1;max-width:340px;font-size:.9rem"><option value="">Plan it for…</option>${loPlanOptions(l)}</select></div></div>`).join('')}</div>`;
  if(src.length)h+=`<h3 style="margin-top:1.4em">Coming up from your plan</h3><p class="tiny muted">Leftovers your planned meals will create. Plan them for a later day now; they move into the bank once you cook.</p><div class="stack">${src.map(x=>{const left=Math.max(0,Math.round((x.servings-x.used)*10)/10);return `<div><div class="mealcard"><span class="em">🥡</span><div style="flex:1;min-width:0"><div class="nm">${x.r.e} ${esc(x.r.n)}</div><div class="tiny muted">${num(x.servings,1)} serving${x.servings===1?'':'s'} from ${srcLabel(x)} (${x.b} batch${x.b===1?'':'es'}) · ${left?`${num(left,1)} not planned yet`:'all planned'}</div></div></div><div class="row" style="margin:.4em 0 0 .2em"><select data-act="plo-plan" data-key="${x.key}" style="width:auto;flex:1;max-width:340px;font-size:.9rem"><option value="">Plan them for…</option>${loPlanOptions(null,x.ds)}</select></div></div>`;}).join('')}</div>`;
  h+=`<p class="tiny muted" style="margin-top:1.2em">Food-safety rule of thumb: eat refrigerated leftovers within 3–4 days, or freeze them sooner.</p>`;
  return h;}
/* ============================================================ history view */
function hTime(t){const d=new Date(t);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
function hDay(t){const d=new Date(t);return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()));}
function mealText(e){const slot=e.slot?SLOT_LABEL[e.slot]?.toLowerCase()||e.slot:'';switch(e.how){
  case 'cooked':return `Cooked <b>${esc(e.n)}</b>${slot?` for ${slot}`:''} · ${e.b} batch${e.b===1?'':'es'}, ${num(e.servings,1)} servings${e.lo?` · ${num(e.lo,1)} to leftovers`:''}`;
  case 'prep':return `Meal-prepped <b>${esc(e.n)}</b> · ${e.b} batch${e.b===1?'':'es'} → ${num(e.servings,1)} servings into the leftover bank`;
  case 'leftovers':return `Ate leftovers · <b>${esc(e.n)}</b>${slot?` for ${slot}`:''} · ${num(e.servings,1)} serving${e.servings===1?'':'s'}`;
  case 'takeout':return `Takeout · <b>${esc(e.n)}</b>${slot?` for ${slot}`:''}${e.lo?` · ${num(e.lo,1)} serving${e.lo===1?'':'s'} saved as leftovers`:''}`;
  case 'made':return `Made <b>${esc(e.n)}</b> for the shelf · ${e.b} batch${e.b===1?'':'es'}`;
  default:return esc(e.n||'');}}
function renderHistory(){const H=state.history.slice().reverse();const f=ui.hfilter||'all';const list=H.filter(e=>f==='all'||(f==='meals'?e.k==='meal':e.k==='stock'));const days=ui.hdays||14;const cutoff=iso(addDays(today(),-days));
  const wk=iso(addDays(today(),-6));const wkMeals=H.filter(e=>e.k==='meal'&&e.ds>=wk);const cnt=h=>wkMeals.filter(e=>e.how===h).length;
  const groups=[];list.forEach(e=>{const d=hDay(e.t);if(d<cutoff)return;let g=groups[groups.length-1];if(!g||g.d!==d){g={d,items:[]};groups.push(g);}g.items.push(e);});
  const older=list.some(e=>hDay(e.t)<cutoff);
  let h=`<h1>History</h1><p class="muted">Every meal you ate and every change to the pantry, newest first. ${f==='all'?'Cooking, leftovers and takeout show as meals; shopping, cooking and manual edits show as pantry changes.':''}</p>
  <div class="card flat" style="margin:.6em 0"><b>Last 7 days</b><div class="row" style="gap:.4em;margin-top:.4em"><span class="chip good">🍳 ${cnt('cooked')} cooked</span><span class="chip">🥡 ${cnt('leftovers')} leftover meals</span><span class="chip">🛍️ ${cnt('takeout')} takeout</span>${cnt('prep')?`<span class="chip info">🍱 ${cnt('prep')} meal preps</span>`:''}</div></div>
  <div class="row" style="gap:.4em;margin:.6em 0">${[['all','All'],['meals','Meals'],['stock','Pantry changes']].map(([k,l])=>`<button class="small ${f===k?'soft':''}" data-act="hfilter" data-f="${k}">${l}</button>`).join('')}</div>`;
  if(!groups.length)return h+`<div class="card flat" style="text-align:center;padding:2em 1.2em"><div style="font-size:2.4rem">🕘</div><b>Nothing here yet</b><p class="small muted" style="margin:.4em auto 0;max-width:420px">History fills in as you cook, eat leftovers, order takeout, shop, and adjust pantry counts.${older?'':''}</p>${older?`<button class="small" data-act="holder" style="margin-top:.8em">Show older</button>`:''}</div>`;
  h+=groups.map(g=>`<div class="hday"><h3>${g.d===iso(today())?'Today':g.d===iso(addDays(today(),-1))?'Yesterday':fmtLong(g.d)}</h3>${g.items.map(e=>e.k==='meal'?`<div class="hrow"><span class="ht">${hTime(e.t)}</span><span class="he">${e.e||'🍽️'}</span><span style="flex:1">${mealText(e)}</span></div>`:`<div class="hrow"><span class="ht">${hTime(e.t)}</span><span class="he">${e.e||'🥫'}</span><span style="flex:1"><span class="${e.d>0?'plus':'minus'}">${e.d>0?'+':'−'}${num(Math.abs(e.d),2)} ${esc(e.u||'')}</span> ${esc(e.n)} <span class="tiny muted">· ${esc(e.why||'')}</span></span></div>`).join('')}</div>`).join('');
  if(older)h+=`<div class="row" style="margin-top:1em;justify-content:center"><button class="small" data-act="holder">Show older (${days} → ${days*2} days)</button></div>`;
  return h;}

/* ============================================================ takeout */

  ${state.takeouts.length?`<label>Your usual places</label><div class="row" style="gap:.4em;margin-bottom:.6em">${state.takeouts.map(n=>`<button class="small soft" data-act="to-pick" data-name="${esc(n)}" data-date="${ds}" data-slot="${slot}">${esc(n)}</button>`).join('')}</div>`:''}
  <label>${state.takeouts.length?'Or somewhere new':'Restaurant, chain, dish or occasion'}</label><div class="row nowrap"><input id="toName" placeholder="e.g. Thai Garden, pizza, sushi" autocomplete="off" style="flex:1"><button class="primary" data-act="to-pick" data-new="1" data-date="${ds}" data-slot="${slot}">Add</button></div>
  ${state.takeouts.length?`<details style="margin-top:.8em"><summary class="tiny muted" style="cursor:pointer">Remove a saved place</summary><div class="row" style="gap:.4em;margin-top:.4em">${state.takeouts.map(n=>`<button class="small ghost" data-act="to-del" data-name="${esc(n)}" data-date="${ds}" data-slot="${slot}">✕ ${esc(n)}</button>`).join('')}</div></details>`:''}`);
  setTimeout(()=>$('#toName')?.focus(),50);}
function showTakeoutEaten(name,ds,slot){openDialog(`<div class="row between"><h2>🛍️ ${esc(name)}</h2><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div><p class="muted">Did anything come home as leftovers? They go to your leftover bank so you can plan them for another meal.</p>
  <div class="row" style="align-items:center"><label style="margin:0">Leftover servings</label><input id="toLo" type="number" min="0" step="0.5" value="0" style="width:90px"></div>
  <div class="row" style="margin-top:1em"><button class="primary" data-act="to-done" data-name="${esc(name)}" data-date="${ds}" data-slot="${slot}">Done</button><button class="ghost" data-act="dlg-close">Cancel</button></div>`);}
function planSlotHTML(ds,slot,cur){const key=ds+'|'+slot;if(ui.repick===key)return `<div class="row nowrap" style="gap:.3em;align-items:flex-start"><div style="flex:1;min-width:0">${mealPickHTML(ds,slot,cur)}</div><button class="small ghost" data-act="repick-cancel" aria-label="Cancel" style="margin-top:.3em">✕</button></div>`;
  const pi=cur?planItem(cur):null;const empty=!pi;const txt=empty?(slot==='side'?'None / from rotation':'From rotation'):pi.skip?'Skipped':pi.l?`Leftover ${pi.l.n}`:pi.n;
  return `<button type="button" class="pslot ${empty?'empty':''}" data-act="repick" data-date="${ds}" data-slot="${slot}"><span class="em">${empty?(SLOT_EMOJI[slot]||'🍽️'):pi.e}</span><span class="nm">${esc(txt)}</span><span class="chev">🔍</span></button>`;}
function planBatchRow(ds,slot){const p=planFor(ds);const r=p[slot]&&recipe(p[slot]);if(!r||r.yields)return '';const b=planBatches(ds,slot);const lo=loFromBatches(r,b);return `<div class="row tiny" style="margin-top:.25em;gap:.35em;align-items:center;flex-wrap:wrap"><span class="muted">Batches</span><input type="number" min="1" step="1" value="${b}" data-act="plan-b" data-date="${ds}" data-slot="${slot}" style="width:54px;padding:.15em .3em;font-size:.85rem"><span class="muted">makes ${num(b*servesOf(r))} · eat ${num(people(),1)} · ${lo?`<b style="color:var(--green-deep)">${num(lo)} to leftovers</b>`:'no leftovers'}</span></div>`;}
function renderPlan(){const days=[...Array(7)].map((_,i)=>addDays(today(),i));const src=loSources();
  return `<div class="row between"><h1>Plan the week</h1><div class="row"><button class="small" data-act="plan-fill">Fill from rotation</button><button class="small ghost" data-act="plan-clear">Clear</button></div></div>
  <p class="muted">Pick each day's meals — a recipe, leftovers, takeout or eating out, or skip a meal you won't be making. Days you leave open use the average of your rotation, so the shopping list stays sensible either way. Planning day is ${DOW[state.planDay]}; <a href="#" data-act="view" data-view="more">change it in More</a>.</p>
  ${state.leftovers.length||src.length?`<div class="card flat" style="margin:.4em 0 1em"><b>🥡 Leftovers available</b><div class="row" style="margin-top:.4em;gap:.4em">${state.leftovers.map(l=>`<span class="chip good">${l.e||''} ${esc(l.n)} · ${num(l.servings,1)} serving${l.servings===1?'':'s'}</span>`).join('')}${src.map(x=>`<span class="chip">${x.r.e} ${esc(x.r.n)} · ${num(x.servings,1)} from ${srcLabel(x)}</span>`).join('')}</div><div class="tiny muted" style="margin-top:.4em">They're listed first in every meal menu below — planning them uses nothing from the pantry. Set the batches under a meal to cook extra on purpose.</div></div>`:''}
  <div class="plan-grid">${days.map(d=>{const ds=iso(d),p=planFor(ds);return `<div class="plan-day ${ds===iso(today())?'today':''}"><h3><span>${DOW[d.getDay()]}</span><span class="tiny muted">${fmt(d)}${iso(nextShopDate(d))===ds?' · 🛒':''}</span></h3>
    ${onMeals().map(m=>`<label class="tiny" style="margin:.5em 0 0">${SLOT_LABEL[m]}</label>${planSlotHTML(ds,m,p[m])}${planBatchRow(ds,m)}`).join('')}
    ${state.mealsOn.dinner!==false?`<label class="tiny" style="margin:.5em 0 0">Side</label>${planSlotHTML(ds,'side',p.side)}`:''}</div>`;}).join('')}</div>
  <div class="card flat" style="margin-top:1em"><b>My rotation</b><div class="tiny muted">The recipes these menus draw from, and the fallback when a day is unplanned.</div><button class="small" data-act="rotation" style="margin-top:.5em">Edit rotation</button></div>`;}
function planFill(){const M=state.meals;const pick=(arr,i)=>arr.length?arr[i%arr.length]:null;let di=0,li=0,si=0,bi=0;const start=Object.values(state.plan).length;
  for(let i=0;i<7;i++){const ds=iso(addDays(today(),i));const p=state.plan[ds]||(state.plan[ds]={});const dow=addDays(today(),i).getDay();
    if(!p.dinner&&M.dinner.mains.length&&di<M.dinner.count){p.dinner=pick(M.dinner.mains,start+di);di++;if(!p.side&&M.dinner.sides.length)p.side=pick(M.dinner.sides,start+si++);}

/* ============================================================ shop */
function renderShop(shop){const pd=periodDays();const sd=isShopDay();const ns=nextShopDate();const mk=toMake();const cost=shop.reduce((a,x)=>a+x.cost,0);let cat='';

  ${mk.length?`<div class="card flat"><b>Make at home instead of buying</b><ul class="shop" style="list-style:none;padding:0;margin:.4em 0 0">${mk.map(x=>`<li><span>${x.s.e}</span><b>${esc(x.s.n)}</b><span class="muted small">${x.b} batch${x.b===1?'':'es'} → ${num(x.b*x.r.yields.qty)} ${x.s.unit}</span><button class="tiny" data-act="recipe" data-id="${x.r.id}">Recipe</button></li>`).join('')}</ul><div class="tiny muted" style="margin-top:.4em">Their raw ingredients are already in the list below.</div></div>`:''}
  ${shop.length?`<ul class="shop" style="list-style:none;padding:0;margin:.6em 0 0">${shop.map(x=>{let h='';if(x.s.cat!==cat){cat=x.s.cat;h+=`<li style="border:0;padding-top:.9em"><h4>${esc(cat)}</h4></li>`;}const q=ui.shopQty[x.s.id]??x.n;
    return h+`<li><input type="checkbox" data-act="shop-check" data-id="${x.s.id}" ${ui.shopQty[x.s.id]!==undefined||ui.shopChecked?.[x.s.id]?'checked':''}><span>${x.s.e}</span><b>${esc(x.s.n)}${x.wanted?' <span class="chip info">for a recipe</span>':''}</b><span class="row nowrap"><input type="number" min="0" step="1" value="${q}" data-act="shop-qty" data-id="${x.s.id}" aria-label="packages bought"><span class="tiny muted">× ${esc(x.s.pkgName)}</span></span><span class="tiny muted" style="width:3.5em;text-align:right">${money(x.n*price(x.s))}</span></li>`;}).join('')}</ul>
    <div class="card" style="margin-top:1em"><div class="row between"><div><b>Estimated ${money(cost)}</b><div class="tiny muted">${shop.length} items · unchecked items stay on the list</div></div><button class="primary" data-act="shop-finish">Finish shopping</button></div></div>`
  :`<div class="card">${mk.length?'Nothing to buy — everything left is on the make-at-home list.':'Fully stocked. Nothing to buy.'}</div>`}`;}
function shopFinish(){const shop=shopping();let n=0;shop.forEach(x=>{const checked=ui.shopChecked?.[x.s.id];if(!checked)return;const q=Number(ui.shopQty[x.s.id]??x.n);if(q>0){it(x.s.id).on=(it(x.s.id).on||0)+q*x.s.pkg;logStock(x.s.id,q*x.s.pkg,'Shopping');n++;}delete state.wanted[x.s.id];});
  if(!n){toast('Select the items you bought first');return;}if(isShopDay())state.lastShop=iso(today());ui.shopQty={};ui.shopChecked={};save();render();toast(`${n} item${n===1?'':'s'} added to the pantry`);}
function shopText(){const shop=shopping();let cat='',out=`${state.name} — shopping list (${fmt(today())})\n`;shop.forEach(x=>{if(x.s.cat!==cat){cat=x.s.cat;out+=`\n${cat}\n`;}out+=`  [ ] ${x.s.n} — ${x.n} × ${x.s.pkgName}\n`;});return out+`\nEstimated: ${money(shop.reduce((a,x)=>a+x.cost,0))}`;}

/* ============================================================ recipes */
function prefClash(r){const out=[];if(state.prefs.veg&&r.ings.some(([id,q,opt])=>!opt&&staple(id)?.tags.includes('meat')))out.push('meat');if(state.prefs.gf&&r.ings.some(([id,q,opt])=>!opt&&staple(id)?.tags.includes('gluten')))out.push('gluten');return out;}
function recipeItem(r){const c=recipeCheck(r);const clash=prefClash(r);return `<div class="recipe" data-act="recipe" data-id="${r.id}"><div class="em">${r.e}</div><div style="flex:1"><div class="nm">${esc(r.n)}${r.custom?' <span class="chip">custom</span>':r.edited?' <span class="chip info">edited</span>':''}${clash.length?` <span class="chip ok" title="This recipe is on your list, but it contains ${clash.join(' and ')} and your preferences say ${clash.map(x=>x==='meat'?'vegetarian':'gluten-free').join(', ')}">has ${clash.join(' & ')}</span>`:''}${freq(r.id)?` <span class="chip good">${num(freq(r.id),1)}×/wk</span>`:''}${rtier(r)===1?' <span class="chip ok">essential</span>':''}</div><div class="meta">${esc(rcat(r))} · ${r.time} min · ~${Math.round(recipeKcal(r))} kcal${c.missing.length?` · missing ${c.missing.slice(0,3).map(m=>m.s?m.s.n.split(/[,(]/)[0].trim():m.id).join(', ')}${c.missing.length>3?` +${c.missing.length-3}`:''}`:' · <span class="chip good" style="font-size:.7rem">ready</span>'}</div></div></div>`;}
function renderRecipes(){const mine=myRecipes();let list=mine;if(ui.rcat)list=list.filter(r=>rcat(r)===ui.rcat);if(ui.q){const q=ui.q.toLowerCase();list=list.filter(r=>r.n.toLowerCase().includes(q));}
  const now=list.filter(r=>recipeCheck(r).can),near=list.filter(r=>!recipeCheck(r).can&&recipeCheck(r).missing.length<=2),rest=list.filter(r=>recipeCheck(r).missing.length>2);

  let h=`<div class="row between"><h1>My recipes</h1><button class="small ghost" data-act="rotation">Edit list</button></div>
  <div style="margin:.8em 0"><button class="primary block big" data-act="add-open" aria-expanded="${ui.addOpen?'true':'false'}">${ui.addOpen?'× Close':'+ Add recipe'}</button>${addTilesHTML()}</div>`;
  if(!mine.length)return h+`<div class="card flat">Your list is empty. Tap <b>+ Add recipe</b> to write your own or choose from ours — only the recipes you add show up here, in your plan and on your shopping list.</div>`;
  h+=`<div class="row" style="margin:.4em 0 .6em"><input placeholder="Search my recipes" value="${esc(ui.q)}" data-act="q" style="flex:1;min-width:140px"><select data-act="rcat-filter" style="width:auto"><option value="">All categories</option>${state.cats.map(c=>`<option ${ui.rcat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="small ${ui.rfilter==='can'?'soft':''}" data-act="rfilter">${ui.rfilter==='can'?'Showing what I can make now':'What can I make now?'}</button></div>`;
  if(ui.rfilter==='can'){const lib=libraryCookable();h+=`<h3>Ready from what's on hand <span class="muted" style="font-weight:400">(${now.length})</span></h3>${now.map(recipeItem).join('')||'<p class="muted">None of your recipes are fully covered yet — check the pantry counts or go shopping.</p>'}`;
    if(near.length)h+=`<h3 style="margin-top:1em">One or two items short</h3>${near.map(recipeItem).join('')}`;
    if(lib.length)h+=`<details style="margin-top:1.2em"><summary style="cursor:pointer;font-weight:700">Ideas from our recipes you could make right now (${lib.length})</summary><p class="tiny muted">Not on your list. Open one to cook it or add it to your list.</p>${lib.map(recipeItem).join('')}</details>`;
    return h;}
  h+=`<h3>Ready to cook <span class="muted" style="font-weight:400">(${now.length})</span></h3>${now.map(recipeItem).join('')||'<p class="muted tiny">Nothing fully covered yet — enter pantry counts or go shopping.</p>'}`;
  if(near.length)h+=`<h3 style="margin-top:1em">One or two items short <span class="muted" style="font-weight:400">(${near.length})</span></h3>${near.map(recipeItem).join('')}`;
  if(rest.length)h+=`<h3 style="margin-top:1em">Need more ingredients <span class="muted" style="font-weight:400">(${rest.length})</span></h3>${rest.map(recipeItem).join('')}`;
  if(makers.length&&!ui.rcat)h+=`<h3 style="margin-top:1em">Make for the shelf</h3><p class="tiny muted">Items you've chosen to make instead of buy.</p>${makers.map(r=>{const s=staple(r.yields.id);const b=s?batchesNeeded(s):0;return `<div class="recipe" data-act="recipe" data-id="${r.id}"><div class="em">${r.e}</div><div><div class="nm">${esc(r.n)}</div><div class="meta">${r.time} min · makes ${num(r.yields.qty)} ${s?s.unit+' of '+esc(s.n):''}${b?` · <b>${b} batch${b===1?'':'es'} needed</b>`:''}</div></div></div>`;}).join('')}`;

/* ============================================================ pantry (stock) */
function renderPantry(){let list=allStaples().filter(s=>inPrefs(s)&&(ui.only==='all'||rate(s)>0||periodDemand(s)>0||it(s.id).on>0));const q=ui.q.toLowerCase();if(ui.cat)list=list.filter(s=>s.cat===ui.cat);if(q)list=list.filter(s=>(s.n+' '+s.cat).toLowerCase().includes(q));
  if(ui.only==='attn')list=list.filter(s=>!it(s.id).off&&(status(s).st!=='stocked'||status(s).exp));list.sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||a.tier-b.tier||a.n.localeCompare(b.n));
  const gauge=st=>{const u=usage(st),c=capacity(st);if(c<=0)return '';const p=Math.min(1,u/c);return `<div style="flex:1;min-width:140px"><div class="row between tiny"><b>${STORES[st].e} ${STORES[st].label}</b><span class="muted">${Math.round(u/c*100)}%</span></div><div class="gauge"><i class="${u>c?'bad':p>.85?'warn':''}" style="width:${p*100}%"></i></div></div>`;};
  let h=`<div class="row between"><h1>Pantry</h1><button class="small primary" data-act="custom-new">+ Add an ingredient</button></div>
  <div class="card flat" style="margin:.6em 0"><div class="row">${gauge('dry')}${gauge('fridge')}${gauge('freezer')}</div><div class="tiny muted" style="margin-top:.4em">Space your plan would take at target · ≈ ${Math.round(planKcalPerAdultDay()).toLocaleString()} kcal per adult per day from the rotation</div></div>
  <div class="row"><input placeholder="Search ingredients" value="${esc(ui.q)}" data-act="q" style="flex:1;min-width:140px"><select data-act="cat" style="width:auto"><option value="">All categories</option>${CATS.map(c=>`<option ${ui.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select data-act="only" style="width:auto"><option value="">In my plan</option><option value="attn" ${ui.only==='attn'?'selected':''}>Needs attention</option><option value="all" ${ui.only==='all'?'selected':''}>Every ingredient</option></select></div>
  <p class="tiny muted">Type what is on hand, or tap +pkg when you unpack. Target = ${state.weeks} weeks of stock plus the meals planned before the next shop — except fridge items, which default to one shopping cycle, and anything capped by shelf life. Tap a target to adjust it for that ingredient.</p>`;
  let cat='';list.forEach(s=>{if(s.cat!==cat){cat=s.cat;h+=`<h4 style="margin:1em 0 .2em">${esc(cat)}</h4>`;}const o=it(s.id),st=status(s);const off=o.off;const r=rate(s)>0||periodDemand(s)>0;
    h+=`<div class="item ${off?'off':''}"><div class="em">${s.e}</div><div class="nm" style="cursor:pointer" data-act="detail" data-id="${s.id}">${esc(s.n)}${s.custom?' <span class="chip">custom</span>':''}<small>${s.pkgName}${s.id==='water'?' · counts itself down daily':''}${s.made?' · <span class="chip info" style="font-size:.7rem">made from raw</span>':''}</small></div>
      <div class="tgt" style="cursor:pointer" data-act="detail" data-id="${s.id}" title="Tap to adjust the stock amount">${off?'<span class="muted">not in plan</span>':r?`${num(targetRounded(s))} ${s.unit}${(o.weeks!=null||o.target!=null)?' <span class="chip info" style="font-size:.68rem">custom</span>':''}<small>${pkgs(s,target(s))} × ${s.pkgName} · tap to adjust</small>`:`<span class="muted">no recipe uses it</span><small><button class="tiny" data-act="basic-on" data-id="${s.id}">Always keep stocked</button></small>`}</div>
      <div class="qty"><button class="tiny" data-act="dec" data-id="${s.id}" aria-label="Use one">−</button><input type="number" min="0" step="any" value="${num(o.on||0,2)}" data-act="on" data-id="${s.id}" aria-label="On hand"><span>${s.unit}</span><button class="tiny" data-act="inc" data-id="${s.id}" style="white-space:nowrap">+pkg</button></div>
      <div class="st">${off?`<button class="tiny" data-act="off" data-id="${s.id}">Add to plan</button>`:`<span class="chip ${st.cls}">${st.label}</span><div class="bar"><i class="${st.cls==='bad'?'bad':st.cls==='ok'?'warn':st.cls==='good'?'good':''}" style="width:${Math.min(100,st.ratio*100)}%"></i></div>${s.made&&recipeFor(s.id)?`<button class="tiny" data-act="make-toggle" data-id="${s.id}">${o.make?'🏠 making':'🛒 buying'}</button>`:''}`}</div></div>`;});
  if(!list.length)h+=`<p class="muted">Nothing matches.</p>`;return h;}

/* ============================================================ more */
function renderMore(al){const groups=[['out','Out of stock'],['low','Running low'],['exp','Expiring'],['space','Space']];
  return `<h1>More</h1>
  <div class="section"><h2>Needs attention</h2>${al.length?groups.map(([t,l])=>{const x=al.filter(a=>a.type===t);if(!x.length)return '';return `<h4 style="margin:.6em 0 .2em">${l}</h4><ul class="alerts">${x.map(a=>`<li data-act="${a.id?'detail':'noop'}" data-id="${a.id||''}"><span class="dot ${a.type}"></span><span>${esc(a.text)}</span></li>`).join('')}</ul>`;}).join(''):`<div class="card flat">${anyStock()?'All good.':'Enter what you have in Pantry and alerts switch on.'}</div>`}</div>
  <div class="section"><h2>My plan</h2><div class="card stack">
    <div class="grid3"><div><label>Pantry name</label><input value="${esc(state.name)}" data-set="name"></div><div><label>Adults</label><input type="number" min="1" value="${state.adults}" data-set="adults"></div><div><label>Kids</label><input type="number" min="0" value="${state.kids}" data-set="kids"></div></div>
    <label>Meals you make at home</label><div class="row" style="gap:1em">${MEALS.map(m=>`<label class="check"><input type="checkbox" data-set="mealsOn.${m}" ${state.mealsOn[m]!==false?'checked':''}><span>${SLOT_EMOJI[m]} ${SLOT_LABEL[m]}</span></label>`).join('')}</div>
    <label>Weeks of stock: <b id="wkLabel">${state.weeks}</b></label><input type="range" min="1" max="26" value="${state.weeks}" data-set="weeks" data-live="wkLabel">
    <div class="grid3"><div><label>Planning day</label><select data-set="planDay">${DOW.map((d,i)=>`<option value="${i}" ${state.planDay===i?'selected':''}>${d}</option>`).join('')}</select></div><div><label>Shopping day</label><select data-set="shopDay">${DOW.map((d,i)=>`<option value="${i}" ${state.shopDay===i?'selected':''}>${d}</option>`).join('')}</select></div><div><label>How often</label><select data-set="shopsPerMonth"><option value="4" ${state.shopsPerMonth===4?'selected':''}>Every week</option><option value="2" ${state.shopsPerMonth===2?'selected':''}>Every two weeks</option><option value="1" ${state.shopsPerMonth===1?'selected':''}>Once a month</option></select></div></div>
    <h4>Storage (inches / cu ft)</h4><div class="grid3"><div><label>Shelves</label><input type="number" min="0" value="${state.space.shelves}" data-set="space.shelves"></div><div><label>Width</label><input type="number" min="0" value="${state.space.w}" data-set="space.w"></div><div><label>Depth</label><input type="number" min="0" value="${state.space.d}" data-set="space.d"></div><div><label>Clearance</label><input type="number" min="0" value="${state.space.h}" data-set="space.h"></div><div><label>Fridge</label><input type="number" min="0" value="${state.space.fridge}" data-set="space.fridge"></div><div><label>Freezer</label><input type="number" min="0" value="${state.space.freezer}" data-set="space.freezer"></div></div>
    <h4>Diet and water</h4>${[['veg','Vegetarian — hide recipes with meat or fish'],['gf','Gluten-free — hide recipes with wheat'],['water','Stock emergency drinking water — 1 gal per person per day, counted down automatically']].map(([k,l])=>`<label class="check"><input type="checkbox" ${state.prefs[k]?'checked':''} data-set="prefs.${k}"><span>${l}</span></label>`).join('')}
    <div class="row"><button data-act="rotation">Edit my rotation</button><button data-act="view" data-view="plan">Plan the week</button></div></div></div>
  <div class="section"><h2>Recipe categories</h2><div class="card"><div class="row">${state.cats.map(c=>`<span class="chip">${esc(c)}${allRecipes().some(r=>rcat(r)===c)?'':` <button class="tiny ghost" data-act="cat-del" data-cat="${esc(c)}" aria-label="Delete" style="padding:0 .2em">✕</button>`}</span>`).join('')}</div><div class="row" style="margin-top:.5em"><input id="newCat" placeholder="New category" style="max-width:220px"><button class="small" data-act="cat-add">Add</button></div></div></div>
  <div class="section"><h2>Ingredients and recipes</h2><div class="card"><p class="tiny muted">${state.customStaples.length} custom ingredient${state.customStaples.length===1?'':'s'}, ${state.customRecipes.length} custom recipe${state.customRecipes.length===1?'':'s'}.</p><div class="row"><button data-act="custom-new">+ Add an ingredient</button><button data-act="recipe-new">+ Add a recipe</button></div></div></div>
  <div class="section"><h2>App</h2><div class="card stack"><label class="check"><input type="checkbox" ${state.settings.tutorial!==false?'checked':''} data-set="settings.tutorial"><span>Show the tutorial after setup</span></label><div class="row"><button class="small" data-act="tour-start">Replay the tutorial</button><select data-set="settings.theme" style="width:auto"><option value="auto" ${state.settings.theme==='auto'?'selected':''}>Match device</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Dark</option></select></div></div></div>
  <div class="section"><h2>Account</h2><div class="card stack"><div>${deviceOnly()?'Using this device only — nothing is saved to an account.':`Logged in as <b>${esc(session.username||'')}</b>. ${syncStatus.text?esc(syncStatus.text)+'.':''} Log in with the same username on another phone to share this pantry.`}</div>
    <div class="row"><button data-act="export">Export backup</button><button data-act="import">Import backup</button><input type="file" id="importFile" accept="application/json" class="sr"><button data-act="rerun">Re-run setup</button>${deviceOnly()&&hasBackend()?'<button data-act="logout">Create or log in to an account</button>':'<button data-act="logout">Log out</button>'}<button class="danger" data-act="reset">Start over</button></div></div></div>`;}

/* ============================================================ dialogs */
const dlg=()=>$('#dlg');function openDialog(h){$('#dlgBody').innerHTML=h;if(!dlg().open){if(tourI>=0)dlg().show();else dlg().showModal();}}function closeDialog(){if(dlg().open)dlg().close();}
function rotationControls(r){const c=rcat(r),id=r.id,M=state.meals;
  if(c==='Dinners')return `<label class="check"><input type="checkbox" data-act="meal" data-meal="dinner" data-role="mains" data-id="${id}" ${M.dinner.mains.includes(id)?'checked':''}><span>In my dinner rotation</span></label>`;
  if(c==='Lunches')return `<label class="check"><input type="checkbox" data-act="meal" data-meal="lunch" data-role="mains" data-id="${id}" ${M.lunch.mains.includes(id)?'checked':''}><span>In my lunch rotation</span></label>`;
  if(c==='Breakfast')return `<label class="check"><input type="checkbox" data-act="meal" data-meal="breakfast" data-role="mains" data-id="${id}" ${M.breakfast.mains.includes(id)?'checked':''}><span>In my breakfast rotation</span></label>`;
  if(c==='Sides')return `<label class="check"><input type="checkbox" data-act="meal" data-meal="dinner" data-role="sides" data-id="${id}" ${M.dinner.sides.includes(id)?'checked':''}><span>Side with dinners</span></label><label class="check"><input type="checkbox" data-act="meal" data-meal="lunch" data-role="sides" data-id="${id}" ${M.lunch.sides.includes(id)?'checked':''}><span>Side with lunches</span></label>`;
  return `<div class="row"><label style="margin:0">In my rotation</label><input type="number" min="0" step="0.5" value="${num(Number(state.recipes[id])||0)}" data-act="freq" data-id="${id}" style="width:80px"><span class="tiny muted">times per week</span></div>`;}
function showRecipe(id,batches){const r=recipe(id);if(!r)return;batches=Math.max(1,Math.round(Number(batches))||defaultBatches(r));const lo=loFromBatches(r,batches);const c=recipeCheck(r,batches);const ys=r.yields?staple(r.yields.id):null;const t=iso(today());const p=planFor(t);const isToday=SLOTS.some(k=>p[k]===id);
  openDialog(`<div class="row between"><h2>${r.e} ${esc(r.n)}</h2><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div>
  ${r.edited?'<p class="tiny"><span class="chip info">edited by you</span></p>':''}${prefClash(r).length?`<p class="tiny"><span class="chip ok">has ${prefClash(r).join(' & ')}</span> <span class="muted">— your preferences say ${prefClash(r).map(x=>x==='meat'?'vegetarian':'gluten-free').join(' and ')}, so this one won't be suggested, but it stays on your list and in your plan.</span></p>`:''}<p class="tiny muted">${r.time} min · ${r.yields?`makes ${num(r.yields.qty*batches)} ${ys?ys.unit+' of '+esc(ys.n):''}`:`${batches} batch${batches===1?'':'es'} · makes ${num(batches*servesOf(r))} serving${batches*servesOf(r)===1?'':'s'} (recipe serves ${num(servesOf(r))})`} · ~${Math.round(recipeKcal(r)).toLocaleString()} kcal${r.yields?' per batch':' per serving'} · ${c.can?'<span class="chip good">You have everything</span>':`<span class="chip bad">Missing ${c.missing.length}</span>`}${isToday?' · <span class="chip info">on today\'s menu</span>':''}</p>
  ${r.yields?'':`<div class="card flat" style="margin:.5em 0;padding:.7em .9em"><div class="row" style="align-items:center"><label style="margin:0">Batches to cook</label><input type="number" min="1" step="1" value="${batches}" data-act="batches" data-id="${id}" style="width:72px"><span class="tiny muted">× ${num(servesOf(r))} servings each</span></div><div class="tiny muted" style="margin-top:.3em">${lo?`Makes ${num(batches*servesOf(r))} servings. ${householdLabel()} eat ${num(people(),1)}, and <b style="color:var(--green-deep)">${num(lo)} serving${lo===1?'':'s'} go to your leftover bank</b> automatically when you tap "I made it" — plan them for another day.`:`Makes ${num(batches*servesOf(r))} servings — just enough for ${householdLabel()}. Add a batch to bank leftovers for later.`} Meal-prepping instead? <b>Prep for later</b> sends every serving to the bank, ready to eat.</div></div>`}
  ${r.yields?`<div class="row" style="margin:.4em 0"><label style="margin:0">Batches</label><input type="number" min="1" value="${batches}" data-act="batches" data-id="${id}" style="width:80px"></div>`:''}
  <div class="ing">${c.rows.map(x=>`<span class="${x.have||x.opt?'':'no'}">${x.s?x.s.e+' '+esc(x.s.n):esc(x.id)}${x.opt?' <span class="muted tiny">(optional)</span>':''}</span><span>${x.s?ingText(x.id,x.q,c.sc,x.m):num(x.need,2)}</span><span class="tiny ${x.have?'muted':'no'}">${x.have?'✓':x.opt?'—':'have '+num(x.on,2)}</span>`).join('')}</div>
  <h3 style="margin-top:.8em">Method</h3><p>${esc(r.steps)}</p>
  <div class="grid2" style="margin:.4em 0"><div><label style="margin:0">Category</label><select data-act="set-rcat" data-id="${id}">${state.cats.map(cc=>`<option ${rcat(r)===cc?'selected':''}>${esc(cc)}</option>`).join('')}</select></div><div><label style="margin:0">Priority</label><select data-act="set-rtier" data-id="${id}">${[1,2,3].map(tt=>`<option value="${tt}" ${rtier(r)===tt?'selected':''}>${RTIER[tt]}</option>`).join('')}</select></div></div>
  ${r.yields?'':inList(r)?rotationControls(r):`<div class="card flat" style="margin-top:.6em"><b>Not on your list.</b> Add it? <div class="row" style="margin-top:.5em"><button class="small primary" data-act="dlg-add" data-id="${id}" data-tier="1">Add — essential</button><button class="small" data-act="dlg-add" data-id="${id}" data-tier="2">Add — not essential</button></div></div>`}
  <div class="row" style="margin-top:1em"><button class="primary" data-act="cooked" data-id="${id}" data-b="${batches}" ${c.can?'':'disabled'}>${r.yields?'Made it — add to pantry':'I made it — take it out of the pantry'}</button>${r.yields?'':`<button data-act="prep" data-id="${id}" data-b="${batches}" ${c.can?'':'disabled'} title="Cook now, eat later: all servings go to leftovers">🍱 Prep for later</button>`}${c.missing.length?`<button data-act="want" data-id="${id}" data-b="${batches}">Add missing to shopping list</button>`:''}${!r.yields?`<button data-act="plan-today" data-id="${id}">Put on today's menu</button>`:''}<button data-act="recipe-edit" data-id="${id}">Edit</button>${r.custom?`<button class="danger" data-act="recipe-del" data-id="${id}">Delete</button>`:r.edited?`<button class="ghost" data-act="recipe-reset" data-id="${id}">Reset to original</button>`:''}</div>`);}
function showDetail(id){const s=staple(id);if(!s)return;const o=it(id),st=status(s);const uses=allRecipes().filter(r=>r.ings.some(i=>i[0]===id));const d=recipeDemand();
  openDialog(`<div class="row between"><h2>${s.e} ${esc(s.n)}</h2><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div>
  <div class="row" style="gap:.3em;margin:.4em 0"><span class="chip ${st.cls}">${st.label}</span><span class="chip">${esc(s.cat)}</span><span class="chip">${TIER[s.tier]}</span><span class="chip">${STORES[s.store].e} ${STORES[s.store].label}</span>${st.exp?`<span class="chip ${st.exp.cls}">${st.exp.label}</span>`:''}</div>
  <div class="kv"><b>Target</b><span>${num(targetRounded(s))} ${s.unit} = ${pkgs(s,target(s))} × ${s.pkgName}</span><b>On hand</b><span>${num(st.on,2)} ${s.unit}${st.days!==Infinity?` — about ${Math.round(st.days)} days`:''}</span><b>Weekly use</b><span>${num(rate(s),2)} ${s.unit}${(d.meals[id]||d.extras[id])?' from recipes':''}${isBasic(s)?' (always stocked)':''}</span><b>Shelf life</b><span>${s.life>=999?'Indefinite':s.life<1?Math.round(s.life*30)+' days':s.life+' months'}</span><b>Calories</b><span>${s.kcal?`${num(s.kcal)} per ${s.unit}`:'not set'}</span></div>
  ${s.note?`<p style="margin-top:.6em">${esc(s.note)}</p>`:''}
  <div class="grid3" style="margin-top:.6em"><div><label>On hand (${s.unit})</label><input type="number" min="0" step="any" id="dOn" value="${num(st.on,2)}"></div><div><label>Per adult per week</label><input type="number" min="0" step="any" id="dPer" value="${num(o.per!=null?o.per:s.per,2)}"></div><div><label>Price per ${esc(s.pkgName)}</label><input type="number" min="0" step="any" id="dPrice" value="${num(price(s),2)}"></div></div>
  <h3 style="margin-top:.9em">Stock amount</h3><p class="tiny muted">Target is ${num(targetRounded(s))} ${s.unit}: ${esc(reserveNote(s))}${o.target==null?` plus the meals planned before the next shop`:''}. Change it here for this ingredient only.</p>
  <div class="grid2"><div><label>Weeks of stock to keep</label><input type="number" min="0" step="0.5" id="dWeeks" value="${o.weeks!=null?num(o.weeks,1):''}" placeholder="${num(reserveWeeks(s),1)} (default)" ${o.target!=null?'disabled':''}></div><div><label>…or an exact amount (${s.unit})</label><input type="number" min="0" step="any" id="dTarget" value="${o.target!=null?num(o.target,2):''}" placeholder="leave blank to calculate"></div></div>
  <label>Expiry of the oldest package <span class="hint">(optional)</span></label><input type="date" id="dExp" value="${o.exp||''}">
  <label class="check" style="margin-top:.6em"><input type="checkbox" id="dBasic" ${isBasic(s)?'checked':''} ${s.id==='water'?'disabled':''}><span>Always keep stocked at the per-adult rate <span class="hint">(coffee, salt, snacks — things no recipe covers)</span></span></label>
  ${uses.length?`<p class="tiny muted" style="margin-top:.6em">Used in: ${uses.map(r=>r.n).join(', ')}</p>`:''}
  <div class="row" style="margin-top:1em"><button class="primary" data-act="detail-save" data-id="${id}">Save</button><button data-act="off" data-id="${id}">${o.off?'Add to plan':'Remove from plan'}</button>${s.custom?`<button data-act="custom-edit" data-id="${id}">Edit</button><button class="danger" data-act="custom-del" data-id="${id}">Delete</button>`:''}</div>`);}
function showCustomForm(id,pre){const s=id?staple(id):null;pre=pre||{};
  openDialog(`<div class="row between"><h2>${s?'Edit ingredient':'Add an ingredient'}</h2><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div>
  <form id="cf" class="stack" onsubmit="return false"><input type="hidden" name="id" value="${s?s.id:''}">
  <div class="grid3"><div style="grid-column:1/3"><label>Name</label><input name="n" required value="${esc(s?.n||pre.n||'')}"></div><div><label>Emoji</label><input name="e" value="${esc(s?.e||'🥫')}" maxlength="4"></div></div>
  ${pre.made?`<div class="card flat" style="padding:.6em .9em"><b>New item your recipe will make.</b> <span class="tiny muted">Fill in how you'd stock it — the unit it's counted in, how long it keeps, and how much space it takes. Save and you'll be back in the recipe.</span></div>`:''}
  <div class="grid2"><div><label>Category</label><select name="cat">${CATS.map(c=>`<option ${s?.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>Stored in</label><select name="store"><option value="dry" ${s?.store==='dry'?'selected':''}>Dry shelves</option><option value="fridge" ${s?.store==='fridge'?'selected':''}>Fridge</option><option value="freezer" ${s?.store==='freezer'?'selected':''}>Freezer</option></select></div></div>
  <div class="grid3"><div><label>Unit</label><input name="unit" required value="${esc(s?.unit||'lb')}"></div><div><label>Per adult per week</label><input name="per" type="number" min="0" step="any" required value="${s?s.per:(ui.recipeDraft?0:'')}" placeholder="e.g. 0.5"></div><div><label>Priority</label><select name="tier"><option value="1" ${s?.tier===1?'selected':''}>Essential</option><option value="2" ${!s||s.tier===2?'selected':''}>Standard</option><option value="3" ${s?.tier===3?'selected':''}>Nice to have</option></select></div></div>
  <div class="grid3"><div><label>Package size <span class="hint">(units)</span></label><input name="pkg" type="number" min="0.01" step="any" required value="${s?s.pkg:''}"></div><div><label>Package name</label><input name="pkgName" required value="${esc(s?.pkgName||'')}" placeholder="2 lb bag"></div><div><label>Price ($)</label><input name="price" type="number" min="0" step="any" value="${s?s.price:''}"></div></div>
  <div class="grid3"><div><label>Space per unit <span class="hint">(cu in)</span></label><input name="vol" type="number" min="0" step="any" required value="${s?s.vol:''}"></div><div><label>Shelf life (months)</label><input name="life" type="number" min="0" step="any" required value="${s?s.life:''}"></div><div><label>Calories per unit</label><input name="kcal" type="number" min="0" step="any" value="${s?.kcal??''}"></div></div>

function stapleSearchHTML(name,id,ph){const s=id&&id!=='__new'?staple(id):null;return `<div class="spick" style="flex:1 1 150px;min-width:0"><input type="hidden" name="${name}" value="${esc(s?s.id:'')}"><input type="text" class="spick-q" data-for="${name}" value="${esc(s?s.n:'')}" placeholder="${esc(ph||'Search ingredients…')}" autocomplete="off" autocorrect="off" spellcheck="false"><div class="spick-list" hidden></div></div>`;}

function unitSelectHTML(id,sel){const s=id&&id!=='__new'?staple(id):null;const ch=s?unitChoices(s):[''];const cur=sel||(s?s.unit:'');return ch.map(u=>`<option value="${esc(u)}" ${normUnit(u)===normUnit(cur)?'selected':''}>${esc(u||'unit')}</option>`).join('');}
function ingRowHTML(id,q,opt,meta){const s=id&&id!=='__new'?staple(id):null;const a=meta&&meta.a!=null&&meta.a!==''?meta.a:(q!=null?String(+Number(q).toFixed(4)):'');const u=meta&&meta.u?meta.u:(s?s.unit:'');return `<div class="ingrow row" style="margin:.35em 0;gap:.4em">${stapleSearchHTML('ing',id,'Search ingredients…')}<input name="qty" type="text" inputmode="decimal" autocomplete="off" value="${esc(String(a))}" placeholder="1 ½" style="width:68px"><select name="unit" style="width:auto;max-width:96px">${unitSelectHTML(id,u)}</select><label class="check tiny" style="margin:0"><input type="checkbox" name="opt" ${opt?'checked':''}><span>optional</span></label><button class="tiny ghost" data-act="ing-del" aria-label="Remove">✕</button><div class="tiny per" style="flex-basis:100%;color:var(--green-deep);padding-left:.2em"></div></div>`;}
function updatePer(){const f=$('#rf');if(!f)return;const sv=Math.max(0.5,Number(f.querySelector('[name=serves]')?.value)||4);const batch=f.querySelector('[name=hasYield]')?.checked;
  f.querySelectorAll('.ingrow').forEach(rw=>{const id=rw.querySelector('[name=ing]').value,a=parseAmt(rw.querySelector('[name=qty]').value),u=rw.querySelector('[name=unit]')?.value||'';const s=id&&id!=='__new'?staple(id):null;const out=rw.querySelector('.per');
    if(!s||!(a>0)){out.textContent='';return;}const q=toNative(a,u,s);if(q==null){out.textContent=`Can't convert ${u} to ${s.unit} for ${s.n} — use ${s.unit}`;return;}const conv=normUnit(u)!==normUnit(s.unit)?`${fracStr(a)} ${u} ≈ ${num(q,3)} ${s.unit}`:'';
    out.textContent=batch?`${conv?conv+' · ':''}${num(q,3)} ${s.unit} per batch`:`${conv?conv+' · ':''}${num(q/sv,3)} ${s.unit} per serving`;});}
function recipeDraft(){const f=$('#rf');if(!f)return null;const fd=new FormData(f);return {id:fd.get('id'),n:fd.get('n'),e:fd.get('e'),cat:fd.get('cat'),tier:fd.get('tier'),serves:fd.get('serves'),time:fd.get('time'),steps:fd.get('steps'),hasYield:fd.get('hasYield')==='on',yid:fd.get('yid'),yqty:fd.get('yqty'),rows:[...f.querySelectorAll('.ingrow')].map(rw=>[rw.querySelector('[name=ing]').value,rw.querySelector('[name=qty]').value,rw.querySelector('[name=opt]').checked,rw.querySelector('[name=unit]')?.value||''])};}

function showRecipeForm(id,outId,draft){const r=draft||(id?recipe(id):null);const y=r?.yields||(outId?{id:outId,qty:1}:null);

function saveRecipe(){const f=$('#rf');if(!f.reportValidity())return;const fd=new FormData(f);
  let badRow=null;const rows=[...f.querySelectorAll('.ingrow')].map(rw=>{const id=rw.querySelector('[name=ing]').value;const txt=rw.querySelector('[name=qty]').value;const u=rw.querySelector('[name=unit]')?.value||'';const a=parseAmt(txt);const s=id&&id!=='__new'?staple(id):null;let q=0;if(s&&a>0){q=toNative(a,u,s);if(q==null){badRow=`${s.n}: can't convert ${u} to ${s.unit}`;q=0;}}return [id,q,rw.querySelector('[name=opt]').checked,{a:String(txt).trim(),u}];}).filter(x=>x[0]&&x[0]!=='__new'&&x[1]>0);
  if(badRow){toast(badRow);return;}if(!rows.length){toast('Add at least one ingredient with a quantity.');return;}if(fd.get('hasYield')==='on'&&!staple(fd.get('yid'))){toast('Choose the pantry item this recipe produces, or add it as a new ingredient.');return;}const id=fd.get('id')||('recipe-'+Date.now());const hasY=fd.get('hasYield')==='on';
  const rec={id,n:fd.get('n').trim(),e:(fd.get('e')||'🍽️').trim()||'🍽️',cat:fd.get('cat')==='__newcat'?'Dinners':fd.get('cat'),tier:Number(fd.get('tier'))||2,serves:Math.max(0.5,Number(fd.get('serves'))||4),time:Number(fd.get('time'))||30,ings:rows.map(([i,q,o,m])=>[i,Math.round(q*10000)/10000,!!o,m]),steps:fd.get('steps').trim(),tags:[],yields:hasY?{id:fd.get('yid'),qty:Number(fd.get('yqty'))||1}:null};
  if(rec.yields){const s=staple(rec.yields.id);if(s&&!s.made){if(s.custom)s.made=true;else it(s.id).madeOverride=true;}}
  if(RECIPES.some(x=>x.id===id)){state.rover[id]={n:rec.n,e:rec.e,cat:rec.cat,tier:rec.tier,serves:rec.serves,time:rec.time,ings:rec.ings,steps:rec.steps,yields:rec.yields};state.rcat[id]=rec.cat;state.rtier[id]=rec.tier;save();closeDialog();toast(`Saved your version of ${rec.n}`);render();return;}
  const i=state.customRecipes.findIndex(x=>x.id===id);if(i>=0)state.customRecipes[i]=rec;else{state.customRecipes.push(rec);if(!rec.yields){if(rec.cat==='Dinners')state.meals.dinner.mains.push(id);else if(rec.cat==='Lunches')state.meals.lunch.mains.push(id);else if(rec.cat==='Sides')state.meals.dinner.sides.push(id);else state.recipes[id]=1;}}
  save();closeDialog();toast(rec.yields?`Saved ${rec.n}`:`Saved ${rec.n} — its ingredients are now in your plan`);render();}
