.recipe{display:flex; gap:.8em; padding:.7em .4em; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start} .recipe:hover{background:var(--surface)}
.recipe .em{font-size:1.6rem; width:1.6em; text-align:center; flex:none} .recipe .nm{font-weight:700} .recipe .meta{color:var(--muted); font-size:.85rem}
.wr{display:flex; gap:.6em; align-items:center; padding:.4em .2em; border-bottom:1px solid var(--line)}
.alerts{list-style:none; margin:0; padding:0} .alerts li{display:flex; gap:.6em; align-items:flex-start; padding:.5em .5em; border-radius:10px; cursor:pointer} .alerts li:hover{background:var(--surface)}
.dot{width:.65em; height:.65em; border-radius:50%; flex:none; margin-top:.45em} .dot.out{background:var(--red)} .dot.low{background:var(--amber)} .dot.exp{background:var(--blue)} .dot.space{background:var(--green)}
.shop li{display:flex; gap:.6em; align-items:center; padding:.5em .3em; border-bottom:1px solid var(--line); flex-wrap:wrap} .shop li b{flex:1; min-width:120px} .shop li input[type=number]{width:70px; text-align:right}

  padding:calc(4.5em + env(safe-area-inset-top,0px)) 1em calc(6em + env(safe-area-inset-bottom,0px))}

.tour-ic{flex:none; width:64px; height:64px; border-radius:20px; background:var(--green-soft); display:grid; place-items:center; font-size:2.2rem}
.tour-card h2{font-size:clamp(1.6rem,6vw,2rem); margin:0}
.tour-card p{font-size:clamp(1.12rem,4.3vw,1.3rem); line-height:1.5; color:var(--ink); margin:.8em 0 1em}
.tour-dots{display:flex; gap:.45em; justify-content:center} .tour-dots span{width:9px; height:9px; border-radius:50%; background:var(--line)} .tour-dots span.on{background:var(--green); width:24px; border-radius:99px}

.pickrow{display:flex; gap:.7em; align-items:center; width:100%; padding:.6em .5em; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent}
.pickrow:hover{background:var(--surface)} .pickrow[aria-disabled="true"]{cursor:default; opacity:.75} .pickrow .em{font-size:1.4rem; width:1.5em; text-align:center}

:root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark}

function allStaples(){return STAPLES.concat(state.customStaples.map(c=>Object.assign({},c,{custom:true})));}

function freq(id){let f=Number(state.recipes[id])||0;['dinner','lunch'].forEach(m=>{const M=state.meals[m];if(!M||!M.count)return;if(M.mains.includes(id)&&M.mains.length)f+=M.count/M.mains.length;if(M.sides.includes(id)&&M.sides.length)f+=M.count/M.sides.length;});return f;}
function mealToggle(meal,role,id,on){const arr=state.meals[meal][role];const i=arr.indexOf(id);if(on&&i<0)arr.push(id);if(!on&&i>=0)arr.splice(i,1);}

function factor(r,extra){if(r.yields)return 1;const x=extra==null?loOf(r):Math.max(0,Number(extra)||0);return (people()+x)/servesOf(r);}
function recipeDemand(){if(_demand)return _demand;const dm={meals:{},extras:{}};allRecipes().forEach(r=>{const f=freq(r.id);const sc=factor(r);if(!f||r.yields)return;const bucket=['Dinners','Lunches','Sides'].includes(rcat(r))?dm.meals:dm.extras;r.ings.forEach(([id,q,opt])=>{if(opt)return;bucket[id]=(bucket[id]||0)+q*sc*f;});});_demand=dm;return dm;}

function rate(s){const d=recipeDemand();return (d.meals[s.id]||0)+(d.extras[s.id]||0)+basicRate(s);}   // weekly average

function dayDemand(s,dateStr){const d=recipeDemand();let v=((d.extras[s.id]||0)+basicRate(s))/7;const p=planFor(dateStr);
  if(dayPlanned(dateStr)){['lunch','dinner','side'].forEach(k=>{const r=p[k]&&recipe(p[k]);if(r)v+=recipeIngs(r)[s.id]||0;});}else v+=(d.meals[s.id]||0)/7;return v;}
function cadenceWeeks(){return state.shopsPerMonth>=4?1:state.shopsPerMonth===2?2:state.shopsPerMonth===3?1:4;}
function nextShopDate(after){const t=after||today();let d=state.shopAnchor?parseISO(state.shopAnchor):null;if(!d){d=new Date(t);while(d.getDay()!==state.shopDay)d.setDate(d.getDate()+1);}
  const step=cadenceWeeks()*7;while(d<t)d=addDays(d,step);while(addDays(d,-step)>=t)d=addDays(d,-step);return d;}

function reserveNote(s){const o=state.items[s.id];if(o&&o.target!=null)return 'exact amount you set';if(o&&o.weeks!=null)return `${o.weeks} week${o.weeks===1?'':'s'} you set`;if(s.store==='fridge'&&cadenceWeeks()<state.weeks)return `${cadenceWeeks()} week${cadenceWeeks()===1?'':'s'} — fresh items are bought each shop`;if(s.life&&s.life<999&&Math.floor(s.life*4.3)<state.weeks)return `${Math.max(1,Math.floor(s.life*4.3))} weeks — capped by shelf life`;return `${state.weeks} weeks of stock`;}

function capacity(store){const sp=state.space;if(store==='dry')return sp.shelves*sp.w*sp.d*sp.h*0.75;if(store==='fridge')return sp.fridge*1728*0.5;return sp.freezer*1728*0.7;}

function toMake(){return planned().filter(makeAtHome).map(s=>({s,r:recipeFor(s.id),b:batchesNeeded(s)})).filter(x=>x.b>0);}
function recipeCheck(r,batches,extra){const sc=r.yields?(batches||1):factor(r,extra);const rows=r.ings.map(([id,q,opt])=>{const s=staple(id);const need=q*sc;const on=s?(it(id).on||0):0;return {s,id,need,on,have:!!s&&on>=need-1e-9,opt:!!opt};});
  const missing=rows.filter(x=>!x.have&&!x.opt);const fits=!(state.prefs.veg&&r.ings.some(([id,q,opt])=>!opt&&staple(id)?.tags.includes('meat')))&&!(state.prefs.gf&&r.ings.some(([id,q,opt])=>!opt&&staple(id)?.tags.includes('gluten')));return {rows,missing,can:missing.length===0,fits};}
function recipeKcal(r){const per=r.yields?1:1/servesOf(r);return r.ings.reduce((t,[id,q])=>{const s=staple(id);return t+(s?q*per*(s.kcal||0):0);},0);}
function planKcalPerAdultDay(){const tot=planned().reduce((a,s)=>a+rate(s)*(s.kcal||0),0);return people()>0?tot/people()/7:0;}
function anyStock(){return Object.values(state.items).some(o=>o.on>0);}
function alerts(){const out=[];const started=anyStock()&&!!state.lastShop;   // 'out' only counts once you've shopped at least onceplanned().forEach(s=>{const st=status(s);if(st.st==='out'){if(started)out.push({type:'out',id:s.id,text:`${s.n}: out`});}else if(st.st==='low')out.push({type:'low',id:s.id,text:`${s.n}: about ${Math.round(st.days)} days left`});if(st.exp)out.push({type:'exp',id:s.id,text:`${s.n}: ${st.exp.label.toLowerCase()}`});});
  ['dry','fridge','freezer'].forEach(st=>{const u=usage(st),c=capacity(st);if(c>0&&u>c)out.push({type:'space',id:null,text:`${STORES[st].label}: plan needs ${Math.round(u/c*100)}% of the space — fits about ${fitWeeks(st)} weeks`});});return out;}
function waterTick(){const w=staple('water');if(!w||!inPrefs(w))return;const t=iso(today());const last=state.waterTick||t;const days=Math.round((parseISO(t)-parseISO(last))/DAY);if(days>0){const o=it('water');o.on=Math.max(0,(o.on||0)-days*rate(w)/7);}if(state.waterTick!==t){state.waterTick=t;saveLocalOnly();}}
function cookable(){return myRecipes().filter(r=>recipeCheck(r).fits&&recipeCheck(r).can);}
function libraryCookable(){return RECIPES.map(r=>recipe(r.id)).filter(r=>!r.yields&&!inList(r)&&recipeCheck(r).fits&&recipeCheck(r).can);}

async function doAuth(kind){const u=$('#auUser').value.trim().toLowerCase(),p=$('#auPass').value;const err=$('#auErr');err.textContent='';

    document.querySelectorAll('[data-stock]').forEach(inp=>{const id=inp.dataset.stock;if(inp.value===''){return;}const v=Math.max(0,Number(inp.value)||0);if(Math.abs(v-Number(inp.dataset.suggest))>1e-9){it(id).target=v;it(id).weeks=null;}});state.setup=true;ui.ob=0;save();ui.view='home';render();if(state.settings.tutorial!==false)startTour();return;}
  ui.ob++;save();render();}
const STARTER_BASICS=['salt','pepper','oil','sugar','coffee'];
function seedStarters(){if(state._seeded)return;state._seeded=true;STARTER_BASICS.forEach(id=>{if(it(id).basic==null)it(id).basic=true;});}
function unseedStarters(){if(!state._seeded)return;state._seeded=false;const drop=(arr,ids)=>{for(let i=arr.length-1;i>=0;i--)if(ids.includes(arr[i]))arr.splice(i,1);};
  drop(state.meals.dinner.mains,STARTER_DINNERS);drop(state.meals.dinner.sides,STARTER_SIDES);drop(state.meals.lunch.mains,STARTER_LUNCHES);

  return `<h2>How would you like to start?</h2><p class="muted">Your recipes decide which ingredients the app keeps stocked and puts on the shopping list.</p>
  <div class="stack" style="margin-top:1em">${opt('list','📋','Choose from our recipe list',`Pick from ${RECIPES.filter(r=>!r.yields).length} everyday recipes — dinners, lunches, sides, breakfasts and snacks. We pre-select a typical week to start you off; deselect anything you don't make.`)}

function renderOwnBuilder(){const M=state.meals;const mine=allRecipes().filter(r=>(r.custom||r.edited)&&!r.yields);const ings=state.customStaples;const cats=state.cats.filter(c=>mine.some(r=>rcat(r)===c));

function renderCheckIn(){const list=planned().sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||a.n.localeCompare(b.n));let cat='';

/* ============================================================ meal rotation (what you cook) */
function mealCountText(){const M=state.meals;const extras=Object.values(state.recipes).filter(v=>v>0).length;return `${M.dinner.count} dinners from ${M.dinner.mains.length} main${M.dinner.mains.length===1?'':'s'} + ${M.dinner.sides.length} side${M.dinner.sides.length===1?'':'s'} · ${M.lunch.count} lunches from ${M.lunch.mains.length} + ${M.lunch.sides.length} · ${extras} extra${extras===1?'':'s'}`;}
function recipeRow(r,control){return `<div class="wr">${control}<span style="font-size:1.2rem">${r.e}</span><span style="flex:1;min-width:0"><b>${esc(r.n)}</b>${r.custom?' <span class="chip">custom</span>':''}${rtier(r)===1?' <span class="chip ok">essential</span>':rtier(r)===3?' <span class="chip">nice to have</span>':''} <span class="tiny muted">${r.time} min · ~${Math.round(recipeKcal(r))} kcal</span></span><button class="tiny ghost" data-act="recipe" data-id="${r.id}">info</button></div>`;}
function inList(r){const M=state.meals;return (Number(state.recipes[r.id])||0)>0||['dinner','lunch'].some(m=>M[m].mains.includes(r.id)||M[m].sides.includes(r.id));}
function myRecipes(){return allRecipes().filter(r=>!r.yields&&inList(r));}
function setTier(id,tier){const r=recipe(id);if(!r)return;if(r.custom){const cr=state.customRecipes.find(x=>x.id===id);if(cr)cr.tier=tier;}else state.rtier[id]=tier;}
function addToList(id,tier){const r=recipe(id);if(!r)return;const c=rcat(r);if(c==='Dinners')mealToggle('dinner','mains',id,true);else if(c==='Lunches')mealToggle('lunch','mains',id,true);else if(c==='Sides')mealToggle('dinner','sides',id,true);else if(!((Number(state.recipes[id])||0)>0))state.recipes[id]=1;if(tier)setTier(id,tier);}
function removeFromList(id){delete state.recipes[id];['dinner','lunch'].forEach(m=>['mains','sides'].forEach(role=>mealToggle(m,role,id,false)));}
function renderMealPlanner(inOb){const M=state.meals;const mine=myRecipes();const cats=state.cats.filter(c=>mine.some(r=>rcat(r)===c));
  const row=r=>{const c=rcat(r);let ctrl='';

    return `<div class="myrow"><span class="em">${r.e}</span><span class="nm"><b>${esc(r.n)}</b>${r.custom?' <span class="chip">yours</span>':r.edited?' <span class="chip info">edited</span>':''}<span class="tiny muted">${r.time} min · ~${Math.round(recipeKcal(r))} kcal${loOf(r)?` · +${num(loOf(r))} leftover servings`:''}</span></span>
      <span class="ctl">${ctrl}<select data-act="set-rtier" data-id="${r.id}" aria-label="Priority">${[1,2,3].map(t=>`<option value="${t}" ${rtier(r)===t?'selected':''}>${RTIER[t]}</option>`).join('')}</select><button class="tiny ghost" data-act="recipe" data-id="${r.id}">Open</button><button class="tiny ghost" data-act="list-remove" data-id="${r.id}" aria-label="Remove ${esc(r.n)} from my recipes">✕</button></span></div>`;};
  return `<div data-planner><h2>${inOb?'What do you cook?':'My recipes'}</h2><p class="muted">Build the list of recipes you cook. Every recipe is measured for <b>${householdLabel()}</b>, and your list decides the ingredients in your plan and on your shopping list. On planning day you choose which night gets which.</p>
  <div class="card" style="margin-top:.8em"><div class="grid2"><div><label style="margin-top:0">Dinners at home</label><div class="row nowrap"><input type="number" min="0" max="21" value="${M.dinner.count}" data-act="meal-count" data-meal="dinner" style="width:72px"><span class="tiny muted">a week</span></div></div><div><label style="margin-top:0">Lunches at home</label><div class="row nowrap"><input type="number" min="0" max="21" value="${M.lunch.count}" data-act="meal-count" data-meal="lunch" style="width:72px"><span class="tiny muted">a week</span></div></div></div><div class="tiny muted" id="mealCount" style="margin-top:.5em">${mealCountText()}</div></div>
  <div style="margin:1em 0"><button class="primary block big" data-act="add-open" aria-expanded="${ui.addOpen?'true':'false'}">${ui.addOpen?'× Close':'+ Add recipe'}</button>
  ${ui.addOpen?`<div class="addtiles"><button class="addtile" data-act="recipe-new"><span class="ic">✍️</span><b>+ Add your own recipe</b><span class="small muted">Write it yourself: category, ingredients and method. Anything not on our ingredient list can be created as you go.</span></button>
    <button class="addtile" data-act="pick-ours"><span class="ic">📋</span><b>Choose from our recipes</b><span class="small muted">${RECIPES.filter(r=>!r.yields).length} everyday recipes — you can edit any recipe.</span></button></div>`:''}</div>
  <div class="row between"><h3>Your recipes <span class="muted" style="font-weight:400">(${mine.length})</span></h3>${mine.length?'<button class="small ghost" data-act="list-clear">Clear list</button>':''}</div>
  ${mine.length?cats.map(c=>`<h4 style="margin:.8em 0 .2em">${esc(c)}</h4>${mine.filter(r=>rcat(r)===c).sort((x,y)=>rtier(x)-rtier(y)||x.n.localeCompare(y.n)).map(row).join('')}`).join('')+`<p class="tiny muted" style="margin-top:.6em">Dinners and lunches share the nights above; sides go with the meals you select; other categories use times per week.</p>`
    :`<div class="card flat">No recipes yet. Tap <b>+ Add recipe</b> to write your own or choose from ours.</div>`}</div>`;}
function addTilesHTML(){return ui.addOpen?`<div class="addtiles"><button class="addtile" data-act="recipe-new"><span class="ic">✍️</span><b>+ Add your own recipe</b><span class="small muted">Write it yourself: category, ingredients and method. Anything not on our ingredient list can be created as you go.</span></button>
    <button class="addtile" data-act="pick-ours"><span class="ic">📋</span><b>Choose from our recipes</b><span class="small muted">${RECIPES.filter(r=>!r.yields).length} everyday recipes — you can edit any recipe.</span></button></div>`:'';}
function rotationDialogHTML(){return `<div class="row between"><div></div><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div>${renderMealPlanner(false)}<div class="row" style="margin-top:1em"><button class="primary" data-act="dlg-close">Done</button></div>`;}

function showPicker(){openDialog(`<div class="row between"><h2>Choose from our recipes</h2><button class="ghost" data-act="picker-done" aria-label="Close">✕</button></div>

/* ============================================================ home */
function isShopDay(){return iso(nextShopDate())===iso(today())&&state.lastShop!==iso(today());}
function isPlanDay(){return today().getDay()===state.planDay;}
function weekUnplanned(){let n=0;for(let i=0;i<7;i++)if(!dayPlanned(iso(addDays(today(),i))))n++;return n;}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function mealCard(label,rid,dateStr,slot){if(rid&&String(rid).startsWith('lo:')){const pi=planItem(rid);if(pi.l)return `<div class="mealcard"><span class="em">🥡</span><div style="flex:1;min-width:0"><div class="lab">${label} · leftovers</div><div class="nm">${esc(pi.l.n)}</div><div class="tiny muted">${num(pi.l.servings,1)} servings in the bank · nothing comes out of the pantry</div></div><button class="small primary" data-act="lo-eat" data-lo="${pi.l.id}">Eat</button></div>`;rid=null;}
  const r=rid&&recipe(rid);if(!r){const opts=rotationOptions(slot);return `<div class="mealcard"><span class="em">${slot==='lunch'?'🥪':slot==='dinner'?'🍽️':'🥗'}</span><div style="flex:1"><div class="lab">${label}</div><select data-act="plan-set" data-date="${dateStr}" data-slot="${slot}" style="margin-top:.2em"><option value="">Nothing planned — pick one</option>${opts}</select></div></div>`;}
  const c=recipeCheck(r);return `<div class="mealcard"><span class="em">${r.e}</span><div style="flex:1;min-width:0"><div class="lab">${label}</div><div class="nm">${esc(r.n)}</div><div class="tiny muted">${r.time} min · ~${Math.round(recipeKcal(r))} kcal · ${c.can?'<span class="chip good">ready to cook</span>':`<span class="chip bad">missing ${c.missing.length}</span>`}</div></div><button class="small primary" data-act="recipe" data-id="${r.id}">Open</button></div>`;}
function rotationOptions(slot,sel){const mine=myRecipes().filter(r=>recipeCheck(r).fits);const want=slot==='side'?'Sides':slot==='lunch'?'Lunches':'Dinners';
  const a=mine.filter(r=>rcat(r)===want),b=mine.filter(r=>rcat(r)!==want&&(slot==='side'?false:rcat(r)!=='Sides'));const los=slot==='side'?[]:state.leftovers;
  const opt=rs=>rs.sort((x,y)=>x.n.localeCompare(y.n)).map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${r.e} ${esc(r.n)}</option>`).join('');
  const lo=los.length?`<optgroup label="Leftovers — nothing comes out of the pantry">${los.map(l=>`<option value="lo:${l.id}" ${sel==='lo:'+l.id?'selected':''}>🥡 ${esc(l.n)} (${num(l.servings,1)} servings)</option>`).join('')}</optgroup>`:'';
  if(!a.length&&!b.length)return lo||`<option value="" disabled>Add recipes to your list first</option>`;
  return `${lo}${a.length?`<optgroup label="${esc(want)}">${opt(a)}</optgroup>`:''}${b.length?`<optgroup label="My other recipes">${opt(b)}</optgroup>`:''}`;}
function planItem(v){if(!v)return null;if(String(v).startsWith('lo:')){const l=state.leftovers.find(x=>'lo:'+x.id===v);return {lo:true,l,e:'🥡',n:l?`Leftover ${l.n}`:'Leftovers (finished)'};}const r=recipe(v);return r?{r,e:r.e,n:r.n}:null;}
function loAge(l){return Math.round((today()-parseISO(l.made))/DAY);}
function leftoverCard(l){const age=loAge(l);const chip=age>=4?'<span class="chip bad">over 4 days — toss?</span>':age>=3?'<span class="chip ok">eat today</span>':`<span class="chip good">${age?`${age} day${age===1?'':'s'} old`:'made today'}</span>`;
  return `<div class="mealcard"><span class="em">🥡</span><div style="flex:1;min-width:0"><div class="nm">${l.e||''} ${esc(l.n)}</div><div class="tiny muted">${num(l.servings,1)} serving${l.servings===1?'':'s'} · made ${fmt(l.made)} · ${chip}</div></div><div class="row nowrap" style="gap:.3em"><button class="small primary" data-act="lo-eat" data-lo="${l.id}">Eat</button><button class="small ghost" data-act="lo-toss" data-lo="${l.id}" aria-label="Toss ${esc(l.n)}">✕</button></div></div>`;}
function renderHome(al,shop){const t=iso(today());const p=planFor(t);const can=cookable();const urgent=al.filter(a=>a.type!=='exp');const ns=nextShopDate();const daysTo=Math.round((ns-today())/DAY);
  let h=`<h1>${greeting()}</h1><p class="muted">${fmtLong(today())}</p>`;
  if(isShopDay())h+=`<div class="card green" style="margin-top:1em"><div class="row between"><div><b>Shopping day</b><div class="muted tiny">${shop.length} item${shop.length===1?'':'s'} · roughly ${money(shop.reduce((a,x)=>a+x.cost,0))}</div></div><button class="small" data-act="view" data-view="shop" style="background:#fff;color:var(--green-deep);border-color:#fff">Open the list</button></div></div>`;
  if(isPlanDay()||weekUnplanned()>=5)h+=`<div class="card flat" style="margin-top:1em"><div class="row between"><div><b>${isPlanDay()?'Planning day':'This week is mostly unplanned'}</b><div class="tiny muted">Set each day's lunch and dinner — ${weekUnplanned()} of the next 7 days are open. Unplanned days use your rotation's average.</div></div><button class="small primary" data-act="view" data-view="plan">Plan the week</button></div></div>`;
  h+=`<div class="section"><h2>Today</h2><div class="stack">${mealCard('Lunch',p.lunch,t,'lunch')}${mealCard('Dinner',p.dinner,t,'dinner')}${p.side||p.dinner?mealCard('Side',p.side,t,'side'):''}</div>
    <div class="row" style="margin-top:.8em">${myRecipes().length?`<button class="soft" data-act="something-else">Make something else — ${can.length} recipe${can.length===1?'':'s'} ready from what's on hand</button>`:`<button class="soft" data-act="first-recipes">+ Add your first recipes</button>`}</div></div>`;
  h+=`${state.leftovers.length?`<div class="section"><button class="card flat block" data-act="view" data-view="leftovers" style="text-align:left;cursor:pointer;display:flex;align-items:center;gap:.8em"><span style="font-size:1.6rem">🥡</span><span style="flex:1"><b>${state.leftovers.length} leftover dish${state.leftovers.length===1?'':'es'} ready</b><span class="tiny muted" style="display:block">${state.leftovers.map(l=>esc(l.n)).slice(0,3).join(', ')}${state.leftovers.length>3?'…':''}</span></span><span class="small" style="color:var(--green-deep);font-weight:700">View ›</span></button></div>`:''}
  <div class="section"><h2>Coming up</h2><div class="card" style="padding:.4em 1em">${[1,2,3,4,5,6].map(i=>{const d=addDays(today(),i),ds=iso(d),pp=planFor(ds);const l=planItem(pp.lunch),dn=planItem(pp.dinner);return `<div class="row between" style="padding:.5em 0;border-bottom:1px solid var(--line)"><b style="width:4.5em">${DOW3[d.getDay()]} ${d.getDate()}</b><span style="flex:1" class="small ${l||dn?'':'muted'}">${l?`${l.e} ${esc(l.n)}`:''}${l&&dn?' · ':''}${dn?`${dn.e} ${esc(dn.n)}`:''}${!l&&!dn?'from rotation':''}</span>${iso(nextShopDate(d))===ds?'<span class="chip good">🛒 shop</span>':''}${d.getDay()===state.planDay?'<span class="chip">📅 plan</span>':''}</div>`;}).join('')}</div></div>`;
  h+=`<div class="section"><div class="grid2"><div class="card" data-act="view" data-view="shop" style="cursor:pointer"><div class="lab tiny muted">Next shopping</div><b>${isShopDay()?'Today':daysTo===1?'Tomorrow':`${DOW[ns.getDay()]} ${fmt(ns)}`}</b><div class="tiny muted">${shop.length} items on the list so far</div></div><div class="card" data-act="view" data-view="more" style="cursor:pointer"><div class="lab tiny muted">Pantry health</div><b>${urgent.length?`${urgent.length} thing${urgent.length===1?'':'s'} need attention`:'All good'}</b><div class="tiny muted">${state.lastShop?`${al.filter(a=>a.type==='out').length} out · `:''}${al.filter(a=>a.type==='low').length} low · ${al.filter(a=>a.type==='exp').length} expiring${state.lastShop?'':' · out-of-stock alerts start after your first shop'}</div></div></div></div>`;
  return h;}

/* ============================================================ plan (the week) */
function loPlanOptions(l){const opts=[];for(let i=0;i<7;i++){const d=addDays(today(),i),ds=iso(d);['lunch','dinner'].forEach(slot=>{const cur=planFor(ds)[slot];const curTxt=cur?(planItem(cur)?.n||''):'';opts.push(`<option value="${ds}|${slot}">${i===0?'Today':DOW3[d.getDay()]+' '+d.getDate()} · ${slot}${curTxt?` (replaces ${esc(curTxt)})`:''}</option>`);});}return opts.join('');}
function renderLeftovers(){const L=state.leftovers;
  let h=`<h1>Leftovers</h1><p class="muted">Extra servings you cooked. Eating them uses nothing from the pantry, and any day you plan leftovers adds nothing to the shopping list.</p>`;
  if(!L.length)return h+`<div class="card flat" style="margin-top:1em;text-align:center;padding:2em 1.2em"><div style="font-size:2.6rem">🥡</div><b>No leftovers yet</b><p class="small muted" style="margin:.4em auto 0;max-width:420px">When you open a recipe to cook it, set <b>Extra servings for leftovers</b>. After you tap "I made it", those servings land here, ready to eat or to plan for another day.</p></div>`;
  h+=`<div class="stack" style="margin-top:1em">${L.slice().sort((x,y)=>x.made.localeCompare(y.made)).map(l=>`<div>${leftoverCard(l)}<div class="row" style="margin:.4em 0 0 .2em"><select data-act="lo-plan" data-lo="${l.id}" style="width:auto;flex:1;max-width:340px;font-size:.9rem"><option value="">Plan it for…</option>${loPlanOptions(l)}</select></div></div>`).join('')}</div>
  <p class="tiny muted" style="margin-top:1.2em">Food-safety rule of thumb: eat refrigerated leftovers within 3–4 days, or freeze them sooner.</p>`;
  return h;}
function renderPlan(){const days=[...Array(7)].map((_,i)=>addDays(today(),i));
  return `<div class="row between"><h1>Plan the week</h1><div class="row"><button class="small" data-act="plan-fill">Fill from rotation</button><button class="small ghost" data-act="plan-clear">Clear</button></div></div>
  <p class="muted">Pick lunch and dinner for each day. Days you leave open use the average of your rotation, so the shopping list stays sensible either way. Planning day is ${DOW[state.planDay]}; <a href="#" data-act="view" data-view="more">change it in More</a>.</p>
  ${state.leftovers.length?`<div class="card flat" style="margin:.4em 0 1em"><b>🥡 Leftovers available</b><div class="row" style="margin-top:.4em;gap:.4em">${state.leftovers.map(l=>`<span class="chip good">${l.e||''} ${esc(l.n)} · ${num(l.servings,1)} serving${l.servings===1?'':'s'}</span>`).join('')}</div><div class="tiny muted" style="margin-top:.4em">They're listed first in every lunch and dinner menu below — planning them uses nothing from the pantry.</div></div>`:''}
  <div class="plan-grid">${days.map(d=>{const ds=iso(d),p=planFor(ds);return `<div class="plan-day ${ds===iso(today())?'today':''}"><h3><span>${DOW[d.getDay()]}</span><span class="tiny muted">${fmt(d)}${iso(nextShopDate(d))===ds?' · 🛒':''}</span></h3>
    <label class="tiny" style="margin:.5em 0 0">Lunch</label><select data-act="plan-set" data-date="${ds}" data-slot="lunch"><option value="">— from rotation —</option>${rotationOptions('lunch',p.lunch)}</select>
    <label class="tiny" style="margin:.5em 0 0">Dinner</label><select data-act="plan-set" data-date="${ds}" data-slot="dinner"><option value="">— from rotation —</option>${rotationOptions('dinner',p.dinner)}</select>
    <label class="tiny" style="margin:.5em 0 0">Side</label><select data-act="plan-set" data-date="${ds}" data-slot="side"><option value="">— none / from rotation —</option>${rotationOptions('side',p.side)}</select></div>`;}).join('')}</div>
  <div class="card flat" style="margin-top:1em"><b>My rotation</b><div class="tiny muted">The recipes these menus draw from, and the fallback when a day is unplanned.</div><button class="small" data-act="rotation" style="margin-top:.5em">Edit rotation</button></div>`;}
function planFill(){const M=state.meals;const pick=(arr,i)=>arr.length?arr[i%arr.length]:null;let di=0,li=0,si=0;const start=Object.values(state.plan).length;
  for(let i=0;i<7;i++){const ds=iso(addDays(today(),i));const p=state.plan[ds]||(state.plan[ds]={});const dow=addDays(today(),i).getDay();
    if(!p.dinner&&M.dinner.mains.length&&di<M.dinner.count){p.dinner=pick(M.dinner.mains,start+di);di++;if(!p.side&&M.dinner.sides.length)p.side=pick(M.dinner.sides,start+si++);}
    if(!p.lunch&&M.lunch.mains.length&&li<M.lunch.count){p.lunch=pick(M.lunch.mains,start+li);li++;}}
  save();render();toast('Week filled from your rotation — swap anything you like');}

/* ============================================================ shop */
function renderShop(shop){const pd=periodDays();const sd=isShopDay();const ns=nextShopDate();const mk=toMake();const cost=shop.reduce((a,x)=>a+x.cost,0);let cat='';
  return `<div class="row between"><h1>${sd?'Shopping day':'Shopping list'}</h1><div class="row"><button class="small" data-act="copy-shop">Copy as text</button></div></div>
  <p class="muted">${sd?`Covers ${state.weeks} weeks of stock plus the meals planned through ${fmt(addDays(pd.to,-1))}.`:`Next shopping day is <b>${DOW[ns.getDay()]} ${fmt(ns)}</b>, ${cadenceWeeks()===1?'every week':cadenceWeeks()===2?'every two weeks':'once a month'}. This is the list as it stands; it updates as you cook and plan.`} Select what you buy and set the amount if it differs; <b>Finish shopping</b> adds it all to the pantry.</p>
  ${mk.length?`<div class="card flat"><b>Make at home instead of buying</b><ul class="shop" style="list-style:none;padding:0;margin:.4em 0 0">${mk.map(x=>`<li><span>${x.s.e}</span><b>${esc(x.s.n)}</b><span class="muted small">${x.b} batch${x.b===1?'':'es'} → ${num(x.b*x.r.yields.qty)} ${x.s.unit}</span><button class="tiny" data-act="recipe" data-id="${x.r.id}">Recipe</button></li>`).join('')}</ul><div class="tiny muted" style="margin-top:.4em">Their raw ingredients are already in the list below.</div></div>`:''}
  ${shop.length?`<ul class="shop" style="list-style:none;padding:0;margin:.6em 0 0">${shop.map(x=>{let h='';if(x.s.cat!==cat){cat=x.s.cat;h+=`<li style="border:0;padding-top:.9em"><h4>${esc(cat)}</h4></li>`;}const q=ui.shopQty[x.s.id]??x.n;
    return h+`<li><input type="checkbox" data-act="shop-check" data-id="${x.s.id}" ${ui.shopQty[x.s.id]!==undefined||ui.shopChecked?.[x.s.id]?'checked':''}><span>${x.s.e}</span><b>${esc(x.s.n)}${x.wanted?' <span class="chip info">for a recipe</span>':''}</b><span class="row nowrap"><input type="number" min="0" step="1" value="${q}" data-act="shop-qty" data-id="${x.s.id}" aria-label="packages bought"><span class="tiny muted">× ${esc(x.s.pkgName)}</span></span><span class="tiny muted" style="width:3.5em;text-align:right">${money(x.n*price(x.s))}</span></li>`;}).join('')}</ul>
    <div class="card" style="margin-top:1em"><div class="row between"><div><b>Estimated ${money(cost)}</b><div class="tiny muted">${shop.length} items · unchecked items stay on the list</div></div><button class="primary" data-act="shop-finish">Finish shopping</button></div></div>`
  :`<div class="card">${mk.length?'Nothing to buy — everything left is on the make-at-home list.':'Fully stocked. Nothing to buy.'}</div>`}`;}
function shopFinish(){const shop=shopping();let n=0;shop.forEach(x=>{const checked=ui.shopChecked?.[x.s.id];if(!checked)return;const q=Number(ui.shopQty[x.s.id]??x.n);if(q>0){it(x.s.id).on=(it(x.s.id).on||0)+q*x.s.pkg;n++;}delete state.wanted[x.s.id];});
  if(!n){toast('Select the items you bought first');return;}if(isShopDay())state.lastShop=iso(today());ui.shopQty={};ui.shopChecked={};save();render();toast(`${n} item${n===1?'':'s'} added to the pantry`);}
function shopText(){const shop=shopping();let cat='',out=`${state.name} — shopping list (${fmt(today())})\n`;shop.forEach(x=>{if(x.s.cat!==cat){cat=x.s.cat;out+=`\n${cat}\n`;}out+=`  [ ] ${x.s.n} — ${x.n} × ${x.s.pkgName}\n`;});return out+`\nEstimated: ${money(shop.reduce((a,x)=>a+x.cost,0))}`;}

/* ============================================================ recipes */
function recipeItem(r){const c=recipeCheck(r);return `<div class="recipe" data-act="recipe" data-id="${r.id}"><div class="em">${r.e}</div><div style="flex:1"><div class="nm">${esc(r.n)}${r.custom?' <span class="chip">custom</span>':r.edited?' <span class="chip info">edited</span>':''}${freq(r.id)?` <span class="chip good">${num(freq(r.id),1)}×/wk</span>`:''}${rtier(r)===1?' <span class="chip ok">essential</span>':''}</div><div class="meta">${esc(rcat(r))} · ${r.time} min · ~${Math.round(recipeKcal(r))} kcal${c.missing.length?` · missing ${c.missing.slice(0,3).map(m=>m.s?m.s.n.split(/[,(]/)[0].trim():m.id).join(', ')}${c.missing.length>3?` +${c.missing.length-3}`:''}`:' · <span class="chip good" style="font-size:.7rem">ready</span>'}</div></div></div>`;}
function renderRecipes(){const mine=myRecipes().filter(r=>recipeCheck(r).fits);let list=mine;if(ui.rcat)list=list.filter(r=>rcat(r)===ui.rcat);if(ui.q){const q=ui.q.toLowerCase();list=list.filter(r=>r.n.toLowerCase().includes(q));}
  const now=list.filter(r=>recipeCheck(r).can),near=list.filter(r=>!recipeCheck(r).can&&recipeCheck(r).missing.length<=2),rest=list.filter(r=>recipeCheck(r).missing.length>2);
  const makers=allRecipes().filter(r=>r.yields&&(r.custom||it(r.yields.id).make));
  let h=`<div class="row between"><h1>My recipes</h1><button class="small ghost" data-act="rotation">Edit list</button></div>
  <div style="margin:.8em 0"><button class="primary block big" data-act="add-open" aria-expanded="${ui.addOpen?'true':'false'}">${ui.addOpen?'× Close':'+ Add recipe'}</button>${addTilesHTML()}</div>`;
  if(!mine.length)return h+`<div class="card flat">Your list is empty. Tap <b>+ Add recipe</b> to write your own or choose from ours — only the recipes you add show up here, in your plan and on your shopping list.</div>`;
  h+=`<div class="row" style="margin:.4em 0 .6em"><input placeholder="Search my recipes" value="${esc(ui.q)}" data-act="q" style="flex:1;min-width:140px"><select data-act="rcat-filter" style="width:auto"><option value="">All categories</option>${state.cats.map(c=>`<option ${ui.rcat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="small ${ui.rfilter==='can'?'soft':''}" data-act="rfilter">${ui.rfilter==='can'?'Showing what I can make now':'What can I make now?'}</button></div>`;
  if(ui.rfilter==='can'){const lib=libraryCookable();h+=`<h3>Ready from what's on hand <span class="muted" style="font-weight:400">(${now.length})</span></h3>${now.map(recipeItem).join('')||'<p class="muted">None of your recipes are fully covered yet — check the pantry counts or go shopping.</p>'}`;
    if(near.length)h+=`<h3 style="margin-top:1em">One or two items short</h3>${near.map(recipeItem).join('')}`;
    if(lib.length)h+=`<details style="margin-top:1.2em"><summary style="cursor:pointer;font-weight:700">Ideas from our recipes you could make right now (${lib.length})</summary><p class="tiny muted">Not on your list. Open one to cook it or add it to your list.</p>${lib.map(recipeItem).join('')}</details>`;
    return h;}
  h+=`<h3>Ready to cook <span class="muted" style="font-weight:400">(${now.length})</span></h3>${now.map(recipeItem).join('')||'<p class="muted tiny">Nothing fully covered yet — enter pantry counts or go shopping.</p>'}`;
  if(near.length)h+=`<h3 style="margin-top:1em">One or two items short <span class="muted" style="font-weight:400">(${near.length})</span></h3>${near.map(recipeItem).join('')}`;
  if(rest.length)h+=`<h3 style="margin-top:1em">Need more ingredients <span class="muted" style="font-weight:400">(${rest.length})</span></h3>${rest.map(recipeItem).join('')}`;
  if(makers.length&&!ui.rcat)h+=`<h3 style="margin-top:1em">Make for the shelf</h3><p class="tiny muted">Items you've chosen to make instead of buy.</p>${makers.map(r=>{const s=staple(r.yields.id);const b=s?batchesNeeded(s):0;return `<div class="recipe" data-act="recipe" data-id="${r.id}"><div class="em">${r.e}</div><div><div class="nm">${esc(r.n)}</div><div class="meta">${r.time} min · makes ${num(r.yields.qty)} ${s?s.unit+' of '+esc(s.n):''}${b?` · <b>${b} batch${b===1?'':'es'} needed</b>`:''}</div></div></div>`;}).join('')}`;
  return h;}

/* ============================================================ pantry (stock) */
function renderPantry(){let list=allStaples().filter(s=>inPrefs(s)&&(ui.only==='all'||rate(s)>0||periodDemand(s)>0||it(s.id).on>0));const q=ui.q.toLowerCase();if(ui.cat)list=list.filter(s=>s.cat===ui.cat);if(q)list=list.filter(s=>(s.n+' '+s.cat).toLowerCase().includes(q));
  if(ui.only==='attn')list=list.filter(s=>!it(s.id).off&&(status(s).st!=='stocked'||status(s).exp));list.sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||a.tier-b.tier||a.n.localeCompare(b.n));
  const gauge=st=>{const u=usage(st),c=capacity(st);if(c<=0)return '';const p=Math.min(1,u/c);return `<div style="flex:1;min-width:140px"><div class="row between tiny"><b>${STORES[st].e} ${STORES[st].label}</b><span class="muted">${Math.round(u/c*100)}%</span></div><div class="gauge"><i class="${u>c?'bad':p>.85?'warn':''}" style="width:${p*100}%"></i></div></div>`;};
  let h=`<div class="row between"><h1>Pantry</h1><button class="small primary" data-act="custom-new">+ Add an ingredient</button></div>
  <div class="card flat" style="margin:.6em 0"><div class="row">${gauge('dry')}${gauge('fridge')}${gauge('freezer')}</div><div class="tiny muted" style="margin-top:.4em">Space your plan would take at target · ≈ ${Math.round(planKcalPerAdultDay()).toLocaleString()} kcal per adult per day from the rotation</div></div>
  <div class="row"><input placeholder="Search ingredients" value="${esc(ui.q)}" data-act="q" style="flex:1;min-width:140px"><select data-act="cat" style="width:auto"><option value="">All categories</option>${CATS.map(c=>`<option ${ui.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select data-act="only" style="width:auto"><option value="">In my plan</option><option value="attn" ${ui.only==='attn'?'selected':''}>Needs attention</option><option value="all" ${ui.only==='all'?'selected':''}>Every ingredient</option></select></div>
  <p class="tiny muted">Type what is on hand, or tap +pkg when you unpack. Target = ${state.weeks} weeks of stock plus the meals planned before the next shop — except fridge items, which default to one shopping cycle, and anything capped by shelf life. Tap a target to adjust it for that ingredient.</p>`;
  let cat='';list.forEach(s=>{if(s.cat!==cat){cat=s.cat;h+=`<h4 style="margin:1em 0 .2em">${esc(cat)}</h4>`;}const o=it(s.id),st=status(s);const off=o.off;const r=rate(s)>0||periodDemand(s)>0;
    h+=`<div class="item ${off?'off':''}"><div class="em">${s.e}</div><div class="nm" style="cursor:pointer" data-act="detail" data-id="${s.id}">${esc(s.n)}${s.custom?' <span class="chip">custom</span>':''}<small>${s.pkgName}${s.id==='water'?' · counts itself down daily':''}${s.made?' · <span class="chip info" style="font-size:.7rem">made from raw</span>':''}</small></div>
      <div class="tgt" style="cursor:pointer" data-act="detail" data-id="${s.id}" title="Tap to adjust the stock amount">${off?'<span class="muted">not in plan</span>':r?`${num(targetRounded(s))} ${s.unit}${(o.weeks!=null||o.target!=null)?' <span class="chip info" style="font-size:.68rem">custom</span>':''}<small>${pkgs(s,target(s))} × ${s.pkgName} · tap to adjust</small>`:`<span class="muted">no recipe uses it</span><small><button class="tiny" data-act="basic-on" data-id="${s.id}">Always keep stocked</button></small>`}</div>
      <div class="qty"><button class="tiny" data-act="dec" data-id="${s.id}" aria-label="Use one">−</button><input type="number" min="0" step="any" value="${num(o.on||0,2)}" data-act="on" data-id="${s.id}" aria-label="On hand"><span>${s.unit}</span><button class="tiny" data-act="inc" data-id="${s.id}" style="white-space:nowrap">+pkg</button></div>
      <div class="st">${off?`<button class="tiny" data-act="off" data-id="${s.id}">Add to plan</button>`:`<span class="chip ${st.cls}">${st.label}</span><div class="bar"><i class="${st.cls==='bad'?'bad':st.cls==='ok'?'warn':''}" style="width:${Math.min(100,st.ratio*100)}%"></i></div>${s.made&&recipeFor(s.id)?`<button class="tiny" data-act="make-toggle" data-id="${s.id}">${o.make?'🏠 making':'🛒 buying'}</button>`:''}`}</div></div>`;});
  if(!list.length)h+=`<p class="muted">Nothing matches.</p>`;return h;}

/* ============================================================ more */

  <div class="section"><h2>My plan</h2><div class="card stack">

    <h4>Diet and water</h4>${[['veg','Vegetarian — hide recipes with meat or fish'],['gf','Gluten-free — hide recipes with wheat'],['water','Stock emergency drinking water — 1 gal per person per day, counted down automatically']].map(([k,l])=>`<label class="check"><input type="checkbox" ${state.prefs[k]?'checked':''} data-set="prefs.${k}"><span>${l}</span></label>`).join('')}
    <div class="row"><button data-act="rotation">Edit my rotation</button><button data-act="view" data-view="plan">Plan the week</button></div></div></div>
  <div class="section"><h2>Recipe categories</h2><div class="card"><div class="row">${state.cats.map(c=>`<span class="chip">${esc(c)}${allRecipes().some(r=>rcat(r)===c)?'':` <button class="tiny ghost" data-act="cat-del" data-cat="${esc(c)}" aria-label="Delete" style="padding:0 .2em">✕</button>`}</span>`).join('')}</div><div class="row" style="margin-top:.5em"><input id="newCat" placeholder="New category" style="max-width:220px"><button class="small" data-act="cat-add">Add</button></div></div></div>

  <div class="section"><h2>App</h2><div class="card stack"><label class="check"><input type="checkbox" ${state.settings.tutorial!==false?'checked':''} data-set="settings.tutorial"><span>Show the tutorial after setup</span></label><div class="row"><button class="small" data-act="tour-start">Replay the tutorial</button><select data-set="settings.theme" style="width:auto"><option value="auto" ${state.settings.theme==='auto'?'selected':''}>Match device</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Dark</option></select></div></div></div>

    <div class="row"><button data-act="export">Export backup</button><button data-act="import">Import backup</button><input type="file" id="importFile" accept="application/json" class="sr"><button data-act="rerun">Re-run setup</button>${deviceOnly()&&hasBackend()?'<button data-act="logout">Create or log in to an account</button>':'<button data-act="logout">Log out</button>'}<button class="danger" data-act="reset">Start over</button></div></div></div>`;}

/* ============================================================ dialogs */
const dlg=()=>$('#dlg');function openDialog(h){$('#dlgBody').innerHTML=h;if(!dlg().open)dlg().showModal();}function closeDialog(){if(dlg().open)dlg().close();}
function rotationControls(r){const c=rcat(r),id=r.id,M=state.meals;
  if(c==='Dinners')return `<label class="check"><input type="checkbox" data-act="meal" data-meal="dinner" data-role="mains" data-id="${id}" ${M.dinner.mains.includes(id)?'checked':''}><span>In my dinner rotation</span></label>`;
  if(c==='Lunches')return `<label class="check"><input type="checkbox" data-act="meal" data-meal="lunch" data-role="mains" data-id="${id}" ${M.lunch.mains.includes(id)?'checked':''}><span>In my lunch rotation</span></label>`;
  if(c==='Sides')return `<label class="check"><input type="checkbox" data-act="meal" data-meal="dinner" data-role="sides" data-id="${id}" ${M.dinner.sides.includes(id)?'checked':''}><span>Side with dinners</span></label><label class="check"><input type="checkbox" data-act="meal" data-meal="lunch" data-role="sides" data-id="${id}" ${M.lunch.sides.includes(id)?'checked':''}><span>Side with lunches</span></label>`;
  return `<div class="row"><label style="margin:0">In my rotation</label><input type="number" min="0" step="0.5" value="${num(Number(state.recipes[id])||0)}" data-act="freq" data-id="${id}" style="width:80px"><span class="tiny muted">times per week</span></div>`;}
function showRecipe(id,batches,extra){const r=recipe(id);if(!r)return;batches=Math.max(1,Number(batches)||1);extra=r.yields?0:(extra==null?loOf(r):Math.max(0,Number(extra)||0));const c=recipeCheck(r,batches,extra);const ys=r.yields?staple(r.yields.id):null;const t=iso(today());const p=planFor(t);const isToday=p.lunch===id||p.dinner===id||p.side===id;
  openDialog(`<div class="row between"><h2>${r.e} ${esc(r.n)}</h2><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div>
  ${r.edited?'<p class="tiny"><span class="chip info">edited by you</span></p>':''}<p class="tiny muted">${r.time} min · ${r.yields?`makes ${num(r.yields.qty*batches)} ${ys?ys.unit+' of '+esc(ys.n):''}`:`measured for ${householdLabel()}${extra?` + ${num(extra)} leftover serving${extra===1?'':'s'}`:''} (recipe serves ${num(servesOf(r))})`} · ~${Math.round(recipeKcal(r)).toLocaleString()} kcal${r.yields?' per batch':' per serving'} · ${c.can?'<span class="chip good">You have everything</span>':`<span class="chip bad">Missing ${c.missing.length}</span>`}${isToday?' · <span class="chip info">on today\'s menu</span>':''}</p>
  ${r.yields?'':`<div class="card flat" style="margin:.5em 0;padding:.7em .9em"><div class="row"><label style="margin:0">Extra servings for leftovers</label><input type="number" min="0" step="1" value="${num(extra)}" data-act="lo-extra" data-id="${id}" style="width:72px"></div><div class="tiny muted" style="margin-top:.3em">${extra?`Cooking makes ${num(extra)} more serving${extra===1?'':'s'}; they go to your leftover bank to eat later without using pantry ingredients.`:'Make extra and they go to your leftover bank — eating them later uses nothing from the pantry.'}</div>${extra!==loOf(r)?`<button class="tiny" style="margin-top:.4em" data-act="lo-default" data-id="${id}" data-n="${extra}">${extra?`Always make ${num(extra)} extra with this recipe`:'Stop making extra by default'}</button>`:loOf(r)?`<div class="tiny" style="margin-top:.3em;color:var(--green-deep)">Default for this recipe — planned meals include the extra in your shopping list.</div>`:''}</div>`}
  ${r.yields?`<div class="row" style="margin:.4em 0"><label style="margin:0">Batches</label><input type="number" min="1" value="${batches}" data-act="batches" data-id="${id}" style="width:80px"></div>`:''}
  <div class="ing">${c.rows.map(x=>`<span class="${x.have||x.opt?'':'no'}">${x.s?x.s.e+' '+esc(x.s.n):esc(x.id)}${x.opt?' <span class="muted tiny">(optional)</span>':''}</span><span>${num(x.need,2)} ${x.s?x.s.unit:''}</span><span class="tiny ${x.have?'muted':'no'}">${x.have?'✓':x.opt?'—':'have '+num(x.on,2)}</span>`).join('')}</div>
  <h3 style="margin-top:.8em">Method</h3><p>${esc(r.steps)}</p>
  <div class="grid2" style="margin:.4em 0"><div><label style="margin:0">Category</label><select data-act="set-rcat" data-id="${id}">${state.cats.map(cc=>`<option ${rcat(r)===cc?'selected':''}>${esc(cc)}</option>`).join('')}</select></div><div><label style="margin:0">Priority</label><select data-act="set-rtier" data-id="${id}">${[1,2,3].map(tt=>`<option value="${tt}" ${rtier(r)===tt?'selected':''}>${RTIER[tt]}</option>`).join('')}</select></div></div>
  ${r.yields?'':inList(r)?rotationControls(r):`<div class="card flat" style="margin-top:.6em"><b>Not on your list.</b> Add it? <div class="row" style="margin-top:.5em"><button class="small primary" data-act="dlg-add" data-id="${id}" data-tier="1">Add — essential</button><button class="small" data-act="dlg-add" data-id="${id}" data-tier="2">Add — not essential</button></div></div>`}
  <div class="row" style="margin-top:1em"><button class="primary" data-act="cooked" data-id="${id}" data-b="${batches}" data-x="${extra}" ${c.can?'':'disabled'}>${r.yields?'Made it — add to pantry':'I made it — take it out of the pantry'}</button>${c.missing.length?`<button data-act="want" data-id="${id}" data-b="${batches}">Add missing to shopping list</button>`:''}${!r.yields?`<button data-act="plan-today" data-id="${id}">Put on today's menu</button>`:''}<button data-act="recipe-edit" data-id="${id}">Edit</button>${r.custom?`<button class="danger" data-act="recipe-del" data-id="${id}">Delete</button>`:r.edited?`<button class="ghost" data-act="recipe-reset" data-id="${id}">Reset to original</button>`:''}</div>`);}
function showDetail(id){const s=staple(id);if(!s)return;const o=it(id),st=status(s);const uses=allRecipes().filter(r=>r.ings.some(i=>i[0]===id));const d=recipeDemand();
  openDialog(`<div class="row between"><h2>${s.e} ${esc(s.n)}</h2><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div>
  <div class="row" style="gap:.3em;margin:.4em 0"><span class="chip ${st.cls}">${st.label}</span><span class="chip">${esc(s.cat)}</span><span class="chip">${TIER[s.tier]}</span><span class="chip">${STORES[s.store].e} ${STORES[s.store].label}</span>${st.exp?`<span class="chip ${st.exp.cls}">${st.exp.label}</span>`:''}</div>
  <div class="kv"><b>Target</b><span>${num(targetRounded(s))} ${s.unit} = ${pkgs(s,target(s))} × ${s.pkgName}</span><b>On hand</b><span>${num(st.on,2)} ${s.unit}${st.days!==Infinity?` — about ${Math.round(st.days)} days`:''}</span><b>Weekly use</b><span>${num(rate(s),2)} ${s.unit}${(d.meals[id]||d.extras[id])?' from recipes':''}${isBasic(s)?' (always stocked)':''}</span><b>Shelf life</b><span>${s.life>=999?'Indefinite':s.life<1?Math.round(s.life*30)+' days':s.life+' months'}</span><b>Calories</b><span>${s.kcal?`${num(s.kcal)} per ${s.unit}`:'not set'}</span></div>
  ${s.note?`<p style="margin-top:.6em">${esc(s.note)}</p>`:''}

function saveRecipe(){const f=$('#rf');if(!f.reportValidity())return;const fd=new FormData(f);
  const rows=[...f.querySelectorAll('.ingrow')].map(rw=>[rw.querySelector('[name=ing]').value,Number(rw.querySelector('[name=qty]').value),rw.querySelector('[name=opt]').checked]).filter(x=>x[0]&&x[0]!=='__new'&&x[1]>0);
  if(!rows.length){toast('Add at least one ingredient with a quantity.');return;}const id=fd.get('id')||('recipe-'+Date.now());const hasY=fd.get('hasYield')==='on';
  const rec={id,n:fd.get('n').trim(),e:(fd.get('e')||'🍽️').trim()||'🍽️',cat:fd.get('cat')==='__newcat'?'Dinners':fd.get('cat'),tier:Number(fd.get('tier'))||2,serves:Math.max(0.5,Number(fd.get('serves'))||4),time:Number(fd.get('time'))||30,ings:rows.map(([i,q,o])=>o?[i,q,true]:[i,q]),steps:fd.get('steps').trim(),tags:[],yields:hasY?{id:fd.get('yid'),qty:Number(fd.get('yqty'))||1}:null};
  if(rec.yields){const s=staple(rec.yields.id);if(s&&!s.made){if(s.custom)s.made=true;else it(s.id).madeOverride=true;}}
  if(RECIPES.some(x=>x.id===id)){state.rover[id]={n:rec.n,e:rec.e,cat:rec.cat,tier:rec.tier,serves:rec.serves,time:rec.time,ings:rec.ings,steps:rec.steps,yields:rec.yields};state.rcat[id]=rec.cat;state.rtier[id]=rec.tier;save();closeDialog();toast(`Saved your version of ${rec.n}`);render();return;}
  const i=state.customRecipes.findIndex(x=>x.id===id);if(i>=0)state.customRecipes[i]=rec;else{state.customRecipes.push(rec);if(!rec.yields){if(rec.cat==='Dinners')state.meals.dinner.mains.push(id);else if(rec.cat==='Lunches')state.meals.lunch.mains.push(id);else if(rec.cat==='Sides')state.meals.dinner.sides.push(id);else state.recipes[id]=1;}}
  save();closeDialog();toast(rec.yields?`Saved ${rec.n}`:`Saved ${rec.n} — its ingredients are now in your plan`);render();}

let tourI=-1,tourReturn='home';

function tourTarget(view){if(view==='more')return document.querySelector('.topbar .morebtn');return document.querySelector(isMobile()?`.bottomnav [data-view="${view}"]`:`.topbar nav [data-view="${view}"]`);}
function showTour(){document.querySelectorAll('.tour-spot').forEach(e=>e.classList.remove('tour-spot'));let box=$('#tour');
  if(tourI<0||tourI>=TOUR.length){if(box)box.remove();tourI=-1;document.body.style.overflow='';document.body.classList.remove('touring');if(ui.view!==tourReturn){ui.view=tourReturn;render();}return;}

function setDeep(path,val){const parts=path.split('.');let o=state;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id;if(el.tagName==='A')e.preventDefault();

    case 'recipe':showRecipe(id);break;case 'detail':showDetail(id);break;case 'dlg-close':closeDialog();render();break;case 'noop':break;

    case 'cooked':{const r=recipe(id);const b=Number(el.dataset.b)||1;const x=r.yields?0:Math.max(0,Number(el.dataset.x)||0);const c=recipeCheck(r,b,x);if(x>0)state.leftovers.push({id:Date.now(),rid:r.id,n:r.n,e:r.e,servings:x,made:iso(today())});c.rows.forEach(x=>{if(x.s&&x.have)it(x.id).on=Math.max(0,(it(x.id).on||0)-x.need);});if(r.yields&&staple(r.yields.id))it(r.yields.id).on=(it(r.yields.id).on||0)+r.yields.qty*b;save();closeDialog();toast(r.yields?`${num(r.yields.qty*b)} ${staple(r.yields.id)?.unit||''} of ${staple(r.yields.id)?.n||''} added`:`Enjoy the ${r.n.toLowerCase()} — ingredients taken out${x?` · ${num(x)} serving${x===1?'':'s'} saved to leftovers`:''}`);render();break;}
    case 'want':{const r=recipe(id);const c=recipeCheck(r,Number(el.dataset.b)||1);c.missing.forEach(x=>{state.wanted[x.id]=Math.max(state.wanted[x.id]||0,x.need-x.on);});save();closeDialog();ui.view='shop';render();toast('Added to the shopping list');break;}
    case 'copy-shop':{const t=shopText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied')).catch(()=>openDialog(`<h2>Shopping list</h2><textarea style="min-height:300px">${esc(t)}</textarea><div class="row" style="margin-top:.6em"><button data-act="dlg-close">Close</button></div>`));break;}
    case 'shop-finish':shopFinish();break;
    case 'inc':{const s=staple(id);it(id).on=(it(id).on||0)+s.pkg;save();render();break;}
    case 'dec':{const s=staple(id);const step=['each','can','cube','bag','box','jar','loaf','head'].includes(s.unit)?1:s.unit==='lb'?0.5:s.unit==='gal'?0.25:1;it(id).on=Math.max(0,(it(id).on||0)-step);save();render();break;}
    case 'off':{const o=it(id);o.off=!o.off;save();closeDialog();render();break;}
    case 'basic-on':it(id).basic=true;save();render();break;
    case 'make-toggle':{const o=it(id);o.make=!o.make;save();render();toast(o.make?'Making it at home — its raw ingredients go on the list':'Buying it');break;}
    case 'detail-save':{const o=it(id);const s=staple(id);o.on=Math.max(0,Number($('#dOn').value)||0);const per=Number($('#dPer').value);o.per=(isNaN(per)||per===s.per)?null:per;const pr=Number($('#dPrice').value);o.price=(isNaN(pr)||pr===s.price)?null:pr;o.exp=$('#dExp').value||null;o.basic=$('#dBasic').checked;const tw=$('#dWeeks').value,tt=$('#dTarget').value;o.weeks=tw===''?null:Math.max(0,Number(tw)||0);o.target=tt===''?null:Math.max(0,Number(tt)||0);save();closeDialog();render();break;}
    case 'custom-new':showCustomForm(null);break;case 'custom-edit':showCustomForm(id);break;case 'custom-save':saveCustom();break;
    case 'custom-del':if(confirm('Delete this ingredient?')){state.customStaples=state.customStaples.filter(c=>c.id!==id);delete state.items[id];save();closeDialog();render();}break;
    case 'recipe-new':showRecipeForm(null,el.dataset.out);break;case 'recipe-edit':showRecipeForm(id);break;case 'recipe-save':ui.addOpen=false;saveRecipe();break;
    case 'recipe-reset':{delete state.rover[id];delete state.rcat[id];delete state.rtier[id];save();showRecipe(id);toast('Back to the original recipe');break;}
    case 'recipe-del':if(confirm('Delete this recipe?')){state.customRecipes=state.customRecipes.filter(r=>r.id!==id);save();closeDialog();render();}break;
    case 'ing-add':$('#ings').insertAdjacentHTML('beforeend',ingRowHTML(null,null,false));updatePer();break;case 'ing-del':el.closest('.ingrow').remove();break;
    case 'cat-add':{const v=$('#newCat').value.trim();if(v&&!state.cats.includes(v)){state.cats.push(v);save();render();}break;}
    case 'cat-del':state.cats=state.cats.filter(c=>c!==el.dataset.cat);save();render();break;
    case 'rfilter':ui.rfilter=ui.rfilter==='can'?'':'can';render();break;
    case 'tour-next':tourI++;showTour();break;case 'tour-prev':tourI--;showTour();break;case 'tour-skip':tourI=-1;showTour();break;case 'tour-start':startTour();break;
    case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pantry-backup-${iso(today())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break;}
    case 'import':$('#importFile').click();break;
    case 'reset':if(confirm('Delete the plan, pantry counts, meals and custom items for this account?')){state=fresh();save();ui.view='home';render();}break;
  }});
document.addEventListener('change',e=>{const el=e.target;const act=el.dataset.act;
  if(act==='on'){it(el.dataset.id).on=Math.max(0,Number(el.value)||0);save();render();return;}
  if(act==='shop-check'){ui.shopChecked=ui.shopChecked||{};ui.shopChecked[el.dataset.id]=el.checked;return;}
  if(act==='shop-qty'){ui.shopQty[el.dataset.id]=Math.max(0,Number(el.value)||0);ui.shopChecked=ui.shopChecked||{};ui.shopChecked[el.dataset.id]=true;const cb=el.closest('li').querySelector('input[type=checkbox]');if(cb)cb.checked=true;return;}
  if(act==='plan-set'){const d=el.dataset.date,slot=el.dataset.slot;const p=state.plan[d]||(state.plan[d]={});if(el.value)p[slot]=el.value;else delete p[slot];if(!Object.keys(p).length)delete state.plan[d];save();if(ui.view==='home')render();return;}
  if(act==='cat'){ui.cat=el.value;render();return;}if(act==='only'){ui.only=el.value;render();return;}if(act==='rcat-filter'){ui.rcat=el.value;render();return;}
  if(act==='batches'){showRecipe(el.dataset.id,el.value);return;}
  if(act==='lo-plan'){if(!el.value)return;const [ds,slot]=el.value.split('|');const p=state.plan[ds]||(state.plan[ds]={});p[slot]='lo:'+el.dataset.lo;save();toast(`Planned for ${ds===iso(today())?'today':DOW[parseISO(ds).getDay()]} ${slot}`);render();return;}
  if(act==='lo-extra'){showRecipe(el.dataset.id,1,el.value);return;}
  if(act==='set-rcat'){const r=recipe(el.dataset.id);if(r.custom){const cr=state.customRecipes.find(x=>x.id===r.id);cr.cat=el.value;}else state.rcat[r.id]=el.value;save();showRecipe(r.id);return;}
  if(act==='set-rtier'){const r=recipe(el.dataset.id);if(r.custom){const cr=state.customRecipes.find(x=>x.id===r.id);cr.tier=Number(el.value);}else state.rtier[r.id]=Number(el.value);save();return;}
  if(act==='meal'){mealToggle(el.dataset.meal,el.dataset.role,el.dataset.id,el.checked);save();const c=$('#mealCount');if(c)c.textContent=mealCountText();return;}
  if(act==='meal-count'){state.meals[el.dataset.meal].count=Math.max(0,Math.min(21,Number(el.value)||0));save();const c=$('#mealCount');if(c)c.textContent=mealCountText();return;}
  if(act==='wr'){const v=Math.max(0,Number(el.value)||0);if(v)state.recipes[el.dataset.id]=v;else delete state.recipes[el.dataset.id];save();const c=$('#mealCount');if(c)c.textContent=mealCountText();return;}
  if(act==='freq'){const v=Math.max(0,Number(el.value)||0);if(v)state.recipes[el.dataset.id]=v;else delete state.recipes[el.dataset.id];save();return;}
  if(el.closest&&el.closest('#rf'))updatePer();
  if(el.name==='hasYield'){$('#yieldBox').style.display=el.checked?'':'none';return;}
  if(el.name==='ing'&&el.value==='__new'){ui.recipeDraft=recipeDraft();showCustomForm(null);toast('Save the new ingredient and you will be returned to the recipe');return;}
  if(el.name==='cat'&&el.value==='__newcat'){const name=(prompt('Name the new category:')||'').trim();if(name&&!state.cats.includes(name)){state.cats.push(name);save();}el.innerHTML=state.cats.map(c=>`<option ${c===(name||'Dinners')?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__newcat">+ New category…</option>';return;}
  if(el.dataset.set){const k=el.dataset.set;let v=el.type==='checkbox'?el.checked:(el.type==='number'||el.type==='range'||['planDay','shopDay','shopsPerMonth'].includes(k))?Number(el.value):el.value;if(k==='name')v=v.trim()||'Home pantry';if(k==='adults')v=Math.max(1,v);if(k==='weeks')v=Math.max(1,Math.min(26,v));
    if(k==='settings.theme')state.settings.themeSet=true;setDeep(k,v);if(k==='shopDay'||k==='shopsPerMonth'){const d=today();while(d.getDay()!==state.shopDay)d.setDate(d.getDate()+1);state.shopAnchor=iso(d);}save();if(el.type==='range'){const lb=$('#'+el.dataset.live);if(lb)lb.textContent=v;}else render();return;}
  if(el.id==='obWeeks'){const lb=$('#wkLabel');if(lb)lb.textContent=el.value;return;}
  if(el.id==='importFile'&&el.files[0]){const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||!s.items)throw 0;state=normalize(s);save();toast('Backup imported');render();}catch(x){toast('That file is not a pantry backup.');}};rd.readAsText(el.files[0]);}
});
document.addEventListener('input',e=>{const el=e.target;if(el.closest&&el.closest('#rf')){updatePer();}if(el.dataset.act==='pq'){ui.pq=el.value;ui.pickSel=null;$('#pickList').innerHTML=pickListHTML();return;}if(el.dataset.act==='q'){ui.q=el.value;const pos=el.selectionStart;$('#view').innerHTML=renderView(alerts(),shopping());const n=$('#view [data-act="q"]');if(n){n.focus();n.setSelectionRange(pos,pos);}return;}
  if(el.dataset.act==='wq'){ui.wq=el.value;const pos=el.selectionStart;const inDlg=!!el.closest('dialog');if(inDlg){$('#dlgBody').innerHTML=`<div class="row between"><div></div><button class="ghost" data-act="dlg-close" aria-label="Close">✕</button></div>${renderMealPlanner(false)}<div class="row" style="margin-top:1em"><button class="primary" data-act="dlg-close">Done</button></div>`;}else render();const n=document.querySelector('[data-act="wq"]');if(n){n.focus();n.setSelectionRange(pos,pos);}return;}
  if(el.id==='obWeeks'||el.type==='range'){const lb=$('#'+(el.dataset.live||'wkLabel'));if(lb)lb.textContent=el.value;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.act==='on')e.target.blur();if(e.key==='Enter'&&(e.target.id==='auPass'||e.target.id==='auPass2'||e.target.id==='auUser')){$('#auBtn')?.click();}});
dlg().addEventListener('click',e=>{if(e.target===dlg()){closeDialog();render();}});

/* ============================================================ boot */
(async function boot(){if(session&&session.uid!=='local'&&!hasBackend())saveSession(null);
  if(session){state=loadLocal();render();await pullState(true);postClean();waterTick();startSync();render();}else render();})();
</script>
