<style>
:root{
  --bg:#EFE9DC; --panel:#FBF9F3; --panel-2:#F3EEE2; --ink:#241E16; --muted:#6B6250; --line:#D6CDB8;
  --moss:#7A4E2A; --moss-ink:#FBF4E8; --moss-soft:#EAD9C3;
  --sun:#E5B23A; --sun-soft:#FBEFCB; --alert:#C2432B; --alert-soft:#F7D9D2; --water:#3B7CA3; --water-soft:#D5E6F0; --good:#3D6C38; --good-soft:#D9E7CF;
  --shadow:0 1px 2px rgba(36,30,22,.08),0 8px 24px rgba(36,30,22,.08); --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A1612; --panel:#25201A; --panel-2:#2E271F; --ink:#EDE6D8; --muted:#A99E8A; --line:#463C30;
  --moss:#C9955F; --moss-ink:#1A1410; --moss-soft:#4A3625;
  --sun:#E8B848; --sun-soft:#4A3C15; --alert:#E0644C; --alert-soft:#4B231B; --water:#6AA7CF; --water-soft:#1D3242; --good:#7FB574; --good-soft:#2C4028;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1A1612; --panel:#25201A; --panel-2:#2E271F; --ink:#EDE6D8; --muted:#A99E8A; --line:#463C30;
  --moss:#C9955F; --moss-ink:#1A1410; --moss-soft:#4A3625;
  --sun:#E8B848; --sun-soft:#4A3C15; --alert:#E0644C; --alert-soft:#4B231B; --water:#6AA7CF; --water-soft:#1D3242; --good:#7FB574; --good-soft:#2C4028;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.5 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,"Times New Roman",serif; font-weight:600; letter-spacing:-.01em; margin:0}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 .6em}
button{font:inherit; color:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:.45em .85em; line-height:1.2}
button:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
button.primary{background:var(--moss); color:var(--moss-ink); border-color:var(--moss); font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--alert); border-color:var(--alert)}
button.ghost{background:transparent; border-color:transparent}
button.ghost:hover{background:var(--panel-2); border-color:transparent}
button.small{padding:.3em .6em; font-size:.85rem}
button.tiny{padding:.15em .5em; font-size:.8rem}
button:disabled{opacity:.45; cursor:not-allowed}
input,select,textarea{font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.45em .6em; width:100%}
textarea{min-height:70px; resize:vertical}
label{display:block; font-weight:600; font-size:.9rem; margin:.7em 0 .25em}
label .hint{font-weight:400; color:var(--muted)}
.row{display:flex; gap:.6em; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.6em}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.6em}
.muted{color:var(--muted)} .tiny{font-size:.8rem}
.stack>*+*{margin-top:.75em}
hr{border:0; border-top:1px solid var(--line); margin:1em 0}
.check{display:flex; align-items:center; gap:.5em; margin:.35em 0; font-weight:600; cursor:pointer}
.check input{width:auto}
.check .hint{font-weight:400; color:var(--muted)}

#app{height:100%; display:flex; flex-direction:column}
header.bar{display:flex; align-items:center; gap:1em; padding:.7em 1.1em; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap}
header.bar .title{display:flex; align-items:baseline; gap:.6em}
header.bar .title small{color:var(--muted)}
header.bar .spacer{flex:1}
.pill{display:inline-flex; align-items:center; gap:.4em; padding:.25em .7em; border-radius:999px; background:var(--moss-soft); font-size:.85rem; font-weight:600}
.pill.warn{background:var(--sun-soft)} .pill.bad{background:var(--alert-soft)}
main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 380px; min-height:0}
@media (max-width:900px){ #app{height:auto; min-height:100%} main{display:block} .content{overflow:visible} }
.content{overflow:auto; padding:1.2em; min-height:0}
aside.panel{background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:1em; min-height:0}
@media (max-width:900px){ aside.panel{border-left:0; border-top:1px solid var(--line); max-height:none; overflow:visible} .tabs{position:static; margin-top:-1.2em} }
.tabs{display:flex; border-bottom:1px solid var(--line); overflow-x:auto; margin:-1.2em -1.2em 1em; padding:0 .6em; background:var(--panel); position:sticky; top:-1.2em; z-index:3}
.tabs button{border:0; border-radius:0; background:transparent; padding:.7em .8em; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; white-space:nowrap}
.tabs button.active{color:var(--ink); border-bottom-color:var(--moss)}
.tabs button .n{display:inline-block; min-width:1.4em; padding:0 .35em; margin-left:.35em; border-radius:999px; background:var(--alert); color:#fff; font-size:.75rem; text-align:center}

.card{background:var(--panel-2); border-radius:var(--r); padding:.85em 1em}
.card.accent{background:var(--moss); color:var(--moss-ink)}
.card.accent .muted{color:rgba(255,255,255,.75)}
.chip{display:inline-block; padding:.1em .55em; border-radius:999px; font-size:.78rem; font-weight:600; background:var(--panel-2); border:1px solid var(--line); white-space:nowrap}
.chip.good{background:var(--good-soft); border-color:transparent} .chip.ok{background:var(--sun-soft); border-color:transparent} .chip.bad{background:var(--alert-soft); border-color:transparent} .chip.info{background:var(--water-soft); border-color:transparent}
.gauge{height:10px; background:var(--line); border-radius:99px; overflow:hidden; position:relative}
.gauge i{display:block; height:100%; background:var(--good)}
.gauge i.warn{background:var(--sun)} .gauge i.bad{background:var(--alert)}

/* stock table */
.cat-h{display:flex; align-items:baseline; gap:.6em; margin:1.2em 0 .4em}
.cat-h h3{flex:1}
.item{display:grid; grid-template-columns:2em minmax(0,1.6fr) minmax(0,1fr) 150px auto; gap:.6em; align-items:center; padding:.5em .4em; border-bottom:1px solid var(--line)}
.item:hover{background:var(--panel-2)}
.item.off{opacity:.5}
.item .em{font-size:1.4rem; text-align:center}
.item .nm{font-weight:700}
.item .nm small{display:block; font-weight:400; color:var(--muted); font-size:.8rem}
.item .tgt{font-size:.9rem}
.item .tgt small{display:block; color:var(--muted); font-size:.78rem}
.item .qty{display:flex; align-items:center; gap:.25em}
.item .qty input{width:64px; text-align:right; padding:.3em .4em}
.item .qty span{font-size:.8rem; color:var(--muted)}
.item .st{display:flex; flex-direction:column; gap:.25em; align-items:flex-end; min-width:90px}
.item .bar{width:90px; height:6px; background:var(--line); border-radius:99px; overflow:hidden}
.item .bar i{display:block; height:100%; background:var(--good)} .item .bar i.warn{background:var(--sun)} .item .bar i.bad{background:var(--alert)}
@media (max-width:640px){ .item{grid-template-columns:2em minmax(0,1fr) auto; grid-template-rows:auto auto} .item .tgt{grid-column:2; font-size:.8rem} .item .st{grid-column:3; grid-row:1/3} .item .qty{grid-column:2/4} }

.recipe{display:flex; gap:.8em; padding:.7em .5em; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start}
.recipe:hover{background:var(--panel-2)}
.recipe .em{font-size:1.6rem; width:1.6em; text-align:center; flex:none}
.recipe .nm{font-weight:700}
.recipe .meta{color:var(--muted); font-size:.85rem}
.shop li{display:flex; gap:.6em; align-items:center; padding:.4em .3em; border-bottom:1px solid var(--line)}
.shop li b{flex:1}
.shop li input{width:auto}
.alerts{list-style:none; margin:0; padding:0}
.alerts li{display:flex; gap:.6em; align-items:flex-start; padding:.5em .6em; border-radius:8px; cursor:pointer}
.alerts li:hover{background:var(--panel-2)}
.dot{width:.65em; height:.65em; border-radius:50%; flex:none; margin-top:.45em}
.dot.out{background:var(--alert)} .dot.low{background:var(--sun)} .dot.exp{background:var(--water)} .dot.space{background:var(--moss)}
.toast{position:fixed; left:50%; bottom:calc(1.2em + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:.6em 1em; border-radius:999px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; font-weight:600}
.toast.show{opacity:1}
.wizard{max-width:860px; margin:0 auto; padding:2em 1.2em 4em}
.wizard .hero{display:grid; grid-template-columns:1.1fr 1fr; gap:2em; align-items:center; margin-bottom:2em}
@media (max-width:760px){ .wizard .hero{grid-template-columns:1fr} }
.wizard .hero h1{font-size:clamp(2rem,5vw,3.2rem); line-height:1.05; font-weight:700}
.wizard .hero p{font-size:1.05rem; color:var(--muted)}
.steps{display:flex; gap:.4em; margin-bottom:1.2em; flex-wrap:wrap}
.steps span{padding:.25em .7em; border-radius:999px; font-size:.85rem; font-weight:600; background:var(--panel-2); color:var(--muted)}
.steps span.on{background:var(--moss); color:var(--moss-ink)} .steps span.done{background:var(--moss-soft); color:var(--ink)}
.shelfviz{display:flex; gap:6px; align-items:flex-end; height:70px; margin:.6em 0}
.shelfviz i{display:block; flex:1; background:var(--moss-soft); border:1px solid var(--moss); border-radius:4px 4px 0 0; position:relative; overflow:hidden}
.shelfviz i b{position:absolute; left:0; right:0; bottom:0; background:var(--moss); opacity:.8}
.help{font-size:.9rem; color:var(--muted)}
dialog{border:0; border-radius:14px; padding:0; background:var(--panel); color:var(--ink); box-shadow:var(--shadow); width:min(600px,92vw); max-height:88vh}
dialog::backdrop{background:rgba(30,24,16,.45)}
dialog .dbody{padding:1.2em; overflow:auto; max-height:88vh}
.kv{display:grid; grid-template-columns:auto 1fr; gap:.2em .8em; font-size:.9rem}
.kv b{color:var(--muted); font-weight:600}
.ing{display:grid; grid-template-columns:1fr auto auto; gap:.3em .8em; font-size:.9rem; align-items:center}
.ing .no{color:var(--alert)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.tour-hl{outline:3px solid var(--sun) !important; outline-offset:3px; border-radius:8px}
#tour{position:fixed; left:0; right:0; bottom:0; z-index:40; padding:1em; padding-bottom:calc(1em + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; pointer-events:none}
.tour-card{pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:1em 1.1em; max-width:460px; width:100%}
.tour-card p{margin:.3em 0 .8em}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<script>
/* ============================================================ helpers */
const $=s=>document.querySelector(s);
const DAY=86400000;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fmt=d=>{if(typeof d==='string')d=parseISO(d);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const num=(x,dp=1)=>{const n=Number(x)||0; return Number.isInteger(n)?String(n):n.toFixed(dp).replace(/\.?0+$/,'');};
const money=x=>'$'+(Math.round(x*100)/100).toFixed(2).replace(/\.00$/,'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
const STORES={dry:{label:'Dry shelves',e:'🗄️'},fridge:{label:'Fridge',e:'🧊'},freezer:{label:'Freezer',e:'❄️'}};

const KEY='shelfAndWeeks.v1';
let state=null, storageOK=true;

function fresh(){return {version:1,setup:false,name:'Home pantry',adults:2,kids:0,weeks:4,
  space:{shelves:5,w:36,d:16,h:12,fridge:12,freezer:6},prefs:{veg:false,gf:false,bake:false,water:false,fridge:true,freezer:true},
  items:{},customStaples:[],customRecipes:[],recipes:{},wanted:{},settings:{theme:'auto',tutorial:true}};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=Object.assign(fresh(),JSON.parse(r));s.items=s.items||{};s.wanted=s.wanted||{};s.customStaples=s.customStaples||[];s.customRecipes=s.customRecipes||[];s.settings=Object.assign({theme:'auto',tutorial:true},s.settings||{});
  if(!s.recipes){ s.recipes={}; Object.keys(s.items).forEach(id=>{}); s._legacy=true; } return s;}}catch(e){}return fresh();}
function save(){_demand=null;state.rev=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}schedulePush();}
function saveLocalOnly(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}

/* ============================================================ plan maths */
function allStaples(){return STAPLES.map(s=>state.items[s.id]?.madeOverride?Object.assign({},s,{made:true}):s).concat(state.customStaples.map(c=>Object.assign({},c,{custom:true})));}
function staple(id){return allStaples().find(s=>s.id===id);}
function it(id){return state.items[id]||(state.items[id]={on:0,exp:null,off:false});}

let _demand=null,_demandKey='';

const SYNCKEY='shelfAndWeeks.sync', SYNC_APP='pantry';
let sync=loadSync(), pushTimer=null, pullTimer=null;
function loadSync(){try{return Object.assign({url:'',key:'',code:'',enabled:false,status:'',last:null},JSON.parse(localStorage.getItem(SYNCKEY)||'{}'));}catch(e){return {url:'',key:'',code:'',enabled:false,status:'',last:null};}}
function saveSync(){try{localStorage.setItem(SYNCKEY,JSON.stringify(sync));}catch(e){}}
function syncReady(){return !!(sync.enabled&&sync.url&&sync.key&&sync.code);}
function syncHeaders(){return {apikey:sync.key,Authorization:'Bearer '+sync.key,'Content-Type':'application/json'};}
function rowId(){return SYNC_APP+':'+sync.code;}
function setStatus(s,ok){sync.status=s;sync.ok=ok;saveSync();const el=$('#syncStatus');if(el){el.textContent=s;el.className='tiny '+(ok?'muted':'')+(ok?'':' ');el.style.color=ok?'':'var(--alert)';}const p=$('#syncPill');if(p)p.outerHTML=syncPill();}
function syncPill(){if(!sync.enabled)return '';return `<span class="pill ${sync.ok===false?'bad':''}" id="syncPill" title="${esc(sync.status||'')}">${sync.ok===false?'⚠️ sync':'☁️ shared'}</span>`;}
function schedulePush(){if(!syncReady())return;clearTimeout(pushTimer);pushTimer=setTimeout(pushState,1500);}
async function pushState(){if(!syncReady())return;try{
  const r=await fetch(`${sync.url}/rest/v1/households?on_conflict=id`,{method:'POST',headers:Object.assign(syncHeaders(),{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({id:rowId(),app:SYNC_APP,doc:state,updated_at:new Date().toISOString()})});
  if(!r.ok)throw new Error(await errText(r));sync.last=Date.now();setStatus('Synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),true);
}catch(e){setStatus('Sync failed: '+e.message,false);}}
async function pullState(manual){if(!syncReady())return;try{
  const r=await fetch(`${sync.url}/rest/v1/households?id=eq.${encodeURIComponent(rowId())}&select=doc,updated_at`,{headers:syncHeaders()});
  if(!r.ok)throw new Error(await errText(r));const rows=await r.json();
  if(!rows.length){await pushState();return;}
  const remote=rows[0].doc;if(!remote||!remote.items)throw new Error('Unexpected data in the household row');
  const adopt=!sync.last||!state.rev||(remote.rev&&remote.rev>state.rev); // a device that has never synced takes the household copy
  if(adopt){const wasSetup=state.setup;state=Object.assign(fresh(),remote);state.items=state.items||{};state.wanted=state.wanted||{};state.customStaples=state.customStaples||[];state.customRecipes=state.customRecipes||[];saveLocalOnly();sync.last=Date.now();setStatus('Updated from household '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),true);render();if(manual||wasSetup)toast('Updated from your household');}
  else if(remote.rev&&remote.rev<state.rev){await pushState();}
  else{sync.last=Date.now();setStatus('Synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),true);}
}catch(e){setStatus('Sync failed: '+e.message,false);if(manual)toast('Sync failed — see Settings');}}
async function errText(r){try{const j=await r.json();return j.message||j.hint||('HTTP '+r.status);}catch(e){return 'HTTP '+r.status;}}
function startSyncLoop(){clearInterval(pullTimer);if(!syncReady())return;pullState(false);pullTimer=setInterval(()=>{if(document.visibilityState==='visible')pullState(false);},45000);}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullState(false);});
window.addEventListener('focus',()=>pullState(false));
const SYNC_SQL=`create table if not exists households (
  id text primary key,
  app text,
  doc jsonb not null,
  updated_at timestamptz not null default now()
);
alter table households enable row level security;
create policy "household code is the key" on households
  for all to anon using (true) with check (true);`;
function genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';const b=new Uint8Array(20);crypto.getRandomValues(b);b.forEach(x=>s+=a[x%a.length]);return s.replace(/(.{5})(?=.)/g,'$1-');}
function renderSyncSettings(){return `<p class="tiny muted">Two phones (or a phone and a laptop) can share one pantry through a free Supabase project. Set it up once, then enter the same three values on every device. Whoever saved last wins; the app pulls when you open it and every 45 seconds while it is on screen.</p>
  <details style="margin:.5em 0"><summary style="cursor:pointer;font-weight:600">One-time setup (about 3 minutes)</summary><ol class="tiny" style="padding-left:1.3em;margin:.4em 0">
    <li>At <b>supabase.com</b>, open your project (or create a free one).</li>
    <li>Open the <b>SQL Editor</b>, paste this and run it: <button class="tiny" data-act="copy-sql">Copy SQL</button><pre class="tiny" style="background:var(--panel-2);padding:.6em;border-radius:6px;overflow:auto">${esc(SYNC_SQL)}</pre></li>
    <li>In <b>Project Settings → API</b> copy the <b>Project URL</b> and the <b>anon public</b> key into the boxes below.</li>
    <li>Click <b>Generate</b> for a household code, tick <b>Share this pantry</b>, and save.</li>
    <li>On the other phone, open the same page, go to Settings and enter the same URL, key and code. It will pull this pantry.</li></ol>
    <p class="tiny muted">The household code is the password: anyone with your anon key and the code can read and change the pantry, so keep the code private. The garden app can share the same table later.</p></details>
  <div class="grid2"><div><label>Supabase project URL</label><input id="syUrl" value="${esc(sync.url)}" placeholder="https://xxxx.supabase.co"></div><div><label>anon public key</label><input id="syKey" type="password" value="${esc(sync.key)}" placeholder="eyJ…"></div></div>
  <label>Household code</label><div class="row"><input id="syCode" value="${esc(sync.code)}" placeholder="pick one and use it on every device" style="flex:1;min-width:200px"><button class="small" data-act="sync-gen">Generate</button></div>
  <label class="check" style="margin-top:.6em"><input type="checkbox" id="syOn" ${sync.enabled?'checked':''}>Share this pantry with my household</label>
  <div class="row"><button class="primary" data-act="sync-save">Save sync settings</button><button data-act="sync-now" ${syncReady()?'':'disabled'}>Sync now</button><span id="syncStatus" class="tiny" style="color:${sync.ok===false?'var(--alert)':'var(--muted)'}">${esc(sync.status||(sync.enabled?'':'Not shared — this browser only'))}</span></div>`;}

/* ============================================================ wizard */
function wrCountText(){const n=Object.values(state.recipes).filter(v=>v>0).length;const meals=Object.values(state.recipes).reduce((a,v)=>a+(Number(v)||0),0);return `${n} recipes · ${num(meals)} meals a week`;}
function renderWizard(){const st=ui.wiz;const steps=['Household','Space','Cooking','Recipes'];let body='';const sp=state.space,p=state.prefs;
  if(st===0)body=`<h2>Who are you feeding, and for how long?</h2><p class="help">Kids count as 0.6 of an adult. "Weeks of stock" is how long you want to be able to cook without a grocery run — 2–4 weeks is a well-stocked kitchen, 8–12 is hurricane-season territory.</p>
    <div class="grid3" style="max-width:520px"><div><label>Adults</label><input type="number" id="wAdults" min="1" max="20" value="${state.adults}"></div><div><label>Kids</label><input type="number" id="wKids" min="0" max="20" value="${state.kids}"></div><div><label>Weeks of stock</label><input type="number" id="wWeeks" min="1" max="26" value="${state.weeks}"></div></div>
    <label style="max-width:520px">Pantry name</label><input id="wName" value="${esc(state.name)}" style="max-width:520px">
    <div class="row" style="margin-top:1.5em"><button class="primary" data-act="wiz-next">Continue</button></div>`;
  if(st===1)body=`<h2>How much room do you have?</h2><p class="help">Measure the shelves you will actually use for food. A typical pantry shelf is 30–36" wide and 12–16" deep with 12" between shelves. Fridge and freezer are in cubic feet (it is printed inside the door); about half the fridge and most of the freezer get counted for staples.</p>
    <div class="grid3" style="max-width:640px"><div><label>Number of shelves</label><input type="number" id="wShelves" min="0" value="${sp.shelves}"></div><div><label>Shelf width (in)</label><input type="number" id="wW" min="0" value="${sp.w}"></div><div><label>Shelf depth (in)</label><input type="number" id="wD" min="0" value="${sp.d}"></div></div>
    <div class="grid3" style="max-width:640px"><div><label>Clearance between shelves (in)</label><input type="number" id="wH" min="0" value="${sp.h}"></div><div><label>Fridge (cu ft)</label><input type="number" id="wFridge" min="0" value="${sp.fridge}"></div><div><label>Freezer (cu ft)</label><input type="number" id="wFreezer" min="0" value="${sp.freezer}"></div></div>
    <div class="row" style="margin-top:1.5em"><button class="ghost" data-act="wiz-back">Back</button><button class="primary" data-act="wiz-next">Continue</button></div>`;
  if(st===2)body=`<h2>How do you cook?</h2><p class="help">This decides which staples go in the plan. You can add or remove any single item later.</p>
    <label class="check"><input type="checkbox" id="wFridgeOn" ${p.fridge?'checked':''}>Include fridge items <span class="hint">(eggs, butter, cheese, milk)</span></label>
    <label class="check"><input type="checkbox" id="wFreezerOn" ${p.freezer?'checked':''}>Include freezer items <span class="hint">(meat, frozen vegetables, bread)</span></label>
    <label class="check"><input type="checkbox" id="wVeg" ${p.veg?'checked':''}>Vegetarian</label>
    <label class="check"><input type="checkbox" id="wGf" ${p.gf?'checked':''}>Gluten-free</label>
    <label class="check"><input type="checkbox" id="wBake" ${p.bake?'checked':''}>I bake bread at home</label>
    <label class="check"><input type="checkbox" id="wWater" ${p.water?'checked':''}>Stock emergency drinking water <span class="hint">(1 gal per person per day)</span></label>
    <div class="row" style="margin-top:1.5em"><button class="ghost" data-act="wiz-back">Back</button><button class="primary" data-act="wiz-next">Continue</button></div>`;
  if(st===3){const q=(ui.wq||'').toLowerCase();const list=allRecipes().filter(r=>!r.yields&&r.g!=='shelf'&&(!q||r.n.toLowerCase().includes(q)));const groups=['meals','light','breakfast','sides','sweets'];
    body=`<h2>What do you actually cook?</h2><p class="help">Tick the recipes in your regular rotation and say roughly how many times a week you make each. <b>This is what decides your shopping list</b> — only the raw ingredients these recipes need get stocked (plus anything you later mark "always keep stocked", like coffee). We pre-ticked 15 common ones; change anything.</p>
    <div class="row between"><input placeholder="Search recipes" value="${esc(ui.wq||'')}" data-act="wq" style="max-width:280px"><span class="tiny muted" id="wrCount">${wrCountText()}</span><button class="small" data-act="recipe-new">+ Add my own recipe</button></div>
    ${groups.map(g=>{const rs=list.filter(r=>r.g===g);if(!rs.length)return '';return `<h3 style="margin-top:1em">${GROUP_LABEL[g]}</h3>${rs.map(r=>`<label class="wr row" style="padding:.35em .2em;border-bottom:1px solid var(--line);margin:0;font-weight:400;cursor:pointer"><input type="checkbox" data-act="wr" data-id="${r.id}" ${freq(r.id)>0?'checked':''} style="width:auto"><span style="font-size:1.2rem">${r.e}</span><span style="flex:1"><b>${esc(r.n)}</b>${r.custom?' <span class="chip">custom</span>':''} <span class="tiny muted">${r.time} min · ~${Math.round(recipeKcal(r))} kcal</span></span><input type="number" min="0" step="0.5" value="${num(freq(r.id))}" data-act="wr" data-id="${r.id}" style="width:64px" aria-label="times per week"><span class="tiny muted">×/wk</span></label>`).join('')}`;}).join('')}
    <div class="row" style="margin-top:1.5em"><button class="ghost" data-act="wiz-back">Back</button><button class="primary" data-act="wiz-finish">Build my stock plan</button></div>`;}
  $('#app').innerHTML=`<div class="wizard"><div class="hero"><div><h1>Shelf &amp; Weeks</h1><p>Tell it how many people, how many weeks and how much shelf space, and it works out the raw staples to keep, fits them to the space, tracks what is on hand, and shows what you can cook tonight.</p></div>
    <div class="card" style="background:var(--panel)"><b>${STAPLES.length} staples, ${RECIPES.length} recipes</b> — plus your own<p class="tiny muted" style="margin:.3em 0 0">Grains, legumes, cans, oils, baking, spices, long-keeping produce, fridge and freezer basics — every recipe uses only what is on the list.</p></div></div>
    <div class="steps">${steps.map((s,i)=>`<span class="${i===st?'on':i<st?'done':''}">${i+1}. ${s}</span>`).join('')}</div>${body}</div>`;}

/* ============================================================ actions */
function setDeep(path,val){const parts=path.split('.');let o=state;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;}
function toMake(){return planned().filter(makeAtHome).map(s=>({s,r:recipeFor(s.id),b:batchesNeeded(s)})).filter(x=>x.b>0);}
function shopText(){const shop=shopping();let cat='',out=`${state.name} — shopping list (${fmt(today())})\n`;shop.sort((a,b)=>CATS.indexOf(a.s.cat)-CATS.indexOf(b.s.cat)).forEach(x=>{if(x.s.cat!==cat){cat=x.s.cat;out+=`\n${cat}\n`;}out+=`  [ ] ${x.s.n} — ${x.n} × ${x.s.pkgName}\n`;});return out+`\nEstimated: ${money(shop.reduce((a,x)=>a+x.cost,0))}`;}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'tab':ui.tab=el.dataset.tab;ui.q='';render();break;
    case 'detail':showDetail(id);break;
    case 'recipe':showRecipe(id);break;
    case 'dlg-close':closeDialog();break;
    case 'inc':{const s=staple(id);it(id).on=(it(id).on||0)+s.pkg;save();render();break;}
    case 'dec':{const s=staple(id);const step=['each','can','cube','bag','box','jar','loaf','head'].includes(s.unit)?1:s.unit==='lb'?0.5:s.unit==='gal'?0.25:1;it(id).on=Math.max(0,(it(id).on||0)-step);save();render();break;}
    case 'off':{const o=it(id);o.off=!o.off;save();closeDialog();render();toast(o.off?'Removed from plan':'Added to plan');break;}
    case 'detail-save':{const o=it(id);const s=staple(id);o.on=Math.max(0,Number($('#dOn').value)||0);const per=Number($('#dPer').value);o.per=(isNaN(per)||per===s.per)?null:per;const pr=Number($('#dPrice').value);o.price=(isNaN(pr)||pr===s.price)?null:pr;o.exp=$('#dExp').value||null;o.basic=$('#dBasic').checked;save();closeDialog();render();break;}
    case 'cooked':{const r=recipe(id);const b=Number(el.dataset.b)||1;const c=recipeCheck(r,b);c.rows.forEach(x=>{if(x.s&&x.have)it(x.id).on=Math.max(0,(it(x.id).on||0)-x.need);});
      if(r.yields&&staple(r.yields.id)){it(r.yields.id).on=(it(r.yields.id).on||0)+r.yields.qty*b;}
      save();closeDialog();toast(r.yields?`${num(r.yields.qty*b)} ${staple(r.yields.id)?.unit||''} of ${staple(r.yields.id)?.n||r.yields.id} added to stock`:`Enjoy the ${r.n.toLowerCase()} — ingredients subtracted`);render();break;}
    case 'basic-on':it(id).basic=true;save();render();toast('Added to the plan as a basic');break;
    case 'make-toggle':{const o=it(id);o.make=!o.make;save();render();toast(o.make?'Making it at home — raw ingredients go on the shopping list':'Buying it');break;}
    case 'batches':break;
    case 'recipe-new':showRecipeForm(null,el.dataset.out);break;
    case 'recipe-edit':showRecipeForm(id);break;
    case 'recipe-save':saveRecipe();break;
    case 'recipe-del':{if(!confirm('Delete this recipe?'))return;state.customRecipes=state.customRecipes.filter(r=>r.id!==id);save();closeDialog();render();break;}
    case 'ing-add':addIngRow();break;
    case 'ing-del':el.closest('.ingrow').remove();break;
    case 'want':{const r=recipe(id);const c=recipeCheck(r,Number(el.dataset.b)||1);c.missing.forEach(x=>{state.wanted[x.id]=Math.max(state.wanted[x.id]||0,x.need-x.on);});save();closeDialog();ui.tab='shopping';render();toast('Added to shopping list');break;}
    case 'copy-shop':{const t=shopText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied')).catch(()=>{openDialog(`<h2>Shopping list</h2><textarea style="min-height:300px">${esc(t)}</textarea><div class="row" style="margin-top:.6em"><button data-act="dlg-close">Close</button></div>`);});break;}
    case 'bought-all':{shopping().forEach(x=>{it(x.s.id).on=(it(x.s.id).on||0)+x.qty;delete state.wanted[x.s.id];});save();render();toast('Stock updated');break;}
    case 'custom-new':showCustomForm(null);break;
    case 'custom-edit':showCustomForm(id);break;
    case 'custom-save':saveCustom();break;
    case 'custom-del':{if(!confirm('Delete this staple?'))return;state.customStaples=state.customStaples.filter(c=>c.id!==id);delete state.items[id];save();closeDialog();render();break;}
    case 'wiz-next':{if(ui.wiz===0){state.adults=Math.max(1,Number($('#wAdults').value)||2);state.kids=Math.max(0,Number($('#wKids').value)||0);state.weeks=Math.max(1,Math.min(26,Number($('#wWeeks').value)||4));state.name=$('#wName').value.trim()||'Home pantry';}
      if(ui.wiz===1){state.space={shelves:+$('#wShelves').value||0,w:+$('#wW').value||0,d:+$('#wD').value||0,h:+$('#wH').value||12,fridge:+$('#wFridge').value||0,freezer:+$('#wFreezer').value||0};}
      if(ui.wiz===2){state.prefs={fridge:$('#wFridgeOn').checked,freezer:$('#wFreezerOn').checked,veg:$('#wVeg').checked,gf:$('#wGf').checked,bake:$('#wBake').checked,water:$('#wWater').checked};
        if(!Object.keys(state.recipes).length&&!state._legacy){STARTER.forEach(id=>{const r=recipe(id);if(r&&recipeCheck(r).fits)state.recipes[id]=1;});['salt','pepper','oil','sugar','coffee'].forEach(id=>it(id).basic=true);if(state.prefs.water)it('water').basic=true;}}
      ui.wiz++;save();renderWizard();break;}
    case 'wiz-back':ui.wiz=Math.max(0,ui.wiz-1);renderWizard();break;
    case 'wiz-finish':{state.setup=true;ui.wiz=0;delete state._legacy;save();render();if(state.settings.tutorial!==false)startTour();break;}
    case 'rerun':state.setup=false;ui.wiz=0;save();renderWizard();break;
    case 'choose-recipes':state.setup=false;ui.wiz=3;save();renderWizard();break;
    case 'sync-gen':$('#syCode').value=genCode();break;
    case 'tour-next':tourI++;showTour();break;
    case 'tour-prev':tourI--;showTour();break;
    case 'tour-skip':tourI=-1;showTour();break;
    case 'tour-start':startTour();break;
    case 'copy-sql':(navigator.clipboard?navigator.clipboard.writeText(SYNC_SQL):Promise.reject()).then(()=>toast('SQL copied')).catch(()=>toast('Select the text and copy it'));break;
    case 'sync-save':{sync.url=$('#syUrl').value.trim().replace(/\/+$/,'');sync.key=$('#syKey').value.trim();sync.code=$('#syCode').value.trim();sync.enabled=$('#syOn').checked;sync.ok=null;sync.status=sync.enabled?'Connecting…':'Not shared — this browser only';saveSync();render();if(syncReady()){pullState(true).then(startSyncLoop);}else{clearInterval(pullTimer);}break;}
    case 'sync-now':pullState(true);break;
    case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pantry-backup-${iso(today())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break;}
    case 'import':$('#importFile').click();break;
    case 'reset':if(confirm('Delete the plan, on-hand counts and custom staples?')){state=fresh();save();render();}break;
  }});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.act==='batches'){showRecipe(el.dataset.id,el.value);return;}
  if(el.dataset.act==='freq'){const v=Math.max(0,Number(el.value)||0);if(v)state.recipes[el.dataset.id]=v;else delete state.recipes[el.dataset.id];save();$('aside.panel').innerHTML=renderSide(alerts());return;}
  if(el.dataset.act==='wr'){const id=el.dataset.id;if(el.type==='checkbox'){if(el.checked)state.recipes[id]=state.recipes[id]>0?state.recipes[id]:1;else delete state.recipes[id];}else{const v=Math.max(0,Number(el.value)||0);if(v)state.recipes[id]=v;else delete state.recipes[id];}save();const row=el.closest('.wr');if(row){const f=row.querySelector('input[type=number]');if(f)f.value=num(freq(id));row.querySelector('input[type=checkbox]').checked=freq(id)>0;}const c=$('#wrCount');if(c)c.textContent=wrCountText();return;}
  if(el.name==='hasYield'){$('#yieldBox').style.display=el.checked?'':'none';return;}
  if(el.name==='ing'&&el.value==='__new'){ui.recipeDraft=recipeDraft();showCustomForm(null);toast('Save the new ingredient and you will be returned to the recipe');return;}
  if(el.dataset.act==='on'){it(el.dataset.id).on=Math.max(0,Number(el.value)||0);save();render();return;}
  if(el.dataset.act==='bought'){const s=staple(el.dataset.id);if(el.checked){it(s.id).on=(it(s.id).on||0)+Number(el.dataset.n)*s.pkg;delete state.wanted[s.id];save();toast(`${s.n} restocked`);setTimeout(render,250);}return;}
  if(el.dataset.act==='cat'){ui.cat=el.value;render();return;} if(el.dataset.act==='only'){ui.only=el.value;render();return;}
  if(el.dataset.set){const k=el.dataset.set;let v=el.type==='checkbox'?el.checked:el.type==='number'||el.type==='range'?Number(el.value):el.value;
    if(k==='name')v=v.trim()||'Home pantry'; if(k==='adults')v=Math.max(1,v); if(k==='weeks')v=Math.max(1,Math.min(26,v));
    setDeep(k,v);save();if(el.type==='range'){$('#wkLabel').textContent=v;$('aside.panel').innerHTML=renderSide(alerts());}else render();return;}
  if(el.id==='importFile'&&el.files[0]){const rd=new FileReader();rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||!s.items)throw 0;state=Object.assign(fresh(),s);state.customRecipes=state.customRecipes||[];save();toast('Backup imported');render();}catch(x){toast('That file is not a pantry backup.');}};rd.readAsText(el.files[0]);}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.act==='wq'){ui.wq=el.value;const pos=el.selectionStart;renderWizard();const n=$('[data-act="wq"]');if(n){n.focus();n.setSelectionRange(pos,pos);}return;}if(el.dataset.act!=='q')return;ui.q=el.value;const pos=el.selectionStart;$('#content').innerHTML=renderTab();const n=$('#content [data-act="q"]');if(n){n.focus();n.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.act==='on')e.target.blur();});
dlg().addEventListener('click',e=>{if(e.target===dlg())closeDialog();});

state=load();render();startSyncLoop();
