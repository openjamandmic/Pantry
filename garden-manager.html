<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plot &amp; Season — Garden Manager for Zone 10</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garden">
<meta name="theme-color" content="#3D6C38">
<link rel="apple-touch-icon" href="garden-icon.png">
<link rel="icon" href="garden-icon.png">
<link rel="manifest" href="garden-manager.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EADC; --panel:#FBFBF5; --panel-2:#F1F3E8; --ink:#1B2418; --muted:#5F6A58; --line:#C8CEB6;
  --moss:#3D6C38; --moss-ink:#F4F7EE; --moss-soft:#D9E7CF;
  --soil:#8C5B33; --soil-dark:#5B3A1D; --soil-light:#B98A5C;
  --sun:#E5B23A; --sun-soft:#FBEFCB; --alert:#C2432B; --alert-soft:#F7D9D2; --water:#3B7CA3; --water-soft:#D5E6F0;
  --lawn:#B4CB98; --lawn-line:#9DB884; --house:#D8D3C4; --house-ink:#6B6455; --shadow:0 1px 2px rgba(27,36,24,.08),0 8px 24px rgba(27,36,24,.08);
  --r:10px; --cell:96px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A12; --panel:#1E261C; --panel-2:#26301F; --ink:#E8EBDD; --muted:#A3AC97; --line:#3A4634;
  --moss:#7FB574; --moss-ink:#111811; --moss-soft:#2C4028;
  --soil:#7A4E2A; --soil-dark:#4A2E15; --soil-light:#A1704A;
  --sun:#E8B848; --sun-soft:#4A3C15; --alert:#E0644C; --alert-soft:#4B231B; --water:#6AA7CF; --water-soft:#1D3242;
  --lawn:#2F4128; --lawn-line:#3E5535; --house:#4A4A44; --house-ink:#C9C4B4; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#141A12; --panel:#1E261C; --panel-2:#26301F; --ink:#E8EBDD; --muted:#A3AC97; --line:#3A4634;
  --moss:#7FB574; --moss-ink:#111811; --moss-soft:#2C4028;
  --soil:#7A4E2A; --soil-dark:#4A2E15; --soil-light:#A1704A;
  --sun:#E8B848; --sun-soft:#4A3C15; --alert:#E0644C; --alert-soft:#4B231B; --water:#6AA7CF; --water-soft:#1D3242;
  --lawn:#2F4128; --lawn-line:#3E5535; --house:#4A4A44; --house-ink:#C9C4B4; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.5 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:"Fraunces",Georgia,"Times New Roman",serif; font-weight:600; letter-spacing:-.01em; margin:0}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 .6em}
button{font:inherit; color:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:.45em .85em; line-height:1.2}
button:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
button.primary{background:var(--moss); color:var(--moss-ink); border-color:var(--moss); font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--alert); border-color:var(--alert)}
button.ghost{background:transparent; border-color:transparent}
button.ghost:hover{background:var(--panel-2); border-color:transparent}
button.small{padding:.3em .6em; font-size:.85rem}
button:disabled{opacity:.45; cursor:not-allowed}
input,select,textarea{font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.45em .6em; width:100%}
textarea{min-height:70px; resize:vertical}
label{display:block; font-weight:600; font-size:.9rem; margin:.7em 0 .25em}
label .hint{font-weight:400; color:var(--muted)}
.row{display:flex; gap:.6em; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.6em}
.muted{color:var(--muted)}
.tiny{font-size:.8rem}
.stack>*+*{margin-top:.75em}
hr{border:0; border-top:1px solid var(--line); margin:1em 0}

/* App shell */
#app{height:100%; display:flex; flex-direction:column}
header.bar{display:flex; align-items:center; gap:1em; padding:.7em 1.1em; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap}
header.bar .title{display:flex; align-items:baseline; gap:.6em}
header.bar .title small{color:var(--muted)}
.season-pill{display:inline-flex; align-items:center; gap:.4em; padding:.25em .7em; border-radius:999px; background:var(--moss-soft); color:var(--ink); font-size:.85rem; font-weight:600}
.season-pill.hot{background:var(--sun-soft)}
header.bar .spacer{flex:1}
main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 430px; min-height:0}
@media (max-width:900px){ main{grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr)} }
.mapwrap{position:relative; overflow:auto; padding:1.2em; display:block}
.mapwrap svg{display:block; user-select:none; margin:0 auto}
.zoom{position:sticky; top:0; left:0; z-index:5; display:inline-flex; gap:.3em; margin-bottom:.5em; background:var(--panel); padding:.3em; border-radius:8px; box-shadow:var(--shadow)}
aside.panel{background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
@media (max-width:900px){ aside.panel{border-left:0; border-top:1px solid var(--line); max-height:60vh} }
.tabs{display:flex; border-bottom:1px solid var(--line); overflow-x:auto}
.tabs button{border:0; border-radius:0; background:transparent; padding:.7em .75em; font-size:.95rem; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; white-space:nowrap}
.tabs button.active{color:var(--ink); border-bottom-color:var(--moss)}
.tabs button .n{display:inline-block; min-width:1.4em; padding:0 .35em; margin-left:.35em; border-radius:999px; background:var(--alert); color:#fff; font-size:.75rem; text-align:center}
.panel-body{overflow:auto; padding:1em; flex:1}

/* Cards / lists */
.card{background:var(--panel-2); border-radius:var(--r); padding:.85em 1em}
.card.soil{background:var(--soil); color:#fff}
.card.soil .muted{color:rgba(255,255,255,.75)}
.alert-list{list-style:none; margin:0; padding:0}
.alert-list li{display:flex; gap:.6em; align-items:flex-start; padding:.55em .7em; border-radius:8px; cursor:pointer; border:1px solid transparent}
.alert-list li:hover{background:var(--panel-2); border-color:var(--line)}
.dot{width:.65em; height:.65em; border-radius:50%; flex:none; margin-top:.45em}
.dot.plant{background:var(--moss)} .dot.harvest{background:var(--sun)} .dot.overdue{background:var(--alert)} .dot.warn{background:var(--water)} .dot.task{background:var(--soil-light)}
.chip{display:inline-block; padding:.1em .55em; border-radius:999px; font-size:.78rem; font-weight:600; background:var(--panel-2); border:1px solid var(--line)}
.chip.good{background:var(--moss-soft); border-color:transparent}
.chip.ok{background:var(--sun-soft); border-color:transparent}
.chip.bad{background:var(--alert-soft); border-color:transparent}
.chip.info{background:var(--water-soft); border-color:transparent}
.plant-item{display:flex; gap:.7em; padding:.7em .5em; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start}
.plant-item:hover{background:var(--panel-2)}
.plant-item .em{font-size:1.6rem; line-height:1; width:1.6em; text-align:center; flex:none}
.plant-item .nm{font-weight:700}
.plant-item .meta{color:var(--muted); font-size:.85rem}
.progress{height:8px; background:var(--line); border-radius:99px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--moss)}
.progress i.harvest{background:var(--sun)} .progress i.overdue{background:var(--alert)}
.exposure-key{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.4em}
.exposure-key button{display:flex; align-items:center; gap:.5em; text-align:left; padding:.45em .6em}
.exposure-key button.active{border-color:var(--moss); background:var(--moss-soft)}
.exposure-key svg{flex:none}
.month-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:.3em}
.month-grid label{display:flex; align-items:center; gap:.3em; margin:0; font-weight:600; font-size:.85rem; padding:.3em .4em; border:1px solid var(--line); border-radius:6px; cursor:pointer}
.month-grid input{width:auto}
.month-grid label.on{background:var(--moss-soft); border-color:var(--moss)}
.cal{display:grid; grid-template-columns:repeat(12,1fr); gap:2px; font-size:.7rem}
.cal .h{text-align:center; font-weight:700; color:var(--muted); padding:.2em 0}
.cal .c{height:14px; border-radius:3px; background:var(--panel-2)}
.cal .c.p{background:var(--moss)} .cal .c.s{background:var(--moss-soft)} .cal .c.now{outline:2px solid var(--sun); outline-offset:-2px}
.calrow{display:grid; grid-template-columns:150px 1fr; gap:.6em; align-items:center; padding:.3em 0; border-bottom:1px solid var(--line); cursor:pointer}
.calrow:hover{background:var(--panel-2)}
.calrow .nm{font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.toast{position:fixed; left:50%; bottom:calc(1.2em + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:.6em 1em; border-radius:999px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; font-weight:600}
.toast.show{opacity:1}

/* Wizard */
.wizard{max-width:920px; margin:0 auto; padding:2em 1.2em 4em}
.wizard .hero{display:grid; grid-template-columns:1.1fr 1fr; gap:2em; align-items:center; margin-bottom:2em}
@media (max-width:760px){ .wizard .hero{grid-template-columns:1fr} }
.wizard .hero h1{font-size:clamp(2rem,5vw,3.2rem); line-height:1.05; font-weight:700}
.wizard .hero p{font-size:1.05rem; color:var(--muted)}
.steps{display:flex; gap:.4em; margin-bottom:1.2em; flex-wrap:wrap}
.steps span{padding:.25em .7em; border-radius:999px; font-size:.85rem; font-weight:600; background:var(--panel-2); color:var(--muted)}
.steps span.on{background:var(--moss); color:var(--moss-ink)}
.steps span.done{background:var(--moss-soft); color:var(--ink)}
.zone-pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:.7em}
.zone-pick button{text-align:left; padding:.9em 1em; border-radius:var(--r)}
.zone-pick button.active{border-color:var(--moss); background:var(--moss-soft)}
.zone-pick button b{display:block; font-family:"Fraunces",Georgia,serif; font-size:1.3rem}
.zone-pick button.soon{opacity:.5; cursor:not-allowed}
.painter{display:grid; grid-template-columns:1fr 260px; gap:1.2em}
@media (max-width:760px){ .painter{grid-template-columns:1fr} }
.paintgrid{display:grid; gap:4px; background:var(--lawn); padding:8px; border-radius:var(--r); width:max-content; max-width:100%; overflow:auto}
.paintgrid button{padding:0; border:1px solid var(--lawn-line); background:transparent; border-radius:6px; display:flex; align-items:center; justify-content:center}
.paintgrid button.plot{background:var(--soil); border-color:var(--soil-dark)}
.paintgrid button.house{background:var(--house); border-color:var(--house)}
.paintgrid{touch-action:none}
.paintgrid button:hover{outline:2px solid var(--sun); outline-offset:-2px}
.compass{display:flex; align-items:center; gap:.8em}
.compass .rose{flex:none; width:64px; height:64px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; position:relative; background:var(--panel)}
.compass .rose i{position:absolute; left:50%; top:50%; width:4px; height:26px; margin:-26px 0 0 -2px; background:var(--alert); transform-origin:50% 100%; border-radius:2px}
.compass .rose i::after{content:""; position:absolute; left:-5px; top:-8px; border:7px solid transparent; border-bottom:10px solid var(--alert); border-top:0}
.compass .rose b{position:absolute; font-size:.65rem; color:var(--muted)}
.help{font-size:.9rem; color:var(--muted)}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:1.2em}
@media (max-width:760px){ .two-col{grid-template-columns:1fr} }
dialog{border:0; border-radius:14px; padding:0; background:var(--panel); color:var(--ink); box-shadow:var(--shadow); width:min(560px,92vw); max-height:88vh}
dialog::backdrop{background:rgba(20,26,18,.45)}
dialog .dbody{padding:1.2em; overflow:auto; max-height:88vh}
.kv{display:grid; grid-template-columns:auto 1fr; gap:.2em .8em; font-size:.9rem}
.kv b{color:var(--muted); font-weight:600}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div class="dbody" id="dlgBody"></div></dialog>
<script>
/* ============================================================
   PLANT DATABASE — Zone 10a / 10b (South Florida)
   Planting windows follow the UF/IFAS Florida Vegetable Gardening
   Guide (SP 103, "South" column) and the UF/IFAS South Florida
   Gardening Calendar for herbs and tropical staples.
   Fields:
     m    = prime planting months (e.g. "8-2" = Aug through Feb)
     sh   = shoulder months: possible but off-peak
     d    = [min,max] days from planting (by the stated method) to first harvest
     per  = plants per 3ft x 3ft plot at intensive spacing
     sun  = full (6h+) | partial (4-6h) | shade (2-4h ok)
     temp = comfortable air-temp range in °F
     heat = tolerance of South Florida summer: low | med | high
     harv = once (one harvest, then clear) | cont (keeps producing)
     prod = approx. days of continued production after first harvest
   ============================================================ */
const P = (id,n,e,cat,fam,sun,m,sh,d,per,how,temp,heat,harv,prod,v,note,x)=>Object.assign({id,n,e,cat,fam,sun,m,sh,d,per,how,temp,heat,harv,prod,v,note},x||{});

const PLANTS = [
/* ---------- Fruiting vegetables ---------- */
P('tomato','Tomato, slicing','🍅','Fruiting vegetables','Solanaceae (nightshade)','full','8-2','3',[70,90],2,'Transplant (start seeds 6 wks before)',[55,85],'low','cont',60,
 'Celebrity, Heat Wave II, Better Boy, Tasti-Lee, BHN 444 Southern Star, Amelia, Bella Rosa, Quincy; heirlooms: Cherokee Purple, Brandywine, Mortgage Lifter',
 'Stake or cage; mulch heavily. Plant Sep–Oct for a winter crop and again Jan–Feb for spring. Blossom drop above 90°F. Watch for whitefly, leafminer and blossom-end rot. Rotate away from other nightshades.',{trellis:true}),
P('cherry-tomato','Tomato, cherry & grape','🍅','Fruiting vegetables','Solanaceae (nightshade)','full','8-3','4,5',[60,75],2,'Transplant or seed',[55,90],'med','cont',75,
 'Sweet 100, Sun Gold, Juliet, Red Grape, Sugar Snack, Sweet Baby Girl',
 'Much more heat tolerant than slicers and keeps setting fruit into early summer. Best beginner tomato for zone 10.',{trellis:true}),
P('everglades-tomato','Everglades tomato','🍅','Fruiting vegetables','Solanaceae (nightshade)','full','1-12','',[60,70],1,'Seed or transplant',[60,95],'high','cont',180,
 'Everglades (Solanum pimpinellifolium), Matt\'s Wild Cherry',
 'Tiny currant-size tomato that shrugs off summer heat, humidity and most disease. Sprawls hard, so give it the whole plot or a tall cage. Self-seeds.',{trellis:true}),
P('pepper-sweet','Pepper, sweet','🫑','Fruiting vegetables','Solanaceae (nightshade)','full','8-2','3',[65,75],4,'Transplant (start seeds 6-8 wks before)',[60,85],'med','cont',90,
 'California Wonder, Red Knight, Big Bertha, Sweet Banana, Giant Marconi, Cubanelle',
 'Transplants beat direct seeding. Mulch well; often produces straight through summer if kept watered. Afternoon shade helps fruit set in May–Sep.'),
P('pepper-hot','Pepper, hot','🌶️','Fruiting vegetables','Solanaceae (nightshade)','full','8-2','3,4',[65,80],4,'Transplant',[60,95],'high','cont',120,
 'Early Jalapeño, Jalapeño M, Cherry Bomb, Hungarian Hot Wax, Anaheim, Ancho/Poblano, Thai, Long Cayenne, Habanero, Caribbean Red Habanero, Scotch Bonnet, Datil',
 'Hot peppers are perennial in zone 10 and often live 2–3 years. Habanero and Scotch Bonnet types love the summer heat.'),
P('eggplant','Eggplant','🍆','Fruiting vegetables','Solanaceae (nightshade)','full','8-2','3',[70,90],2,'Transplant',[65,90],'high','cont',90,
 'Black Beauty, Dusky, Ichiban, Long (Asian types), Cloud Nine (white)',
 'Needs warm soil. Harvest continues into summer; bitter fruit comes from heat or drought stress. May need staking.'),
P('okra','Okra','🌿','Fruiting vegetables','Malvaceae (hibiscus)','full','1-3,8-10','4-7',[55,65],9,'Direct seed (soak 6 hrs first)',[70,100],'high','cont',75,
 'Clemson Spineless, Emerald, Annie Oakley II, Cajun Delight, Burgundy',
 'Loves heat; one of the few classic vegetables that thrives in a zone 10 summer. Pick pods every 2 days at 3–4". Very susceptible to root-knot nematodes — rotate.'),
P('cucumber','Cucumber','🥒','Fruiting vegetables','Cucurbitaceae (squash)','full','9-2','3',[40,65],4,'Direct seed',[65,90],'med','cont',40,
 'Slicers: Sweet Success, Poinsett 76, Ashley, Marketmore 76, Straight Eight, Spacemaster. Picklers: Eureka, Boston Pickling, Suyo Long',
 'Trellis to save space and reduce disease. Needs bees; hand-pollinate if fruit aborts. Downy mildew and pickleworm hit hard after March.',{trellis:true}),
P('squash-summer','Squash, summer & zucchini','🥒','Fruiting vegetables','Cucurbitaceae (squash)','full','8-3','',[40,50],2,'Direct seed',[65,90],'med','cont',35,
 'Early Prolific Straightneck, Summer Crookneck, Early White Scallop, Cocozelle, Spineless Beauty, Black Beauty (zucchini)',
 'Fast and productive in the cool season. Bush habit fits a plot. Squash vine borer and powdery mildew end the crop — plan on 8–10 weeks and replant.'),
P('squash-winter','Squash, winter (butternut, acorn, spaghetti)','🎃','Fruiting vegetables','Cucurbitaceae (squash)','full','8-3','',[85,120],1,'Direct seed',[65,90],'med','once',0,
 'Waltham Butternut, Early Butternut, Table Queen / Table King / Table Ace (acorn), Spaghetti',
 'Vines run 8–10 ft — let them spill out of the plot or trellis them. Butternut resists vine borer best. Cure 10 days in sun before storing.',{trellis:true}),
P('seminole-pumpkin','Pumpkin, tropical (Seminole / Calabaza)','🎃','Fruiting vegetables','Cucurbitaceae (squash)','full','6-8','3-5',[90,120],1,'Direct seed',[70,100],'high','cont',60,
 'Seminole, Calabaza (Cuban squash), Moranga, La Estrella',
 'Native Seminole pumpkin is the most disease-proof squash you can grow in South Florida and laughs at summer. Needs room — vines climb fences and trees. Stores for months.',{trellis:true}),
P('chayote','Chayote (mirliton)','🥒','Fruiting vegetables','Cucurbitaceae (squash)','full','5-7','3,4',[120,180],1,'Plant whole sprouted fruit',[65,95],'high','cont',120,
 'Green smooth, white, spiny (all are the same species)',
 'Perennial vine that fruits in the short days of Oct–Dec. Needs a strong trellis or fence. Young shoots and roots are edible too.',{trellis:true,perennial:true}),
P('watermelon','Watermelon','🍉','Fruit','Cucurbitaceae (squash)','full','12-3','',[80,100],1,'Direct seed',[70,95],'med','once',0,
 'Small (best for plots): Sugar Baby, Mickeylee. Large: Jubilee (Florida Giant), Crimson Sweet, Charleston Grey 133',
 'Vines need to run well beyond the plot. Harvest when the underside turns yellow and the tendril nearest the fruit dries. Needs bees.'),
P('cantaloupe','Cantaloupe & honeydew','🍈','Fruit','Cucurbitaceae (squash)','full','12-3','',[70,90],1,'Direct seed',[70,95],'med','once',0,
 'Athena, Ambrosia, Galia (green flesh)',
 'Mulch so fruit does not sit on wet soil. Heavy rain near ripening dilutes sugar. Fruit slips off the vine when ripe.'),
P('corn','Sweet corn','🌽','Fruiting vegetables','Poaceae (grass)','full','10-3','',[65,90],9,'Direct seed (3x3 block)',[60,90],'med','once',0,
 'Silver Queen, How Sweet It Is, Sweet Ice (white); Sweet Riser, Early Sunglow (yellow)',
 'A 3x3 block of 9–12 plants pollinates itself well. Put it on the north side so it does not shade neighbors. Heavy feeder. Scout for corn earworm.'),
P('tomatillo','Tomatillo','🟢','Fruiting vegetables','Solanaceae (nightshade)','full','8-2','3',[70,90],2,'Transplant',[60,90],'med','cont',60,
 'Toma Verde, Rio Grande Verde, Purple',
 'Plant at least two for cross-pollination. Sprawling, so cage it. Fruit is ready when it fills and splits the husk.',{trellis:true}),
P('bitter-melon','Bitter melon','🥒','Fruiting vegetables','Cucurbitaceae (squash)','full','3-7','8',[60,80],2,'Direct seed (nick and soak)',[70,100],'high','cont',60,
 'Indian (green, spiny), Chinese (pale, smooth)',
 'Thrives in the summer heat when cucumbers give up. Trellis; harvest young and green.',{trellis:true}),
P('luffa','Luffa (edible young, sponge when mature)','🥒','Fruiting vegetables','Cucurbitaceae (squash)','full','3-6','7',[90,120],1,'Direct seed',[70,100],'high','cont',60,
 'Angled luffa (ridged), Smooth luffa',
 'Eat fruit under 6" like zucchini; leave a few to mature and dry for sponges. Vigorous climber for a fence or arbor.',{trellis:true}),

<script>
/* ============================================================ helpers */
const $ = s=>document.querySelector(s);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=86400000;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fmt=d=>{if(typeof d==='string')d=parseISO(d);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});};
const addDays=(d,n)=>{const x=new Date(typeof d==='string'?parseISO(d):d);x.setDate(x.getDate()+n);return x;};
function parseMonths(str){ // "8-2,4,10-11" -> Set of month numbers 1-12
  const out=new Set(); if(!str) return out;
  String(str).split(',').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    if(part.includes('-')){let [a,b]=part.split('-').map(Number); if(!a||!b)return; let m=a; for(let i=0;i<12;i++){out.add(m); if(m===b)break; m=m%12+1;}}
    else{const n=Number(part); if(n>=1&&n<=12) out.add(n);}
  }); return out;
}
function monthsToStr(set){ // Set -> "8-2,4"
  const arr=[...set].sort((a,b)=>a-b); if(!arr.length) return ''; if(arr.length===12) return '1-12';
  // find runs on a circle
  const has=m=>set.has(m);
  let start=arr.find(m=>!has(m===1?12:m-1)) ?? arr[0]; const runs=[]; let m=start, run=[];
  for(let i=0;i<12;i++){ if(has(m)){run.push(m);} if(!has(m===12?1:m+1)&&run.length){runs.push(run);run=[];} m=m%12+1; }
  return runs.map(r=>r.length===1?String(r[0]):`${r[0]}-${r[r.length-1]}`).join(',');
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

function seasonInfo(m){
  if(m===1||m===2) return {t:'Peak growing season',d:'Cool, dry and bright: nearly everything cool-season is in the ground. Last calls for tomatoes and peppers come at the end of Feb.',hot:false};
  if(m===3) return {t:'Spring — last cool-season window',d:'Squeeze in one more sowing of beans, cucumbers and corn. Start switching to heat lovers.',hot:false};
  if(m===4||m===5) return {t:'Late spring — switch to heat lovers',d:'Greens are bolting. Plant sweet potatoes, southern peas, okra, yard-long beans, tropical spinaches and roots.',hot:true};
  if(m>=6&&m<=8) return {t:'Rainy season — tropical crops only',d:'Heat, humidity and pests peak. Grow tropicals and summer greens, rest or solarize beds, and start transplants in August for fall.',hot:true};
  if(m===9) return {t:'Fall kickoff',d:'Prep beds and set out tomato, pepper and eggplant transplants. Wait until October for most cool-season greens.',hot:true};
  return {t:'Prime planting season',d:'October to December is the best planting stretch of the year in zone 10 — plant everything cool-season now.',hot:false};
}

function fresh(){return {version:2,setup:false,name:'My garden',zone:'10a',propW:80,propD:120,rows:40,cols:27,north:0,plots:{},house:{},settings:{dateOverride:null,theme:'auto',zoom:null}};}
function dimsFromProperty(w,d){ return {cols:Math.max(1,Math.min(100,Math.ceil(w/3))),rows:Math.max(1,Math.min(100,Math.ceil(d/3)))}; }
function load(){ try{const raw=localStorage.getItem(KEY); if(raw){const s=Object.assign(fresh(),JSON.parse(raw)); s.house=s.house||{}; s.settings=Object.assign({dateOverride:null,theme:'auto',zoom:null},s.settings||{}); if(!s.propW){ s.propW=s.cols*3; s.propD=s.rows*3; } return s;} }catch(e){} return fresh(); }
function loadLibrary(){ try{const raw=localStorage.getItem(LIBKEY); if(raw){const l=JSON.parse(raw); if(l&&Array.isArray(l.customPlants)) return l;} }catch(e){} return {customPlants:[]}; }
function saveLibrary(){ try{localStorage.setItem(LIBKEY,JSON.stringify(library));}catch(e){storageOK=false;} }
function migrateLibrary(){ // custom plants used to live inside the garden; move them to the shared library once
  if(Array.isArray(state.customPlants)&&state.customPlants.length){ state.customPlants.forEach(c=>{ if(!library.customPlants.some(x=>x.id===c.id)) library.customPlants.push(c); }); saveLibrary(); }
  delete state.customPlants; save();
}
let storageOK=true;
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;} }
function today(){ if(state?.settings?.dateOverride){ return parseISO(state.settings.dateOverride);} const d=new Date(); d.setHours(0,0,0,0); return d; }
const curMonth=()=>today().getMonth()+1;
const plotKey=(r,c)=>`${r}-${c}`;
const rowLetter=r=>(r>=26?String.fromCharCode(64+Math.floor(r/26)):'')+String.fromCharCode(65+r%26);
const plotLabel=(r,c)=>rowLetter(r)+(c+1);

/* ============================================================ plants */
function normalizeCustom(c){ return Object.assign({},c,{custom:true}); }
function allPlants(){ return PLANTS.concat(library.customPlants.map(normalizeCustom)); }
function plantById(id){ return allPlants().find(p=>p.id===id); }
function windows(p){ return {prime:parseMonths(p.m),shoulder:parseMonths(p.sh)}; }
function seasonScore(p,month){
  const w=windows(p); const next=month%12+1;
  if(w.prime.has(month)) return {s:2,label:w.prime.size<12&&!w.prime.has(next)?'Last call':'In season',cls:w.prime.has(next)||w.prime.size===12?'good':'ok',last:!w.prime.has(next)&&w.prime.size<12};
  if(w.shoulder.has(month)) return {s:1,label:'Off-peak',cls:'ok'};
  return {s:0,label:'Out of season',cls:'bad'};
}
function sunScore(p,exposure,month){
  const hrs=EXPOSURES[exposure]?.hours??8; const need=SUN_NEED[p.sun]??6; const warm=month>=4&&month<=10;
  let s = hrs>=need?2 : hrs>=need-2?1 : 0;
  let note='';
  if(warm && p.heat==='low' && exposure==='pm_shade' && s>=1){ note='Morning-sun plot shields it from afternoon heat'; }
  if(warm && p.heat==='low' && exposure==='am_shade' && s===2){ s=1; note='Afternoon sun is hard on this crop in warm months'; }
  if(exposure==='shade' && p.sun!=='shade') s=0;
  return {s,label:s===2?'Sun: great':s===1?'Sun: fair':'Sun: poor',cls:s===2?'good':s===1?'ok':'bad',note};
}
function suggestions(plot,month,opts={}){
  const ex=plot.exposure; const last=plot.history?.[plot.history.length-1]; const lastFam=last?plantById(last.pid)?.fam:null;
  let list=allPlants().map(p=>{const se=seasonScore(p,month), su=sunScore(p,ex,month);
    return {p,se,su,score:se.s*10+su.s*4-(p.d[0]/400),rot:lastFam&&p.fam===lastFam};});
  list=list.filter(x=>x.se.s>0 && x.su.s>0 && (opts.shoulder||x.se.s===2));
  return list;
}

/* ============================================================ plot status & alerts */
function plotStatus(plot){
  const out={phase:'empty',alerts:[],pct:0};
  const t=today(), m=curMonth();
  if(!plot.plant){
    const n=suggestions(plot,m).length;
    if(n>0) out.alerts.push({type:'plant',text:`Empty — ${n} crop${n>1?'s':''} can go in now`});
    else out.alerts.push({type:'task',text:'Empty — nothing ideal this month. Rest it, mulch, or sow southern peas as a cover crop.'});
    return out;
  }
  const p=plantById(plot.plant.pid); if(!p){ out.phase='unknown'; out.alerts.push({type:'overdue',text:'Plant record missing — clear this plot'}); return out; }
  out.p=p;
  const daysIn=Math.floor((t-parseISO(plot.plant.date))/DAY); out.daysIn=daysIn;
  const [h0,h1]=p.d; const endProd=h1+(p.harv==='cont'?(p.prod||30):0);
  out.h0=h0; out.h1=h1; out.end=endProd;
  if(p.perennial){
    if(daysIn<h0){out.phase='establishing'; out.pct=daysIn/h0; out.text=`Establishing — first harvest around ${fmt(addDays(plot.plant.date,h0))}`;}
    else {out.phase='perennial'; out.pct=1; out.text='Established perennial — harvest as needed';
      if(daysIn>=h0 && daysIn<h1) out.alerts.push({type:'harvest',text:`${p.n}: first harvests starting`});}
  } else if(daysIn<h0-7){ out.phase='growing'; out.pct=daysIn/h0; out.text=`Growing — harvest window opens ${fmt(addDays(plot.plant.date,h0))}`; }
  else if(daysIn<h0){ out.phase='soon'; out.pct=daysIn/h0; out.text=`Harvest window opens in ${h0-daysIn} day${h0-daysIn===1?'':'s'}`; out.alerts.push({type:'harvest',text:`${p.n}: harvest starts in ${h0-daysIn} days`}); }
  else if(daysIn<=endProd){ out.phase= p.harv==='cont'?'producing':'harvest'; out.pct=1;
    out.text = p.harv==='cont' ? `Producing — keep picking (expect yield to fade around ${fmt(addDays(plot.plant.date,endProd))})` : `Harvest window open until about ${fmt(addDays(plot.plant.date,h1))}`;
    out.alerts.push({type:'harvest',text:`${p.n}: ${p.harv==='cont'?'producing — keep harvesting':'ready to harvest'}`}); }
  else { out.phase='overdue'; out.pct=1; out.text=`Past its window by ${daysIn-endProd} days — harvest what is left, then clear and replant`; out.alerts.push({type:'overdue',text:`${p.n}: past its window — clear the plot`}); }
  // heat / cold watches
  const inWindow=windows(p).prime.has(m);
  if(p.heat==='low' && m>=4 && m<=10 && out.phase!=='overdue'){
    if(inWindow) out.alerts.push({type:'warn',text:`${p.n}: still warm for it — water early, mulch deep, shade cloth after noon`});
    else out.alerts.push({type:'warn',text:`${p.n} will struggle in this heat — expect bolting or decline; harvest what you can`});
  } else if(p.heat==='med' && m>=5 && m<=9 && !inWindow && (plot.exposure==='full'||plot.exposure==='am_shade')) out.alerts.push({type:'warn',text:`${p.n}: watch for afternoon heat stress; water early, mulch deep`});
  if(state.zone==='10a' && (m===12||m===1||m===2) && p.heat==='high') out.alerts.push({type:'warn',text:`${p.n} is cold-tender — cover it if a night below 40°F is forecast`});
  // reminders
  (plot.tasks||[]).forEach(tk=>{ if(tk.done) return; const due=tk.due?parseISO(tk.due):null; if(!due||due-t<=3*DAY) out.alerts.push({type:'task',text:tk.text+(due?` (${due<t?'overdue, ':''}due ${fmt(due)})`:''),taskId:tk.id}); });
  return out;
}
function allAlerts(){ const arr=[]; Object.entries(state.plots).forEach(([k,plot])=>{ plotStatus(plot).alerts.forEach(a=>arr.push(Object.assign({k,label:plot.name||plotLabel(...k.split('-').map(Number))},a))); }); return arr; }

/* ============================================================ rendering: shell */
function render(){
  document.documentElement.dataset.theme = state.settings.theme==='auto' ? '' : state.settings.theme;
  if(state.settings.theme==='auto') document.documentElement.removeAttribute('data-theme');
  if(!state.setup){ renderWizard(); return; }
  const m=curMonth(), s=seasonInfo(m); const alerts=allAlerts(); const urgent=alerts.filter(a=>a.type!=='warn').length;
  $('#app').innerHTML=`
  <header class="bar">
    <div class="title"><h1>${esc(state.name)}</h1><small>Zone ${state.zone} · ${fmt(today())}${state.settings.dateOverride?' (planning date)':''}</small></div>
    <span class="season-pill ${s.hot?'hot':''}" title="${esc(s.d)}">${s.hot?'☀️':'🌱'} ${esc(s.t)}</span>
    <div class="spacer"></div>
    <button class="small" data-act="tab" data-tab="tasks">Today's tasks ${urgent?`<span class="n">${urgent}</span>`:''}</button>
  </header>
  <main>
    <div class="mapwrap"><div class="zoom"><button class="small" data-act="zoom" data-z="-" aria-label="Zoom out">−</button><button class="small" data-act="zoom" data-z="fit">Fit</button><button class="small" data-act="zoom" data-z="+" aria-label="Zoom in">+</button></div>${renderMap()}</div>
    <aside class="panel">
      <div class="tabs">
        <button data-act="tab" data-tab="plot" class="${ui.tab==='plot'?'active':''}">Plot</button>
        <button data-act="tab" data-tab="tasks" class="${ui.tab==='tasks'?'active':''}">Tasks${urgent?`<span class="n">${urgent}</span>`:''}</button>
        <button data-act="tab" data-tab="calendar" class="${ui.tab==='calendar'?'active':''}">Calendar</button>
        <button data-act="tab" data-tab="plants" class="${ui.tab==='plants'?'active':''}">Library</button>
        <button data-act="tab" data-tab="settings" class="${ui.tab==='settings'?'active':''}">Settings</button>
      </div>
      <div class="panel-body" id="panelBody">${renderPanel()}</div>
    </aside>
  </main>`;
  if(!storageOK) toast('Browser storage is unavailable — use Settings → Export to keep your garden.');
}

/* ============================================================ rendering: map */
function exposureIcon(ex,x,y,r){ // small quadrant icon
  const sun='var(--sun)', sh='var(--soil-dark)';
  if(ex==='full') return `<circle cx="${x}" cy="${y}" r="${r}" fill="${sun}" stroke="#fff" stroke-width="1.5"/>`;
  if(ex==='shade') return `<circle cx="${x}" cy="${y}" r="${r}" fill="${sh}" stroke="#fff" stroke-width="1.5"/>`;
  if(ex==='mostly_shade') return `<circle cx="${x}" cy="${y}" r="${r}" fill="${sh}" stroke="#fff" stroke-width="1.5"/><path d="M${x} ${y-r} A${r} ${r} 0 0 1 ${x+r} ${y} L${x} ${y}Z" fill="${sun}"/>`;
  // half shading: left half = morning (first half of day)
  const leftDark = ex==='am_shade';
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${leftDark?sun:sh}" stroke="#fff" stroke-width="1.5"/><path d="M${x} ${y-r} A${r} ${r} 0 0 0 ${x} ${y+r}Z" fill="${leftDark?sh:sun}"/>`;
}
function renderMap(){
  const C=cellPx(), R=state.rows, Co=state.cols, PADT=72, PADL=16, PADR=16, PADB=58; const W=Math.max(Co*C+PADL+PADR,520), H=R*C+PADT+PADB; const big=C>=80, mid=C>=54; const sc=C/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Garden map" style="font-family:'Nunito Sans',system-ui,sans-serif">`;
  s+=`<rect x="${PADL-6}" y="${PADT-6}" width="${Co*C+12}" height="${R*C+12}" rx="14" fill="var(--lawn)"/>`;
  for(let r=0;r<R;r++) for(let c=0;c<Co;c++){
    const x=PADL+c*C, y=PADT+r*C, k=plotKey(r,c), plot=state.plots[k];
    if(state.house[k]){ s+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" fill="var(--house)" stroke="var(--house)" stroke-width="1"/>`; continue; }
    if(!plot){ s+=`<rect x="${x+1}" y="${y+1}" width="${C-2}" height="${C-2}" rx="${4*sc}" fill="none" stroke="var(--lawn-line)" stroke-dasharray="2 3"/>`; continue; }
    const st=plotStatus(plot); const sel=ui.sel===k; const p=st.p;
    const soil = plot.exposure==='shade'||plot.exposure==='mostly_shade' ? 'var(--soil-dark)' : 'var(--soil)';
    s+=`<g class="plot" data-k="${k}" style="cursor:pointer" tabindex="0" role="button" aria-label="Plot ${plotLabel(r,c)}">`;
    const g=Math.max(2,4*sc);
    s+=`<rect x="${x+g}" y="${y+g}" width="${C-2*g}" height="${C-2*g}" rx="${10*sc}" fill="${soil}" stroke="${sel?'var(--sun)':'var(--soil-dark)'}" stroke-width="${sel?Math.max(2.5,4*sc):1.2}"/>`;
    const barCls = st.phase==='overdue'?'var(--alert)': (st.phase==='harvest'||st.phase==='producing'||st.phase==='soon')?'var(--sun)':'var(--moss)';
    const badge=st.alerts.filter(a=>a.type!=='warn'); const warn=st.alerts.some(a=>a.type==='warn');
    const bt=badge.length?badge[0].type:null; const bcol=bt==='overdue'?'var(--alert)':bt==='harvest'?'var(--sun)':bt==='plant'?'var(--moss)':'var(--soil-light)';
    if(big){
      s+=`<g opacity=".25" fill="#000"><circle cx="${x+22*sc}" cy="${y+70*sc}" r="1.5"/><circle cx="${x+70*sc}" cy="${y+30*sc}" r="1.5"/><circle cx="${x+55*sc}" cy="${y+78*sc}" r="1.2"/></g>`;
      s+=`<text x="${x+12*sc}" y="${y+20*sc}" font-size="${11*sc}" fill="#fff" opacity=".85" font-weight="700">${esc(plot.name||plotLabel(r,c))}</text>`;
      s+=exposureIcon(plot.exposure,x+C-18*sc,y+18*sc,8*sc);
      if(p){
        s+=`<text x="${x+C/2}" y="${y+52*sc}" font-size="${30*sc}" text-anchor="middle" dominant-baseline="middle">${p.e}</text>`;
        const nm=p.n.length>16?p.n.slice(0,15)+'…':p.n;
        s+=`<text x="${x+C/2}" y="${y+76*sc}" font-size="${10.5*sc}" text-anchor="middle" fill="#fff" font-weight="600">${esc(nm)}</text>`;
        s+=`<rect x="${x+12*sc}" y="${y+84*sc}" width="${C-24*sc}" height="${5*sc}" rx="${3*sc}" fill="rgba(0,0,0,.35)"/><rect x="${x+12*sc}" y="${y+84*sc}" width="${Math.max(3,(C-24*sc)*Math.min(1,st.pct))}" height="${5*sc}" rx="${3*sc}" fill="${barCls}"/>`;
      } else s+=`<text x="${x+C/2}" y="${y+56*sc}" font-size="${12*sc}" text-anchor="middle" fill="#fff" opacity=".8">empty</text>`;
      if(bt) s+=`<circle cx="${x+C-18*sc}" cy="${y+C-18*sc}" r="${9*sc}" fill="${bcol}" stroke="#fff" stroke-width="1.5"/><text x="${x+C-18*sc}" y="${y+C-14.5*sc}" font-size="${10*sc}" text-anchor="middle" fill="#fff" font-weight="700">${badge.length}</text>`;
      if(warn) s+=`<circle cx="${x+18*sc}" cy="${y+C-18*sc}" r="${5*sc}" fill="var(--water)" stroke="#fff" stroke-width="1.2"/>`;
    } else if(mid){
      s+=exposureIcon(plot.exposure,x+C-11,y+11,5);
      if(p){ s+=`<text x="${x+C/2}" y="${y+C*.45}" font-size="${C*.42}" text-anchor="middle" dominant-baseline="middle">${p.e}</text>`;
        s+=`<rect x="${x+8}" y="${y+C-11}" width="${C-16}" height="4" rx="2" fill="rgba(0,0,0,.35)"/><rect x="${x+8}" y="${y+C-11}" width="${Math.max(2,(C-16)*Math.min(1,st.pct))}" height="4" rx="2" fill="${barCls}"/>`; }
      else s+=`<text x="${x+C*.14}" y="${y+C*.58}" font-size="${C*.2}" fill="#fff" opacity=".8" font-weight="700">${esc(plotLabel(r,c))}</text>`;
      if(bt) s+=`<circle cx="${x+C-11}" cy="${y+C-11}" r="6" fill="${bcol}" stroke="#fff" stroke-width="1"/>`;
      if(warn) s+=`<circle cx="${x+11}" cy="${y+C-11}" r="4" fill="var(--water)" stroke="#fff" stroke-width="1"/>`;
    } else {
      if(p) s+=`<text x="${x+C/2}" y="${y+C/2}" font-size="${C*.55}" text-anchor="middle" dominant-baseline="middle">${p.e}</text>`;
      if(bt) s+=`<circle cx="${x+C-6}" cy="${y+C-6}" r="4" fill="${bcol}" stroke="#fff" stroke-width=".8"/>`;
    }
    s+=`<title>${esc(plot.name||plotLabel(r,c))} · ${esc(EXPOSURES[plot.exposure].label)}${p?' · '+esc(p.n):' · empty'}${st.alerts.length?'\n'+esc(st.alerts.map(a=>a.text).join('\n')):''}</title>`;
    s+=`</g>`;
  }
  // house label at centroid
  const hk=Object.keys(state.house); if(hk.length){ let sr=0,sc2=0; hk.forEach(k=>{const [r,c]=k.split('-').map(Number); sr+=r; sc2+=c;}); const hx=PADL+(sc2/hk.length+.5)*C, hy=PADT+(sr/hk.length+.5)*C;
    s+=`<text x="${hx}" y="${hy}" font-size="${Math.max(11,Math.min(22,C*.3))}" text-anchor="middle" dominant-baseline="middle" fill="var(--house-ink)" font-weight="700" font-family="Fraunces,Georgia,serif" pointer-events="none">House</text>`; }
  // compass + sun path
  const cx=W-PADR-30, cy=34; const n=state.north; const e=n+90, w=n-90, so=n+180;
  const pt=(deg,r)=>[cx+r*Math.sin(deg*Math.PI/180), cy-r*Math.cos(deg*Math.PI/180)];
  const [nx,ny]=pt(n,20),[ex,ey]=pt(e,17),[wx,wy]=pt(w,17),[sx,sy]=pt(so,17);
  s+=`<g data-act="rotate" style="cursor:pointer"><title>Click to rotate north (${n}°)</title><circle cx="${cx}" cy="${cy}" r="26" fill="var(--panel)" stroke="var(--line)"/>`;
  s+=`<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--alert)" stroke-width="3" stroke-linecap="round"/>`;
  const [ax,ay]=pt(n,26),[bx,by]=pt(n+150,10),[dx,dy]=pt(n-150,10);
  s+=`<polygon points="${ax},${ay} ${bx},${by} ${cx},${cy} ${dx},${dy}" fill="var(--alert)"/>`;
  s+=`<text x="${ex}" y="${ey+4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-weight="700">E</text><text x="${wx}" y="${wy+4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-weight="700">W</text><text x="${sx}" y="${sy+4}" font-size="10" text-anchor="middle" fill="var(--muted)" font-weight="700">S</text></g>`;
  s+=`<text x="${PADL}" y="24" font-size="16" fill="var(--ink)" font-weight="700" font-family="Fraunces,Georgia,serif">${esc(state.name)}</text>`;
  s+=`<text x="${PADL}" y="44" font-size="12" fill="var(--muted)">${state.propW} × ${state.propD} ft property · ${Object.keys(state.plots).length} plots · ${Object.keys(state.plots).length*9} sq ft growing · click the compass to rotate north</text>`;
  s+=`<text x="${PADL}" y="${H-34}" font-size="12" fill="var(--muted)">Each square is a 3 ft × 3 ft plot. Sun rises on the E side, arcs across the S side, sets W.</text>`;
  s+=`<text x="${PADL}" y="${H-16}" font-size="12" fill="var(--muted)">${legendText()}</text>`;
  s+=`</svg>`; return s;
}
function cellPx(){ if(state.settings.zoom) return state.settings.zoom; const fit=Math.floor(880/state.cols); return Math.max(24,Math.min(100,fit)); }
function legendText(){ return 'Badges: green = ready to plant · yellow = harvest · red = clear it · blue dot = heat or cold watch'; }

/* ============================================================ rendering: panel */
function renderPanel(){
  switch(ui.tab){
    case 'tasks': return renderTasks();
    case 'calendar': return renderCalendar();
    case 'plants': return renderPlantsTab();
    case 'settings': return renderSettings();
    default: return renderPlot();
  }
}
function chip(x){return `<span class="chip ${x.cls}">${esc(x.label)}</span>`;}
function plantItemHTML(x,opts={}){
  const p=x.p; const meta=`${p.d[0]}–${p.d[1]} days · ${p.per} per plot · ${p.sun==='full'?'full sun':p.sun==='partial'?'part sun':'shade ok'} · ${p.heat==='high'?'heat-proof':p.heat==='med'?'takes some heat':'cool season'}`;
  return `<div class="plant-item" data-act="detail" data-pid="${p.id}"><div class="em">${p.e}</div><div style="flex:1;min-width:0"><div class="nm">${esc(p.n)}${p.perennial?' <span class="chip info">perennial</span>':''}${p.custom?' <span class="chip">custom</span>':''}</div><div class="meta">${esc(meta)}</div>
    <div class="row" style="gap:.3em;margin-top:.3em">${x.se?chip(x.se):''}${x.su?chip(x.su):''}${x.rot?'<span class="chip bad">Same family as last crop</span>':''}</div>${x.su?.note?`<div class="tiny muted">${esc(x.su.note)}</div>`:''}</div></div>`;
}
function renderPlot(){
  if(!ui.sel || !state.plots[ui.sel]) {
    const n=Object.keys(state.plots).length;
    return `<div class="stack"><h2>Your garden</h2><p class="muted">${n} plot${n===1?'':'s'} mapped. Click any square on the map to see its status, what to plant, and reminders.</p>
    <div class="card"><b>${esc(seasonInfo(curMonth()).t)}</b><p class="tiny muted" style="margin:.3em 0 0">${esc(seasonInfo(curMonth()).d)}</p></div>
    <p class="tiny muted">Sun-exposure key on each plot: yellow = sun, brown = shade. Left half is the first half of the day.</p></div>`;
  }
  const k=ui.sel, plot=state.plots[k], [r,c]=k.split('-').map(Number); const st=plotStatus(plot); const m=curMonth();
  const ex=EXPOSURES[plot.exposure];
  let h=`<div class="stack">
  <div class="row between"><h2 contenteditable="true" spellcheck="false" data-act="rename" style="outline-offset:4px" title="Click to rename">${esc(plot.name||plotLabel(r,c))}</h2>
    <select data-act="exposure" style="width:auto;font-size:.85rem">${Object.entries(EXPOSURES).map(([id,e])=>`<option value="${id}" ${plot.exposure===id?'selected':''}>${e.label}</option>`).join('')}</select></div>
  <p class="tiny muted">${esc(ex.tip)}</p>`;
  if(st.alerts.length) h+=`<ul class="alert-list">${st.alerts.map(a=>`<li style="cursor:default"><span class="dot ${a.type}"></span><span>${esc(a.text)}</span></li>`).join('')}</ul>`;
  if(plot.plant && st.p){
    const p=st.p, pl=plot.plant;
    h+=`<div class="card soil"><div class="row between"><div><div style="font-size:1.6rem">${p.e} <b style="font-family:Fraunces,serif;font-size:1.2rem">${esc(p.n)}</b></div>${pl.variety?`<div class="muted">${esc(pl.variety)}</div>`:''}</div><button class="small ghost" data-act="detail" data-pid="${p.id}" style="color:#fff">Details</button></div>

function renderPlantNow(plot,m){

  if(f.sort==='best') list.sort((a,b)=>b.score-a.score||a.p.d[0]-b.p.d[0]);

  const step=ui.wizStep; const steps=['Zone','Layout','Map plots'];
  let body='';
  if(step===0) body=`<h2>Where is the garden?</h2><p class="help">Only zone 10 is built out so far. The planting windows, varieties and heat warnings are tuned for South Florida's upside-down calendar: the main season runs October through March, and summer is for tropicals.</p>
    <div class="zone-pick">${ZONES.map(z=>`<button class="${state.zone===z.id?'active':''} ${z.on?'':'soon'}" data-act="wiz-zone" data-zone="${z.id}" ${z.on?'':'disabled'}><b>${z.name}</b><span class="tiny">${esc(z.desc)}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:1.5em"><button class="primary" data-act="wiz-next">Continue</button></div>`;
  if(step===1) body=`<h2>How big is the property?</h2><p class="help">Enter the lot size in feet. The map becomes a grid of 3 ft squares covering the whole property; on the next step you paint in the house footprint and the garden plots so alerts show where things actually are. Up to 300 × 300 ft. Width runs across the map, depth runs down it — you set which way is north next.</p>
    <div class="grid2" style="max-width:420px"><div><label>Width across (ft)</label><input type="number" id="wW" min="3" max="300" value="${state.propW}"></div><div><label>Depth down (ft)</label><input type="number" id="wD" min="3" max="300" value="${state.propD}"></div></div>
    <label style="max-width:420px">Garden name</label><input id="wName" value="${esc(state.name)}" style="max-width:420px">
    <div class="row" style="margin-top:1.5em"><button class="ghost" data-act="wiz-back">Back</button><button class="primary" data-act="wiz-next">Continue</button></div>`;
  if(step===2){
    const sz=paintCellPx(); const cells=[]; for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++) cells.push(paintCellHTML(r,c,sz));
    body=`<h2>Paint the house and the plots</h2><p class="help">Pick a brush, then click or drag across the squares — or click one corner and shift-click the opposite corner to fill a whole rectangle. Paint the house footprint first so you can see where the beds sit relative to it. Judge each plot's exposure on a spring day: direct sun before noon, after noon, all day, or barely at all? Click the compass to point north the way your yard actually faces.</p>
    <div class="painter"><div><div class="paintgrid" id="paintgrid" style="grid-template-columns:repeat(${state.cols},${sz}px)">${cells.join('')}</div>
      <p class="tiny muted" id="paintCount" style="margin-top:.6em">${paintCountText()}</p></div>
      <div class="stack"><div class="exposure-key" style="grid-template-columns:1fr">
        <button class="${ui.brush==='house'?'active':''}" data-act="brush" data-brush="house"><span style="width:22px;text-align:center">🏠</span><span>House footprint</span></button>
        ${Object.entries(EXPOSURES).map(([id,e])=>`<button class="${ui.brush===id?'active':''}" data-act="brush" data-brush="${id}"><svg width="22" height="22" viewBox="0 0 22 22">${exposureIcon(id,11,11,8)}</svg><span>${e.label}</span></button>`).join('')}
        <button class="${ui.brush==='erase'?'active':''}" data-act="brush" data-brush="erase"><span style="width:22px;text-align:center">✕</span><span>Erase (lawn / open ground)</span></button></div>
        <div class="compass"><div class="rose" data-act="rotate" title="Click to rotate"><i style="transform:rotate(${state.north}deg)"></i><b style="top:4px">N</b><b style="right:6px">E</b><b style="bottom:4px">S</b><b style="left:4px">W</b></div><div class="tiny muted">North points <b>${state.north}°</b> from the top of the map. Click to rotate. The sun crosses the south side of your garden, so anything tall on a plot's south edge will shade it in winter.</div></div>
      </div></div>
    <div class="row" style="margin-top:1.5em"><button class="ghost" data-act="wiz-back">Back</button><button class="primary" data-act="wiz-finish" ${Object.keys(state.plots).length?'':'disabled'}>Open my garden</button></div>`;
  }
  $('#app').innerHTML=`<div class="wizard">
    <div class="hero"><div><h1>Plot &amp; Season</h1><p>A top-down manager for a South Florida edible garden. Map your 3×3 plots, mark how much sun each one gets, and it tells you what to plant next, when to harvest, and what to clear.</p></div>
      <div class="card" style="background:var(--panel)"><b>${esc(seasonInfo(curMonth()).t)}</b><p class="tiny muted" style="margin:.3em 0 0">${esc(seasonInfo(curMonth()).d)}</p><p class="tiny muted" style="margin:.6em 0 0">${PLANTS.length} edibles in the library, researched for zone 10a/10b.</p></div></div>
    <div class="steps">${steps.map((s,i)=>`<span class="${i===step?'on':i<step?'done':''}">${i+1}. ${s}</span>`).join('')}</div>${body}</div>`;
  if(step===2) wirePaint();
}
function paintCellPx(){ return Math.max(14,Math.min(44,Math.floor(880/state.cols))); }
function paintCellHTML(r,c,sz){ const k=plotKey(r,c),p=state.plots[k],h=state.house[k]; const ico=sz>=24;
  return `<button class="${p?'plot':h?'house':''}" data-k="${k}" style="width:${sz}px;height:${sz}px" title="${plotLabel(r,c)}${h?' · house':p?' · '+EXPOSURES[p.exposure].label:''}">${p&&ico?`<svg width="${Math.min(22,sz-8)}" height="${Math.min(22,sz-8)}" viewBox="0 0 22 22">${exposureIcon(p.exposure,11,11,8)}</svg>`:''}</button>`; }
function paintCountText(){ const n=Object.keys(state.plots).length, hh=Object.keys(state.house).length; return `${state.propW} × ${state.propD} ft · 1 square = 3 ft · ${n} plot${n===1?'':'s'} (${n*9} sq ft of growing space) · house ${hh*9} sq ft`; }
function paintCell(k){
  if(ui.brush==='erase'){ delete state.plots[k]; delete state.house[k]; }
  else if(ui.brush==='house'){ delete state.plots[k]; state.house[k]=true; }
  else { delete state.house[k]; const p=state.plots[k]; if(p) p.exposure=ui.brush; else state.plots[k]={exposure:ui.brush,plant:null,tasks:[],history:[]}; }
}
function paintAndRefresh(k){ const before=JSON.stringify([state.plots[k]||null,!!state.house[k]]); paintCell(k); if(JSON.stringify([state.plots[k]||null,!!state.house[k]])===before) return;
  save(); const b=$(`#paintgrid button[data-k="${k}"]`); if(b){ const [r,c]=k.split('-').map(Number); b.outerHTML=paintCellHTML(r,c,paintCellPx()); } const pc=$('#paintCount'); if(pc) pc.textContent=paintCountText(); const fin=$('[data-act="wiz-finish"]'); if(fin) fin.disabled=!Object.keys(state.plots).length; }
function wirePaint(){
  const g=$('#paintgrid'); if(!g) return;
  g.addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-k]'); if(!b) return; e.preventDefault(); const k=b.dataset.k;
    if(e.shiftKey && ui.anchor){ const [r0,c0]=ui.anchor.split('-').map(Number),[r1,c1]=k.split('-').map(Number); for(let r=Math.min(r0,r1);r<=Math.max(r0,r1);r++) for(let c=Math.min(c0,c1);c<=Math.max(c0,c1);c++) paintAndRefresh(plotKey(r,c)); ui.anchor=k; return; }
    ui.anchor=k; ui.wizDrag=true; paintAndRefresh(k); });
  g.addEventListener('pointerover',e=>{ if(!ui.wizDrag) return; const b=e.target.closest('button[data-k]'); if(b) paintAndRefresh(b.dataset.k); });
}
document.addEventListener('pointerup',()=>ui.wizDrag=false);

/* ============================================================ actions */
function scrollToPlot(k){ const el=document.querySelector(`g.plot[data-k="${k}"]`); if(el&&el.scrollIntoView) el.scrollIntoView({block:'center',inline:'center'}); }
function selectPlot(k,scroll){ ui.sel=k; ui.tab='plot'; render(); if(scroll) scrollToPlot(k); }
function doPlant(pid){
  const plot=state.plots[ui.sel]; if(!plot) return; const p=plantById(pid);
  plot.plant={pid,variety:$('#plVariety')?.value.trim()||'',date:$('#plDate')?.value||iso(today()),notes:'',harvests:0};
  save(); closeDialog(); toast(`Planted ${p.n}`); render();
}
function clearPlot(mode){
  const plot=state.plots[ui.sel]; if(!plot||!plot.plant) return; const p=plantById(plot.plant.pid);
  plot.history=plot.history||[]; plot.history.push({pid:plot.plant.pid,name:p?.n||plot.plant.pid,planted:plot.plant.date,cleared:iso(today()),harvests:plot.plant.harvests||0,mode});
  plot.plant=null; save(); toast(mode==='harvested'?'Plot cleared — here is what can go in next':'Plot cleared'); render();
}
function download(obj,name){ const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportData(){ download({garden:state,library},`garden-backup-${iso(new Date())}.json`); }
function exportLibrary(){ download({plantLibrary:library.customPlants},`plant-library-${iso(new Date())}.json`); }
function mergeLibrary(list){ let added=0,updated=0; list.forEach(c=>{ if(!c||!c.n||!c.d) return; const i=library.customPlants.findIndex(x=>x.id===c.id||x.n.toLowerCase()===String(c.n).toLowerCase()); if(i>=0){ library.customPlants[i]=Object.assign({},c,{id:library.customPlants[i].id}); updated++; } else { library.customPlants.push(Object.assign({},c,{id:c.id||'custom-'+Date.now()+'-'+added})); added++; } }); saveLibrary(); return {added,updated}; }
function importData(file){ const rd=new FileReader(); rd.onload=()=>{ try{ const s=JSON.parse(rd.result);
    if(s&&Array.isArray(s.plantLibrary)){ const r=mergeLibrary(s.plantLibrary); toast(`Library: ${r.added} added, ${r.updated} updated`); render(); return; }
    const g=s&&s.garden?s.garden:s; if(!g||typeof g!=='object'||!g.plots) throw 0;
    if(s.library&&Array.isArray(s.library.customPlants)) mergeLibrary(s.library.customPlants); else if(Array.isArray(g.customPlants)) mergeLibrary(g.customPlants);
    delete g.customPlants; state=Object.assign(fresh(),g); state.house=state.house||{}; if(!state.propW){state.propW=state.cols*3; state.propD=state.rows*3;} save(); ui.sel=null; toast('Backup imported'); render(); }catch(e){ toast('That file is not a garden or library backup.'); } }; rd.readAsText(file); }
function importLibraryFile(file){ const rd=new FileReader(); rd.onload=()=>{ try{ const s=JSON.parse(rd.result); const list=Array.isArray(s)?s:s.plantLibrary||s.library?.customPlants||s.customPlants||s.garden?.customPlants; if(!Array.isArray(list)) throw 0; const r=mergeLibrary(list); toast(`Library: ${r.added} added, ${r.updated} updated`); render(); }catch(e){ toast('That file is not a plant library.'); } }; rd.readAsText(file); }

document.addEventListener('click',e=>{
  const g=e.target.closest('g.plot'); if(g){ selectPlot(g.dataset.k); return; }
  const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act;
  if(el.tagName==='A') e.preventDefault();
  switch(act){
    case 'tab': ui.tab=el.dataset.tab; ui.filter.q=''; render(); break;
    case 'select': selectPlot(el.dataset.k,true); break;
    case 'rotate': state.north=(state.north+45)%360; save(); state.setup?render():renderWizard(); break;
    case 'detail': showDetail(el.dataset.pid); break;
    case 'dlg-close': closeDialog(); break;
    case 'plant': doPlant(el.dataset.pid); break;
    case 'clear': clearPlot(el.dataset.mode); break;
    case 'log-harvest': { const pl=state.plots[ui.sel].plant; pl.harvests=(pl.harvests||0)+1; save(); toast(`Harvest #${pl.harvests} logged`); render(); break; }
    case 'task-add': { const t=$('#taskText').value.trim(); if(!t) return; const plot=state.plots[ui.sel]; plot.tasks=plot.tasks||[]; plot.tasks.push({id:Date.now(),text:t,due:$('#taskDue').value||null,done:false}); save(); render(); break; }
    case 'task-del': { const plot=state.plots[ui.sel]; plot.tasks=plot.tasks.filter(t=>String(t.id)!==el.dataset.id); save(); render(); break; }
    case 'custom-new': showCustomForm(null); break;
    case 'custom-edit': showCustomForm(el.dataset.pid); break;
    case 'custom-save': saveCustom(); break;
    case 'custom-del': { const id=el.dataset.pid; const inUse=Object.values(state.plots).some(p=>p.plant?.pid===id); if(inUse){ toast('Clear the plots using this plant first.'); return; } if(!confirm('Delete this plant from your library?')) return; library.customPlants=library.customPlants.filter(c=>c.id!==id); saveLibrary(); closeDialog(); render(); break; }
    case 'wiz-zone': state.zone=el.dataset.zone; save(); renderWizard(); break;
    case 'wiz-next': if(ui.wizStep===1){ const w=Math.max(3,Math.min(300,Number($('#wW').value)||80)), d=Math.max(3,Math.min(300,Number($('#wD').value)||120)); const {rows:r,cols:c}=dimsFromProperty(w,d); state.propW=w; state.propD=d; state.rows=r; state.cols=c; state.settings.zoom=null; state.name=$('#wName').value.trim()||'My garden'; [state.plots,state.house].forEach(o=>Object.keys(o).forEach(k=>{const [rr,cc]=k.split('-').map(Number); if(rr>=r||cc>=c) delete o[k];})); } ui.wizStep++; save(); renderWizard(); break;
    case 'wiz-back': ui.wizStep=Math.max(0,ui.wizStep-1); renderWizard(); break;
    case 'wiz-finish': state.setup=true; ui.wizStep=0; save(); render(); { const first=Object.keys(state.plots)[0]; if(first) scrollToPlot(first); } break;
    case 'brush': ui.brush=el.dataset.brush; document.querySelectorAll('[data-act="brush"]').forEach(b=>b.classList.toggle('active',b.dataset.brush===ui.brush)); break;
    case 'zoom': { const cur=cellPx(); state.settings.zoom = el.dataset.z==='fit'?null: el.dataset.z==='+'?Math.min(100,cur+16):Math.max(20,cur-16); save(); render(); if(ui.sel) scrollToPlot(ui.sel); break; }
    case 'export-lib': exportLibrary(); break;
    case 'import-lib': $('#importLibFile').click(); break;
    case 'lib-clear': { const used=library.customPlants.filter(c=>Object.values(state.plots).some(p=>p.plant?.pid===c.id)); if(used.length){ toast(`Clear plots using ${used[0].n} first.`); return; } if(!confirm(`Delete all ${library.customPlants.length} custom plants from the shared library?`)) return; library.customPlants=[]; saveLibrary(); render(); break; }
    case 'edit-layout': state.setup=false; ui.wizStep=1; save(); renderWizard(); break;
    case 'set-date-clear': state.settings.dateOverride=null; save(); render(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': if(confirm('Delete this garden — layout, plantings, history and reminders? Your custom plant library is kept. Export a backup first if you want to keep anything.')){ state=fresh(); save(); ui.sel=null; ui.wizStep=0; render(); } break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act;
  switch(act){
    case 'exposure': state.plots[ui.sel].exposure=el.value; save(); render(); break;
    case 'filter-cat': ui.filter.cat=el.value; render(); break;
    case 'filter-sort': ui.filter.sort=el.value; render(); break;
    case 'filter-shoulder': ui.filter.shoulder=el.checked; render(); break;
    case 'cal-cat': ui.calCat=el.value; render(); break;
    case 'task-toggle': { const t=state.plots[ui.sel].tasks.find(t=>String(t.id)===el.dataset.id); if(t){t.done=el.checked; save(); render();} break; }
    case 'notes': state.plots[ui.sel].plant.notes=el.value; save(); break;
    case 'set-name': state.name=el.value.trim()||'My garden'; save(); render(); break;
    case 'set-zone': state.zone=el.value; save(); render(); break;
    case 'set-date': state.settings.dateOverride=el.value||null; save(); render(); break;
    case 'set-theme': state.settings.theme=el.value; save(); render(); break;
  }
  if(e.target.id==='importFile' && e.target.files[0]) importData(e.target.files[0]);
  if(e.target.id==='importLibFile' && e.target.files[0]) importLibraryFile(e.target.files[0]);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act="filter-q"]'); if(!el) return;
  ui.filter.q=el.value; const pb=$('#panelBody'); const pos=el.selectionStart; pb.innerHTML=renderPanel(); const n=pb.querySelector('[data-act="filter-q"]'); if(n){n.focus(); n.setSelectionRange(pos,pos);}
});
document.addEventListener('blur',e=>{ const el=e.target.closest?.('[data-act="rename"]'); if(el&&ui.sel){ const v=el.textContent.trim().slice(0,24); state.plots[ui.sel].name=v||null; save(); render(); } },true);
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.closest?.('[data-act="rename"]')){ e.preventDefault(); e.target.blur(); }
  if(e.key==='Enter' && e.target.id==='taskText'){ $('[data-act="task-add"]')?.click(); }
  if((e.key==='Enter'||e.key===' ') && e.target.closest?.('g.plot')){ e.preventDefault(); selectPlot(e.target.closest('g.plot').dataset.k); } });
dlg().addEventListener('click',e=>{ if(e.target===dlg()) closeDialog(); });

/* ============================================================ boot */
state=load(); library=loadLibrary(); migrateLibrary();
render();
</script>
</body>
</html>
